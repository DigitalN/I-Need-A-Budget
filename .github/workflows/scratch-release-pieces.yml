# SPDX-License-Identifier: GPL-3.0-only
# SCRATCH, deleted before the pull request: tries the release workflow's pieces on a stand-in app quickly.
name: Scratch (release pieces)

on:
  push:
    branches: [claude/strange-wilbur-14467d]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r scripts/dmg-requirements.txt
      - name: A stand-in app
        run: |
          set -euo pipefail
          sw_vers; which -a openssl bash; openssl version; /usr/bin/openssl version; bash --version | head -1
          app="$RUNNER_TEMP/app/I Need A Budget.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          echo 'int main(void) { return 0; }' | clang -x c - -mmacosx-version-min=12.0 -o "$app/Contents/MacOS/I Need A Budget"
          cp "Application Files/INeedABudget.icns" "$app/Contents/Resources/"
          python - "$app" <<'PY'
          import plistlib, sys
          with open(sys.argv[1] + "/Contents/Info.plist", "wb") as f:
              plistlib.dump({"CFBundleIdentifier": "com.digitaln.ineedabudget", "CFBundleName": "I Need A Budget",
                             "CFBundleExecutable": "I Need A Budget", "CFBundleIconFile": "INeedABudget.icns",
                             "CFBundleShortVersionString": "9.9.9", "CFBundleVersion": "9.9.9",
                             "CFBundlePackageType": "APPL", "LSMinimumSystemVersion": "12.0"}, f)
          PY
          python scripts/check-mac-app.py "$app"
      - name: Sign it
        run: scripts/sign-mac.sh --throwaway "$RUNNER_TEMP/ids" "$RUNNER_TEMP/app/I Need A Budget.app"
      - name: The real path refuses without secrets
        run: |
          cp -R "$RUNNER_TEMP/app" "$RUNNER_TEMP/app2"
          if scripts/sign-mac.sh "$RUNNER_TEMP/app2/I Need A Budget.app"; then echo "signed without secrets?!"; exit 1; fi
      - name: Clean
        if: always()
        run: scripts/sign-mac.sh --clean; security list-keychains -d user
      - name: Disk image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          head -c 1000 /dev/urandom > "$RUNNER_TEMP/release/I-Need-A-Budget-9.9.9-Setup.exe"
          scripts/sign-windows.sh --throwaway "$RUNNER_TEMP/ids" "$RUNNER_TEMP/release/I-Need-A-Budget-9.9.9-Setup.exe"
          dmg="$RUNNER_TEMP/release/I-Need-A-Budget-9.9.9.dmg"
          python scripts/make-dmg.py "$RUNNER_TEMP/app/I Need A Budget.app" "$dmg"
          hdiutil verify "$dmg"
          python scripts/make-dmg.py --check "$dmg" --version 9.9.9 --test-identity "$(cat "$RUNNER_TEMP/ids/test-identity")"
          if python scripts/make-dmg.py --check "$dmg" --version 9.9.9; then echo "passed as team-signed?!"; exit 1; fi
      - name: Update check against 1.4.3
        run: |
          set -euo pipefail
          gh release download v1.4.3 --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir "$RUNNER_TEMP/previous"
          mount=$(hdiutil attach "$RUNNER_TEMP/previous/"*.dmg -nobrowse -readonly -noautoopen | grep -o '/Volumes/.*$')
          mkdir -p "$HOME/Applications"
          ditto "$mount/I Need A Budget.app" "$HOME/Applications/I Need A Budget.app"
          python - "$mount" <<'PY'
          import sys
          import ds_store.store as st
          st.codecs = {k: v for k, v in st.codecs.items() if k not in (b"pBBk", b"pBB0")}
          from ds_store import DSStore
          with DSStore.open(sys.argv[1] + "/.DS_Store", "r") as d:
              for e in d:
                  v = e.value
                  if e.code == b"icvp":
                      v = {k: x for k, x in v.items() if k != "backgroundImageAlias"}
                  if isinstance(v, (bytes, bytearray)):
                      v = f"<{len(v)} bytes>"
                  print("1.4.3:", repr(e.filename), e.code, v)
          PY
          hdiutil detach "$mount" -quiet
          dmg="$RUNNER_TEMP/release/I-Need-A-Budget-9.9.9.dmg"
          python scripts/check-update.py "$dmg" "$HOME/Applications/I Need A Budget.app" --test-identity "$(cat "$RUNNER_TEMP/ids/test-identity")"
          if python scripts/check-update.py "$dmg" "$HOME/Applications/I Need A Budget.app"; then echo "1.4.3 took a throwaway-signed app?!"; exit 1; fi
          mount=$(hdiutil attach "$dmg" -nobrowse -readonly -noautoopen | grep -o '/Volumes/.*$')
          ls -la "$mount"; GetFileInfo -a "$mount"
          hdiutil detach "$mount" -quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scratch-dmg
          path: ${{ runner.temp }}/release/I-Need-A-Budget-9.9.9.dmg
          retention-days: 1

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Stand-in installed copy and installer
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          source = ('[assembly: System.Reflection.AssemblyFileVersion("V")]\n[assembly: System.Reflection.AssemblyInformationalVersion("V")]\n'
                    'public static class S { public static int Main() { return 0; } }\n')
          def make(path, version):
              path.parent.mkdir(parents=True, exist_ok=True)
              cs = path.with_suffix(".cs")
              cs.write_text(source.replace("V", version), encoding="utf-8")
              env = dict(os.environ, SRC=str(cs), OUT=str(path))
              subprocess.run(["powershell.exe", "-NoProfile", "-NonInteractive", "-Command",
                              "Add-Type -TypeDefinition ([IO.File]::ReadAllText($env:SRC)) -OutputAssembly $env:OUT -OutputType ConsoleApplication"],
                             env=env, check=True)
              cs.unlink()
          installed = Path(os.environ["LOCALAPPDATA"]) / "Programs" / "I Need A Budget"
          (installed / "_internal").mkdir(parents=True, exist_ok=True)
          make(installed / "I Need A Budget.exe", "1.5.0.0")
          make(Path(os.environ["RUNNER_TEMP"]) / "release" / "I-Need-A-Budget-9.9.9-Setup.exe", "9.9.9.0")
          PY
          setup="$RUNNER_TEMP/release/I-Need-A-Budget-9.9.9-Setup.exe"
          PYTHON=python scripts/sign-windows.sh --throwaway "$RUNNER_TEMP/ids" "$setup"
          cp "$RUNNER_TEMP/ids/test-key.pub" "$LOCALAPPDATA/Programs/I Need A Budget/_internal/release-key.pub"
          python scripts/check-update.py "$setup"
          python scripts/check-update.py "$setup" --test-key "$RUNNER_TEMP/ids/test-key.pub"
          echo x > "$LOCALAPPDATA/Programs/I Need A Budget/_internal/release-key.pub.other"
          printf 'x' >> "$setup"
          if python scripts/check-update.py "$setup"; then echo "took a changed installer?!"; exit 1; fi
