async function inboxAction(btn, e) {
  const act = btn.dataset.act;
  const id = Number(btn.dataset.id);
  const card = btn.closest('.item');
  if (card) { state.inboxSel = Number(card.dataset.index); markSelected(false); }
  if (btn.dataset.pick) return fileBlock(Number(card.dataset.index), Number(btn.dataset.pick));
  if (act === 'other' || act === 'other-group') {
    const cid = await pickCategory(btn);
    if (cid) await fileBlock(Number(card.dataset.index), cid);
  } else if (act === 'expand') { state.expanded.add(btn.dataset.group); await renderInbox(); }
  else if (act === 'inbox-payee') {
    const id = btn.dataset.payee ? Number(btn.dataset.payee) : null;
    state.inboxFind.payee = state.inboxFind.payee === id ? null : id;
    state.inboxSel = 0; drawInbox();
  } else if (act === 'inbox-clear') { state.inboxFind = { text: '', payee: null }; state.inboxSel = 0; drawInbox(); }
  else if (act === 'transfer') { if (await transferDialog(id)) await renderInbox(); }
  else if (act === 'split') { if (await splitDialog(id)) await renderInbox(); }
  else if (act === 'rename') { if (await renameDialog(id)) await renderInbox(); }
  else if (act === 'same') {
    await call('same_payee', [id, btn.dataset.yes === '1']);
    await renderInbox();
  } else if (act === 'sub-link') {
    await call('link_subscription', [id, Number(btn.dataset.sub)]);
    toast('New price saved', { action: undoAction }); await renderInbox();
  } else if (act === 'sub-new') { if (await newSubscriptionDialog(id)) await renderInbox(); }
  else if (act === 'always-ask') {
    await call('set_always_ask', [Number(btn.dataset.payee), btn.dataset.on === '1']);
    toast(btn.dataset.on === '1' ? 'Each one gets its own card now, and none are filed without asking' : 'Grouped on one card again', { action: undoAction });
    await renderInbox();
  } else if (act === 'accept-all') await acceptAll();
  else if (act === 'save-balance') await saveBalanceFrom(btn);
  else if (act === 'merge-account') {
    const a = state.inbox.alerts.find(x => x.type === 'duplicate' && x.account_id === Number(btn.dataset.account));
    if (a) await mergeAccount(a.account_id, a.into_id, a.name, a.into_name);
  } else if (act === 'recat') {
    const cid = await pickCategory(btn);
    if (!cid) return;
    await call('update_transaction', [id, { category_id: cid }]);
    toast(`Changed to ${catName(cid)}`, { action: undoAction }); await renderInbox();
  }
}

function duplicateNotice(d) {
  return `<div class="notice">${esc(d.name)} looks like a copy of ${esc(d.into_name)}: ${d.shared} of its ${plural(d.total, 'transaction')} are in both.<span class="spacer"></span>
    <button class="btn small" data-act="merge-account" data-account="${d.account_id}" data-into="${d.into_id}">Merge into ${esc(d.into_name)}</button></div>`;
}

// One account into another (the same account imported twice). Undoable.
const mergeText = (from, into) => `Transactions already in ${into} are dropped, the rest move over, and ${from} is removed. You can undo it right after.`;
async function mergeAccount(fromId, intoId, fromName, intoName, ask = true) {
  if (ask && !await confirmBox(`Merge ${fromName} into ${intoName}?`, mergeText(fromName, intoName), 'Merge')) return;
  const r = await call('merge_accounts', [fromId, intoId]);
  await loadCategories();
  toast(`Merged into ${r.into}: ${plural(r.moved, 'transaction')} moved, ${plural(r.dropped, 'copy', 'copies')} removed`, { action: undoAction });
  await refresh();
}

async function saveBalanceFrom(btn) {
  const acct = Number(btn.dataset.account);
  const input = $(`[data-balance-for="${acct}"]`);
  const cents = parseMoney(input.value);
  if (cents === null || Number.isNaN(cents)) return toast('Enter the balance Tangerine shows', { error: true });
  await call('set_balance', [acct, cents]);
  toast('Balance saved', { action: undoAction });
  await refresh();
}

function inboxKeys(e) {
  if (state.page !== 'inbox' || !state.blocks || !state.blocks.length) return;
  if (e.target.closest('input, textarea, select, dialog, .popover')) return;
  const b = state.blocks[state.inboxSel];
  const card = $(`.item[data-index="${state.inboxSel}"]`);
  if (e.key === 'ArrowDown' || e.key === 'j') { state.inboxSel = Math.min(state.inboxSel + 1, state.blocks.length - 1); markSelected(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { state.inboxSel = Math.max(state.inboxSel - 1, 0); markSelected(); e.preventDefault(); }
  else if (e.key === 'Enter') { const chip = card && card.querySelector('[data-pick]'); if (chip) { e.preventDefault(); fileBlock(state.inboxSel, Number(chip.dataset.pick)); } }
  else if (/^[1-4]$/.test(e.key)) { const chip = card && card.querySelectorAll('[data-pick]')[Number(e.key) - 1]; if (chip) { e.preventDefault(); fileBlock(state.inboxSel, Number(chip.dataset.pick)); } }
  else if (e.key === '/') { const o = card && card.querySelector('[data-act^="other"]'); if (o) { e.preventDefault(); o.click(); } }
  else if (e.key === 't' && b.items.length === 1) { e.preventDefault(); inboxAction(card.querySelector('[data-act="transfer"]')); }
  else if (e.key === 's' && b.items.length === 1) { e.preventDefault(); inboxAction(card.querySelector('[data-act="split"]')); }
}

// ── transactions ────────────────────────────────────────
async function renderTransactions() {
  if (!state.categories.length) await loadCategories();
  await loadAccounts();
  const f = state.txFilters;
  const data = await call('transactions', [{ ...f, limit: 1000 }]);
  state.txns = data;
  const months = state.view ? state.view.months : [];
  const catOptions = state.categories.map(g => `<optgroup label="${esc(g.name)}">${g.categories.map(c => `<option value="${c.id}" ${f.category_id == c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  const rows = data.items.map(t => `<tr class="clickable" data-tx="${t.id}">
      <td class="muted nowrap">${dayYear(t.date)}</td>
      <td class="small muted">${esc(t.account_name)}</td>
      <td>${esc(t.payee_name || t.raw_name)}${t.subscription_name ? ` <span class="tag info">${esc(t.subscription_name)}</span>` : ''}${t.note ? ` <span class="faint small">· ${esc(t.note)}</span>` : ''}${t.status === 'review' ? ' <span class="tag warn">to review</span>' : ''}</td>
      <td>${t.transfer_account_name ? `<span class="tag">${t.amount < 0 ? 'To' : 'From'} ${esc(t.transfer_account_name)}</span>` :
            t.is_split ? `<span class="tag">Split</span> <span class="small muted">${esc(t.splits.map(s => s.category_name).join(', '))}</span>` :
            `<button class="link" data-act="tx-cat" data-id="${t.id}">${esc(t.category_name || 'No category')}</button>`}</td>
      <td class="r num ${t.amount > 0 ? 'pos' : ''}">${money(t.amount)}</td></tr>`).join('');
  frame(`
    <div class="page-head"><h1>Transactions</h1><span class="spacer"></span><button class="btn" data-act="add-tx">Add transaction…</button></div>
    <div class="row wrap" style="margin-bottom:12px">
      <input type="search" id="tx-search" placeholder="Search payee, description, note or amount" style="flex:1;min-width:220px" value="${esc(f.search || '')}">
      <select id="tx-account"><option value="">All accounts</option>${state.accounts.map(a => `<option value="${a.id}" ${f.account_id == a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <select id="tx-month"><option value="">All months</option>${[...months].reverse().map(m => `<option value="${m}" ${f.month === m ? 'selected' : ''}>${monthLong(m)}</option>`).join('')}</select>
      <select id="tx-category"><option value="">All categories</option>${catOptions}</select>
    </div>
    <div class="card" style="padding:4px 8px">
      ${data.items.length ? `<table><thead><tr><th>Date</th><th>Account</th><th>Payee</th><th>Category</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
        <p class="small muted" style="padding:4px 10px">${plural(data.items.length, 'transaction')} · total ${money(data.total)}</p>`
        : '<div class="empty"><b>No transactions</b>Nothing matches these filters.</div>'}
    </div>`);
  const refetch = debounce(() => renderTransactions(), 250);
  $('#tx-search').addEventListener('input', e => { f.search = e.target.value; refetch(); });
  $('#tx-account').addEventListener('change', e => { f.account_id = e.target.value || null; renderTransactions(); });
  $('#tx-month').addEventListener('change', e => { f.month = e.target.value || null; renderTransactions(); });
  $('#tx-category').addEventListener('change', e => { f.category_id = e.target.value || null; renderTransactions(); });
  if (f.search) { const s = $('#tx-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

async function editTransaction(id) {
  const t = findTx(id);
  if (!t) return;
  const v = await dialog({
    title: t.payee_name || t.raw_name || 'Transaction',
    body: `<div class="grid2">
        <div class="field"><label>Date</label>${t.manual ? `<input type="date" id="ed-date" value="${t.date}">` : `<div>${dayYear(t.date)}</div>`}</div>
        <div class="field"><label>Amount</label>${t.manual ? `<input id="ed-amount" value="${moneyPlain(t.amount)}">` : `<div class="num ${t.amount > 0 ? 'pos' : ''}">${money(t.amount)}</div>`}</div></div>
      <div class="field"><label>Account</label><div>${esc(t.account_name)}</div></div>
      ${t.raw_name ? `<div class="field"><label>The bank wrote</label><div class="small" style="font-family:ui-monospace,Menlo,monospace">${esc(t.raw_name)}${t.raw_memo ? '<br>' + esc(t.raw_memo) : ''}</div></div>` : ''}
      <div class="field"><label>Note</label><input id="ed-note" value="${esc(t.note || '')}"></div>
      ${t.reason ? `<p class="small muted">💡 ${esc(t.reason)}</p>` : ''}`,
    actions: [{ label: 'Delete', value: 'delete', danger: true, left: true },
      { label: 'Payee…', value: 'payee' }, { label: 'Split…', value: 'split' }, { label: 'Transfer…', value: 'transfer' },
      { label: 'Save', value: 'save', primary: true }],
  });
  if (!v) return;
  if (v === 'save') {
    const changes = {};
    if ($('#ed-note').value !== (t.note || '')) changes.note = $('#ed-note').value;
    if (t.manual) {
      if ($('#ed-date').value && $('#ed-date').value !== t.date) changes.date = $('#ed-date').value;
      const a = parseMoney($('#ed-amount').value);
      if (!Number.isNaN(a) && a !== null && a !== t.amount) changes.amount = a;
    }
    if (!Object.keys(changes).length) return;  // nothing changed: just close
    await call('update_transaction', [id, changes]);
    toast('Saved', { action: undoAction });
  } else if (v === 'delete') {
    const ok = await confirmBox('Delete this transaction?', t.manual ? 'It will be removed.' : 'It will be removed. If you import a file that contains it again, it comes back.', 'Delete', true);
    if (!ok) return;
    await call('delete_transaction', [id]);
    toast('Deleted', { action: undoAction });
  } else if (v === 'payee') { if (!await renameDialog(id)) return; }
  else if (v === 'split') { if (!await splitDialog(id)) return; }
  else if (v === 'transfer') { if (!await transferDialog(id)) return; }
  await refresh();
}

      : (d.estimate_payment ? 'At this payment the interest grows faster than you pay it down.' : 'Enter a monthly payment to see when it\'s paid off.');
    return `<div class="card">
      <div class="row"><b>${esc(d.name)}</b><span class="spacer"></span><span class="tag ${d.not_covered ? 'warn' : 'good'}">${d.not_covered ? money(d.not_covered) + ' not covered' : 'Covered'}</span></div>
      <div class="grid2" style="margin-top:10px">
        <div><div class="muted small">You owe</div><div class="bal num">${money(d.owing)}</div>
          <div class="small muted">Set aside to pay it: <b>${money(d.set_aside)}</b></div></div>
        <div><div class="muted small">Interest & fees, last 6 months</div>
          <div class="mini-bars" title="${esc(d.interest.map(i => monthShort(i.month) + ' ' + money(i.amount)).join(', '))}">${d.interest.map(i => `<div style="height:${i.amount / maxI * 100}%"></div>`).join('')}</div>

const mergeTargets = (accounts, a) => accounts.filter(x => x.id !== a.id && !x.closed && x.is_debt === a.is_debt);

async function accountAction(btn) {
  const act = btn.dataset.act, id = Number(btn.dataset.account);
  const a = state.accounts.find(x => x.id === id);
  if (act === 'save-balance') return saveBalanceFrom(btn);
  if (act === 'merge-account') {
    const into = state.accounts.find(x => x.id === Number(btn.dataset.into));
    return mergeAccount(a.id, into.id, a.name, into.name);
  }
  if (act === 'merge-pick') {
    const targets = mergeTargets(state.accounts, a);
    const v = await dialog({
      title: `Merge ${a.name} into…`,
      body: `<div class="field"><label>The same account as</label><select id="merge-into">${targets.map(x => `<option value="${x.id}" ${a.duplicate_of && a.duplicate_of.into_id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
        <p class="small muted">${esc(mergeText(a.name, 'that account'))}</p>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Merge', value: 'ok', primary: true }],
    });
    if (v !== 'ok') return;
    const into = targets.find(x => x.id === Number($('#merge-into').value));
    return mergeAccount(a.id, into.id, a.name, into.name, false);
  }
  if (act === 'check-balance') {
    const v = await dialog({
      title: `Check ${a.name}`,
      body: `<p class="muted">The app says ${a.is_debt ? 'you owe' : 'the balance is'} <b>${money(a.is_debt ? -a.balance : a.balance)}</b> after the last imported transaction (${dayYear(a.last_date)}).
        If Tangerine shows something else, enter it: the app adds an adjustment for the difference${a.is_debt ? '' : ' (you choose its category in the Inbox)'}.</p>
        <div class="field"><label>${a.is_debt ? 'Amount owing on Tangerine' : 'Balance on Tangerine'}</label><input id="rec-amount" style="text-align:right"></div>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Match it', value: 'ok', primary: true }],
    });
    if (v !== 'ok') return;
    const cents = parseMoney($('#rec-amount').value);
    if (cents === null || Number.isNaN(cents)) return;
    const r = await call('reconcile', [id, cents]);
    toast(r.adjusted ? `Adjusted by ${money(r.adjusted)}` : 'It already matches', { action: r.adjusted ? undoAction : undefined });
  } else if (act === 'rename-account') {
    const v = await dialog({ title: 'Rename account', body: `<div class="field"><label>Name</label><input id="acct-name" value="${esc(a.name)}"></div>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', primary: true }] });
    if (v !== 'ok') return;
    await call('update_account', [id, { name: $('#acct-name').value }]);
    await loadCategories();
  } else if (act === 'delete-account') {
    if (!await confirmBox(`Delete ${a.name}?`, `This deletes the account and its ${plural(a.transactions, 'transaction')}. You can undo it right after.`, 'Delete', true)) return;
    await call('delete_account', [id]);
    await loadCategories();
    toast('Account deleted', { action: undoAction });
  } else if (act === 'save-debt') {
    const apr = $(`[data-apr="${id}"]`).value.trim();
    const pay = parseMoney($(`[data-payment="${id}"]`).value);
    await call('update_account', [id, { apr: apr === '' ? null : Number(apr), planned_payment: Number.isNaN(pay) ? null : pay }]);
    toast('Saved');
  } else if (act === 'add-account') {
    const v = await dialog({
      title: 'Add an account',
      body: `<p class="small muted">Accounts are added on their own when you import their files. Add one here for something else, like a line of credit.</p>
        <div class="field"><label>Name</label><input id="na-name" placeholder="Line of credit"></div>
        <div class="grid2"><div class="field"><label>Type</label><select id="na-kind"><option value="line_of_credit">Line of credit</option><option value="credit_card">Credit card</option><option value="chequing">Chequing</option><option value="savings">Savings</option><option value="cash">Cash</option></select></div>
        <div class="field"><label>Balance now (owing, for credit)</label><input id="na-balance" placeholder="0.00" style="text-align:right"></div></div>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', primary: true, check: d => $('#na-name', d).value.trim() ? null : 'Give it a name.' }],
    });
    if (v !== 'ok') return;
    const bal = parseMoney($('#na-balance').value);
    await call('add_account', { name: $('#na-name').value, kind: $('#na-kind').value, balance: Number.isNaN(bal) ? null : bal });
    await loadCategories();
    toast('Account added', { action: undoAction });
  } else if (act === 'undo-import') {
    if (!await confirmBox('Remove this import?', 'Deletes the transactions this file added.', 'Remove', true)) return;
    const r = await call('undo_import', [Number(btn.dataset.import)]);
    toast(`Removed ${plural(r.removed, 'transaction')}`, { action: undoAction });
  }
  await renderAccounts();
}

const per = c => ({ monthly: '/mo', yearly: '/yr', weekly: '/wk' }[c] || '');
const PRICING_LABELS = {
  fixed: 'Same Price',
  currency: 'Same Price, Different Currency',
  varies: 'Fluctuates Every Time',
};
const pricingSelect = (id, value) => `<select id="${id}">${Object.entries(PRICING_LABELS).map(([k, label]) =>
  `<option value="${k}" ${(value || 'fixed') === k ? 'selected' : ''}>${label}</option>`).join('')}</select>`;
function priceCell(x) {
  if (x.pricing === 'varies') {
    return `≈ ${money(x.amount)}<span class="muted small">${per(x.cadence)}</span>
      ${x.low !== null && x.low !== undefined ? `<div class="small muted">${money(x.low)}–${money(x.high)}${x.last_amount ? ` · last ${money(x.last_amount)}` : ''}</div>` : ''}`;
  }
  const was = x.previous_amount ? `<div><span class="tag ${x.amount > x.previous_amount ? 'warn' : 'good'}">was ${money(x.previous_amount)}</span></div>` : '';
  if (x.pricing === 'currency') return `≈ ${money(x.amount)}<span class="muted small">${per(x.cadence)}</span><div class="small muted">different currency</div>${was}`;
  return `${money(x.amount)}<span class="muted small">${per(x.cadence)}</span>${was}`;
}

      <td class="r num nowrap">${priceCell(x)}</td>

        ${x.ends_on ? `<div class="small ${x.charged_after_end.length ? 'neg' : 'muted'}">${x.ended ? 'ended' : 'ends'} ${dayYear(x.ends_on)}${x.ending_soon ? ' <span class="tag warn">ending soon</span>' : ''}${x.charged_after_end.length ? ' · charged after it ended' : ''}</div>` : ''}</td>

          : `${c.pricing === 'currency' ? '≈ ' : ''}${money(c.amount)}${per(c.cadence)} · charged ${plural(c.count, 'time')}, last on ${dayYear(c.last_date)}${c.pricing === 'currency' ? ' · different currency' : ''}${c.previous_amount ? ` · was ${money(c.previous_amount)}` : ''}`}</div></div>
      <div class="amount">${money(c.monthly)}<span class="muted small">/mo</span></div>

        <button class="btn small ${c.kind === 'bill' ? 'primary' : ''}" data-act="sug-track" data-i="${i}" data-kind="bill">Track as bill…</button>

  const cancelled = s.cancelled.map(x => `<tr><td><b>${esc(x.name)}</b></td><td class="small muted">cancelled ${dayYear(x.cancelled_on)}</td>
      <td>${x.charged_after_cancel.length ? `<span class="tag bad">Charged again ${x.charged_after_cancel.map(c => day(c.date) + ' ' + money(-c.amt)).join(', ')}</span>` : '<span class="tag good">No charges since</span>'}</td>
      <td class="r"><button class="btn small" data-act="sub-reactivate" data-sub="${x.id}">Active again</button> <button class="icon-btn danger" data-act="sub-delete" data-sub="${x.id}" title="Stop tracking">✕</button></td></tr>`).join('');
  frame(`
    <div class="page-head"><h1>Subscriptions</h1><span class="spacer"></span><button class="btn" data-act="sub-add">Add one…</button></div>
    <div class="stack">
      <div class="grid2">
        <div class="card"><div class="muted">Subscriptions</div><div class="rta num">${money(s.monthly_subscriptions)}<span class="muted" style="font-size:15px"> a month</span></div><div class="small muted">${money(s.monthly_subscriptions * 12)} a year</div></div>
        <div class="card"><div class="muted">Bills</div><div class="rta num">${money(s.monthly_bills)}<span class="muted" style="font-size:15px"> a month</span></div><div class="small muted">${money(s.monthly_bills * 12)} a year</div></div>
      </div>
      ${s.cancelled.some(x => x.charged_after_cancel.length) ? `<div class="notice bad">Something you cancelled has charged you again. See Cancelled below.</div>` : ''}

      ${sugg ? `<div><h2>Found in your transactions</h2><p class="small muted" style="margin-top:-6px">Name each one (Apple, for example, bills iCloud+ and Apple Music separately: each price is its own subscription).</p><div class="items">${sugg}</div></div>` : ''}
      <div class="card"><h2>Subscriptions</h2>${table(s.subscriptions, 'None tracked yet. Track one from the suggestions above, or add one.')}</div>
      <div class="card"><h2>Bills</h2>${table(s.bills, 'No bills tracked yet.')}</div>
      ${cancelled ? `<div class="card"><h2>Cancelled</h2><p class="small muted" style="margin-top:-6px">Watched in case they charge you anyway.</p><table><tbody>${cancelled}</tbody></table></div>` : ''}

async function subscriptionAction(btn) {
  const act = btn.dataset.act;
  const s = state.subs;
  if (act === 'sug-track') {
    const c = s.suggested[Number(btn.dataset.i)];
    const x = { name: c.name, amount: c.amount, cadence: c.cadence, kind: btn.dataset.kind, category_id: c.category_id, pricing: c.pricing };
    const v = await dialog({ title: `Track ${c.name} at ${money(c.amount)}`, body: subFormHtml(x, false), onOpen: bindSubForm,
      actions: [{ label: 'Cancel', value: null }, { label: 'Track it', value: 'ok', primary: true, check: d => $('#sf-name', d).value.trim() ? null : 'Give it a name.' }] });
    if (v !== 'ok') return;
    const cat = $('#sf-cat').dataset.id;
    const id = await call('track_subscription', { candidate: c, kind: $('#sf-kind').value, name: $('#sf-name').value, category_id: cat ? Number(cat) : null, pricing: $('#sf-pricing').value, ends_on: $('#sf-ends').value || null });
    const note = $('#sf-note').value, cadence = $('#sf-cadence').value;
    const amount = parseMoney($('#sf-amount').value);
    const priceChanged = amount && !Number.isNaN(amount) && Math.abs(amount) !== c.amount;
    if (note || cadence !== c.cadence || priceChanged) {
      await call('update_subscription', [id, { note, cadence, ...(priceChanged ? { amount: Math.abs(amount) } : {}) }]);
    }
    toast(`Tracking ${$('#sf-name').value}`, { action: undoAction });
  } else if (act === 'sug-dismiss') {
    await call('dismiss_subscription', [s.suggested[Number(btn.dataset.i)]]);
    toast('Won\'t suggest that again', { action: undoAction });
  } else if (act === 'sub-add') {
    const payees = await call('payees');
    const v = await dialog({ title: 'Add a subscription', body: subFormHtml({ cadence: 'monthly', kind: 'subscription' }, true),
      onOpen: d => { bindSubForm(d); $('#sf-payees', d).innerHTML = payees.map(p => `<option value="${esc(p.name)}">`).join(''); },
      actions: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', primary: true, check: d => {
        if (!$('#sf-payee', d).value.trim()) return 'Who charges it?';
        if (!$('#sf-name', d).value.trim()) return 'Give it a name.';
        const a = parseMoney($('#sf-amount', d).value); return (!a || Number.isNaN(a)) ? 'Enter the price.' : null;
      } }] });
    if (v !== 'ok') return;
    const cat = $('#sf-cat').dataset.id;
    const id = await call('add_subscription', { payee: $('#sf-payee').value, name: $('#sf-name').value, amount: Math.abs(parseMoney($('#sf-amount').value)),
      cadence: $('#sf-cadence').value, kind: $('#sf-kind').value, category_id: cat ? Number(cat) : null, pricing: $('#sf-pricing').value,
      ends_on: $('#sf-ends').value || null });
    if ($('#sf-note').value) await call('update_subscription', [id, { note: $('#sf-note').value }]);
    toast(`Tracking ${$('#sf-name').value}`, { action: undoAction });
  } else if (act === 'sub-edit') {
    const x = [...s.subscriptions, ...s.bills].find(y => y.id === Number(btn.dataset.sub));
    const v = await dialog({ title: `Edit ${x.name}`, body: subFormHtml(x, false), onOpen: bindSubForm,
      actions: [{ label: 'Stop tracking', value: 'delete', danger: true, left: true }, { label: 'Cancel', value: null }, { label: 'Save', value: 'ok', primary: true }] });
    if (v === 'delete') { await call('delete_subscription', [x.id]); toast('Stopped tracking', { action: undoAction }); }
    else if (v === 'ok') {
      const cat = $('#sf-cat').dataset.id;
      const amount = parseMoney($('#sf-amount').value);
      await call('update_subscription', [x.id, { name: $('#sf-name').value, kind: $('#sf-kind').value, cadence: $('#sf-cadence').value,
        note: $('#sf-note').value, category_id: cat ? Number(cat) : null, pricing: $('#sf-pricing').value, ends_on: $('#sf-ends').value || null,
        ...(amount && !Number.isNaN(amount) ? { amount: Math.abs(amount) } : {}) }]);
      toast('Saved', { action: undoAction });
    } else return;
  } else if (act === 'sub-cancel') {
    const x = [...s.subscriptions, ...s.bills].find(y => y.id === Number(btn.dataset.sub));
    if (!await confirmBox(`Mark ${x.name} as cancelled?`, 'It moves to Cancelled, and if it charges you again you\'ll be told in the Inbox.', 'Mark cancelled')) return;
    await call('cancel_subscription', [x.id]);
    toast(`${x.name} marked cancelled`, { action: undoAction });
  } else if (act === 'sub-reactivate') { await call('reactivate_subscription', [Number(btn.dataset.sub)]); }
  else if (act === 'sub-delete') { await call('delete_subscription', [Number(btn.dataset.sub)]); toast('Stopped tracking', { action: undoAction }); }
  await renderSubscriptions();
}

// ── settings ────────────────────────────────────────────
async function renderSettings() {
  const [settings, info, months] = await Promise.all([call('get_settings'), call('app_info'), call('onboarding_state')]);
  let upd = info.updates || state.update || null;
  const live = await window.pywebview.api.call('window_action', ['update_state']);  // quiet: absent in the preview
  if (live && live.ok) upd = live.result;
  state.update = upd;
  const updText = !upd ? 'Updates work in the installed app.' :
    upd.unavailable ? `Off: ${upd.unavailable}.` :
    upd.status === 'checking' ? 'Checking…' : upd.status === 'downloading' ? `Downloading ${upd.version}…` :
    upd.status === 'ready' ? `Version ${upd.version} is ready; it's installed when you quit.` :
    upd.error ? `Last check failed: ${upd.error}` : `You have ${upd.current}.`;
  frame(`
    <div class="page-head"><h1>Settings</h1></div>
    <div class="stack">
      <div class="card">
        <div class="settings-row"><div class="what"><b>Appearance</b></div>
          <div class="seg" id="theme">${['system', 'light', 'dark'].map(t => `<button data-theme-set="${t}" aria-pressed="${settings.theme === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>
        <div class="settings-row"><div class="what"><b>Import from Downloads</b><span>Tangerine files that land in ${esc(settings.downloads_dir || '~/Downloads')} are imported and moved into the app's Imported Files folder.</span></div>
          <label class="switch"><input type="checkbox" data-setting="auto_import" ${settings.auto_import ? 'checked' : ''}><span></span></label></div>
        <div class="settings-row"><div class="what"><b>Budget starts in</b><span>Transactions before this are kept for history and for working out what categories need.</span></div>
          <select id="start-month">${months.months.map(m => `<option value="${m}" ${m === state.boot.budget_start ? 'selected' : ''}>${monthLong(m)}</option>`).join('')}</select></div>
        <div class="settings-row"><div class="what"><b>"Needs" looks back over</b><span>How many past months the Budget page averages to show what a category actually needs.</span></div>
          <div class="seg" id="avg">${[3, 6, 12].map(n => `<button data-avg="${n}" aria-pressed="${settings.average_months === n}">${n} months</button>`).join('')}</div></div>
        <div class="settings-row"><div class="what"><b>Fill monthly amounts from spending</b><span>Sets every category without a monthly amount to what it actually needed on average.</span></div>
          <button class="btn" data-act="fill-monthly">Fill them in</button></div>
        <div class="settings-row"><div class="what"><b>Learn from an Actual Budget export</b><span>Its categories and which payees went where.</span></div>
          <button class="btn" data-act="learn-actual">Choose file…</button></div>
      </div>
      <div class="card">
        <div class="settings-row"><div class="what"><b>Update automatically</b><span id="update-text">${esc(updText)}</span></div>
          <label class="switch"><input type="checkbox" data-setting="update_automatically" ${settings.update_automatically ? 'checked' : ''}><span></span></label></div>
        <div class="settings-row"><div class="what"><b>GitHub access</b><span>${upd && upd.access ? `Using ${esc(upd.access)}.` : 'The code is private, so checking for updates needs a GitHub token (read access to the repository) or the GitHub CLI signed in.'}</span></div>
          <input type="password" id="gh-token" placeholder="Token" style="width:180px"><button class="btn" data-act="save-token">Save</button></div>
        <div class="settings-row"><div class="what"><b>Check for updates</b></div><button class="btn" data-act="check-updates">Check now</button></div>
      </div>
      <div class="card">
        <div class="settings-row"><div class="what"><b>Your data</b><span>${esc(info.data_dir)}. Backed up once a day (14 days kept). Nothing leaves this Mac.</span></div>
          <button class="btn" data-act="reveal" data-what="reveal_data">Show</button></div>
        <div class="settings-row"><div class="what"><b>Imported files</b><span>Every file the app imported, kept as it was.</span></div>
          <button class="btn" data-act="reveal" data-what="reveal_imports">Show</button></div>
        <div class="settings-row"><div class="what"><b>Log</b><span>For when something goes wrong.</span></div>
          <button class="btn" data-act="reveal" data-what="reveal_log">Show</button></div>
        <div class="settings-row"><div class="what"><b>Version</b></div><span class="muted">${esc(info.version)}</span></div>
      </div>
    </div>`);
  $('#start-month').addEventListener('change', async e => {
    await call('set_budget_start', [e.target.value]);
    state.boot.budget_start = e.target.value;
    toast(`The budget now starts in ${monthLong(e.target.value)}`);
  });
}

async function settingsAction(btn) {
  const act = btn.dataset.act;
  if (act === 'save-token') {
    const st = await call('window_action', ['set_github_token', $('#gh-token').value]);
    state.update = st; toast($('#gh-token').value ? 'Token saved in the Keychain' : 'Token removed');
  } else if (act === 'check-updates') {
    state.update = await call('window_action', ['check_updates']);
    toast('Checking for updates…');
  } else if (act === 'reveal') { await call('window_action', [btn.dataset.what]); return; }
  else if (act === 'learn-actual') {
    const r = await call('learn_actual_file');
    if (r && r.learnt) toast(`Learnt ${r.learnt.examples} examples${r.refiled ? `, and filed ${r.refiled} waiting transactions` : ''}`);
  } else if (act === 'fill-monthly') {
    const r = await call('fill_monthly_from_averages', { months: (await call('get_settings')).average_months });
    await loadCategories();
    toast(`Set ${plural(r.changed, 'monthly amount')}`, { action: undoAction });
  }
  await renderSettings();
}

// ── onboarding ──────────────────────────────────────────
const ob = { step: 0, files: null, results: null };
async function showOnboarding() {
  $('#onboard').hidden = false;
  await renderOnboarding();
}
async function renderOnboarding() {
  const root = $('#onboard');
  const steps = ['Files', 'Categories', 'Balances', 'Start'];
  const head = `<div class="row"><svg viewBox="0 0 32 32" width="34" height="34"><rect x="1" y="5" width="30" height="22" rx="5" fill="#1f9d55"/><path d="M3 9l13 9 13-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Let's set up your budget</h1></div>
    <div class="steps">${steps.map((s, i) => `<div class="${i <= ob.step ? 'done' : ''}" title="${s}"></div>`).join('')}</div>`;
  let body = '';
  if (ob.step === 0) {
    if (!ob.files) ob.files = await call('scan_downloads');
    const files = ob.files.files;
    body = `<h3>1. Bring in your Tangerine files</h3>
      <p class="muted">On tangerine.ca, open an account, choose <b>Download transactions</b>, and save as CSV (or Quicken/Money: those even include the balance). Grab a few months for both chequing and the credit card. Overlapping files are fine: nothing is imported twice.</p>
      <div class="card filelist">${files.length ? files.map((f, i) => `<label><input type="checkbox" data-file="${i}" ${f.already_imported ? '' : 'checked'}>
          <div><b>${esc(f.account_name || f.filename)}</b> <span class="muted small">${esc(f.filename)}</span><div class="small muted">${f.format === 'actual' ? 'Learn your categories and which payees go where' : `${plural(f.rows, 'transaction')}, ${dayYear(f.first_date)} – ${dayYear(f.last_date)}`}${f.already_imported ? ' · already imported' : ''}</div></div>
          <span class="tag ${f.format === 'actual' ? 'info' : ''}">${f.format === 'actual' ? 'Actual Budget' : f.format === 'ofx' ? 'OFX' : 'CSV'}</span></label>`).join('')
        : `<div class="empty"><b>No Tangerine files in ${esc(ob.files.folder)}</b>Download some, then look again.</div>`}</div>
      ${ob.results ? `<div class="notice info" style="margin-top:12px">${ob.results}</div>` : ''}
      <div class="row" style="margin-top:16px"><button class="btn" data-ob="rescan">Look again</button><button class="btn" data-ob="choose">Choose files…</button><span class="spacer"></span>
        <button class="btn primary" data-ob="import">${files.some(f => !f.already_imported) ? 'Import and continue' : 'Continue'}</button></div>`;
  } else if (ob.step === 1) {
    await loadCategories();
    const normal = state.categories.filter(g => g.role === 'normal');
    body = `<h3>2. Your categories</h3>
      <p class="muted">These are your envelopes. Rename, add or remove anything; you can change them any time.</p>
      ${normal.length ? '' : `<div class="notice info" style="margin-bottom:12px">No categories yet. <span class="spacer"></span><button class="btn small" data-ob="starter">Use a starter set</button></div>`}
      <div class="card" id="ob-cats">${categoryEditorHtml(state.categories)}</div>
      <div class="row" style="margin-top:16px"><button class="btn" data-ob="back">Back</button><span class="spacer"></span><button class="btn primary" data-ob="next">Continue</button></div>`;
  } else if (ob.step === 2) {
    await loadAccounts();
    body = `<h3>3. Balances</h3>
      <p class="muted">What does Tangerine show for each account right now? The app works out every past balance from this one number, so it only asks once.</p>
      <div class="card">${state.accounts.map(a => `<div class="settings-row"><div class="what"><b>${esc(a.name)}</b><span>${a.is_debt ? 'Amount owing (the balance on the card)' : 'Balance'}${a.last_date ? ` · transactions up to ${dayYear(a.last_date)}` : ''}</span></div>
          <input style="width:150px;text-align:right" data-ob-balance="${a.id}" value="${a.balance !== null ? moneyPlain(a.is_debt ? -a.balance : a.balance) : ''}" placeholder="0.00"></div>`).join('') || '<p class="faint">No accounts yet: go back and import a file.</p>'}</div>
      <div class="row" style="margin-top:16px"><button class="btn" data-ob="back">Back</button><span class="spacer"></span><button class="btn primary" data-ob="save-balances">Continue</button></div>`;
  } else {
    const os = await call('onboarding_state');
    ob.start = ob.start || os.suggested_start;
    body = `<h3>4. When should the budget start?</h3>
      <p class="muted">Pick the first month to budget. Everything before it stays as history: it's what the app learns from and what it uses to tell you what each category actually needs. Starting a few months back means you can catch up those months in one click instead of starting from scratch.</p>
      <div class="card"><div class="settings-row"><div class="what"><b>Start in</b><span>Suggested: ${monthLong(os.suggested_start)}, the first month every account has complete data for.</span></div>
        <select id="ob-start">${os.months.map(m => `<option value="${m}" ${m === ob.start ? 'selected' : ''}>${monthLong(m)}</option>`).join('')}</select></div></div>
      <div class="row" style="margin-top:16px"><button class="btn" data-ob="back">Back</button><span class="spacer"></span><button class="btn primary" data-ob="finish">Start budgeting</button></div>`;
  }
  root.innerHTML = `<div class="inner">${head}${body}</div>`;
  if (ob.step === 1) {
    const box = $('#ob-cats');
    bindCategoryEditor(box, async () => { box.innerHTML = categoryEditorHtml(state.categories); });
  }
}
async function onboardingAction(btn) {
  const a = btn.dataset.ob;
  if (a === 'rescan') { ob.files = null; ob.results = null; }
  else if (a === 'choose') {
    const r = await call('choose_and_import');
    if (r) { ob.results = summarizeImport(r); ob.files = null; }
  } else if (a === 'import') {
    const paths = $$('[data-file]').filter(el => el.checked).map(el => ob.files.files[Number(el.dataset.file)].path);
    if (paths.length) {
      btn.disabled = true; btn.textContent = 'Importing…';
      const r = await call('import_files', [paths]);
      ob.results = summarizeImport(r);
      toast(ob.results);
    }
    ob.step = 1; ob.files = null;
  } else if (a === 'starter') { await call('use_starter_categories'); }
  else if (a === 'back') ob.step = Math.max(0, ob.step - 1);
  else if (a === 'next') ob.step += 1;
  else if (a === 'save-balances') {
    for (const el of $$('[data-ob-balance]')) {
      const cents = parseMoney(el.value);
      if (cents === null) continue;
      if (Number.isNaN(cents)) return toast('One of the balances isn\'t an amount', { error: true });
      await call('set_balance', [Number(el.dataset.obBalance), cents]);
    }
    ob.step = 3;
  } else if (a === 'finish') {
    state.boot = await call('finish_onboarding', [$('#ob-start').value]);
    $('#onboard').hidden = true;
    await loadCategories();
    return navigate(state.counts.inbox ? 'inbox' : 'budget');
  }
  await renderOnboarding();
}
function summarizeImport(r) {
  const parts = [];
  for (const x of r.results || []) parts.push(`${x.filename}: ${x.added} new${x.duplicates ? `, ${x.duplicates} already there` : ''}`);
  if (r.learnt) parts.push(`learnt ${r.learnt.examples} examples from ${r.learnt.filename}`);
  for (const e of r.errors || []) parts.push(`${e.filename}: ${e.error}`);
  return parts.join(' · ') || 'Nothing new';
}

// ── events from Python ──────────────────────────────────
window.appEvent = (name, payload) => {
  if (name === 'imported') {
    if (payload.error) return toast(payload.error, { error: true });
    const results = payload.results || [];
    const added = results.reduce((s, r) => s + r.added, 0);
    const review = (payload.counts && payload.counts.inbox) || 0;
    if (payload.counts) setCounts(payload.counts);
    if (!results.length && !payload.learnt) return;
    toast(added ? `Imported ${plural(added, 'new transaction')} from ${results.map(r => r.filename).join(', ')}${review ? ` · ${review} in the Inbox` : ''}`
      : `Nothing new in ${results.map(r => r.filename).join(', ')}`,
      review ? { action: { label: 'Open Inbox', run: () => navigate('inbox') } } : {});
    if (!$('#dlg').open && !$('.drawer') && !$('.popover')) refresh();
  } else if (name === 'update') {
    state.update = payload;
    if (state.page === 'settings') renderSettings();
    else if (payload.status === 'ready') refresh();
  }
};

// ── wiring ──────────────────────────────────────────────
document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) return navigate(nav.dataset.nav);
  const to = e.target.closest('[data-nav-to]');
  if (to) return navigate(to.dataset.navTo);
  const obBtn = e.target.closest('[data-ob]');
  if (obBtn) { try { await onboardingAction(obBtn); } catch (_) {} return; }
  const m = e.target.closest('#main [data-month]');
  if (m) { state.month = m.dataset.month; return renderBudget(); }
  const g = e.target.closest('.btable .group');
  if (g) { await call('set_group_collapsed', [Number(g.dataset.group), !g.classList.contains('collapsed')]); return renderBudget(); }
  const cat = e.target.closest('.btable [data-cat]');
  if (cat) return openCategory(Number(cat.dataset.cat));
  const row = e.target.closest('tr[data-tx]');
  // Suggestion chips ([data-pick]) are actions too: they file the card they're on.
  const btn = e.target.closest('[data-act], #main [data-pick]');
  if (!btn && row) return editTransaction(Number(row.dataset.tx));
  if (!btn) return;
  const act = btn.dataset.act;
  try {
    if (act === 'import-files') { const r = await call('choose_and_import'); if (r) { window.appEvent('imported', r); } }
    else if (act === 'restart-update') await call('window_action', ['install_update']);
    else if (act === 'assign') await openAssign();
    else if (act === 'catch-up') {
      if (await confirmBox(`Catch up ${monthOnly(state.month)}?`, 'Assigns exactly what each category spent this month, so nothing ends it overspent. Good for months gone by.', 'Catch up')) {
        await call('catch_up', [state.month]); await renderBudget(); toast(`${monthOnly(state.month)} caught up`, { action: undoAction });
      }
    } else if (act === 'start-here') {
      await call('set_budget_start', [state.month]); state.boot.budget_start = state.month; await renderBudget();
      toast(`The budget now starts in ${monthLong(state.month)}`);
    } else if (act === 'edit-categories') await openCategoryEditor();
    else if (act === 'tx-cat') {
      const cid = await pickCategory(btn);
      if (cid) { await call('update_transaction', [Number(btn.dataset.id), { category_id: cid }]); toast(`Changed to ${catName(cid)}`, { action: undoAction }); await renderTransactions(); }
    } else if (act === 'add-tx') await addTransaction();
    else if (state.page === 'inbox') await inboxAction(btn, e);
    else if (state.page === 'accounts') await accountAction(btn);
    else if (state.page === 'subscriptions') await subscriptionAction(btn);
    else if (state.page === 'settings') await settingsAction(btn);
  } catch (err) {
    if (!(err instanceof UserFacingError)) { logError(`Action ${act}`, err); toast('Something went wrong', { error: true }); }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.assign) return saveAssigned(el).catch(() => {});
  if (el.dataset.setting) {
    await call('save_settings', [{ [el.dataset.setting]: el.checked }]);
    toast('Saved');
  }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-theme-set]');
  if (t) { const s = await call('save_settings', [{ theme: t.dataset.themeSet }]); applyTheme(s.theme); renderSettings(); }
  const a = e.target.closest('[data-avg]');
  if (a) { await call('save_settings', [{ average_months: Number(a.dataset.avg) }]); renderSettings(); }
});
document.addEventListener('keydown', e => {
  if (e.target.dataset && e.target.dataset.assign !== undefined && e.key === 'Enter') {
    e.preventDefault();
    const inputs = $$('[data-assign]');
    const i = inputs.indexOf(e.target);
    e.target.blur();
    if (inputs[i + 1]) setTimeout(() => { const n = $(`[data-assign="${inputs[i + 1].dataset.assign}"]`); if (n) { n.focus(); n.select(); } }, 120);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey && !e.target.closest('input, textarea')) {
    e.preventDefault(); doUndo(); return;
  }
  inboxKeys(e);
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.assign !== undefined) setTimeout(() => e.target.select(), 0); });
let dragDepth = 0;
document.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
document.addEventListener('drop', () => { dragDepth = 0; document.body.classList.remove('dragging'); });
document.addEventListener('dragover', e => e.preventDefault());

function applyTheme(theme) {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}

async function start() {
  state.boot = await call('bootstrap');
  applyTheme(state.boot.settings.theme);
  setCounts(state.boot.counts);
  state.update = state.boot.app && state.boot.app.updates;
  if (!state.boot.onboarded) return showOnboarding();
  await loadCategories();
  await navigate(state.counts.inbox ? 'inbox' : 'budget');
}
if (window.pywebview && window.pywebview.api) start();
else window.addEventListener('pywebviewready', start);
</script>
