    (strip.querySelector('[data-confirm="yes"]') || strip.querySelector('[data-confirm]')).focus();
  };
  const askDelete = async (row, id) => {
    const cat = editorCat(id);
    if (!cat) return;
    const q = await deleteQuestion(cat);
    ask(row, q.text, q.yes, q.run && (() => run(q.run, q.done)), q.danger);
  };
  // A name already taken keeps what you typed (add_category refuses it too); a hidden
  // category's name offers that one back instead of a second.
  const add = (el) => {
    const gid = Number(el.dataset.addCat), name = el.value;
    const same = allCategories().find(c => sameName(c.name, name));
    if (!same) return run(() => call('add_category', [gid, name]));
    if (!same.hidden || same.debt_account_id) return toast(`There's already a ${same.name} in ${same.group.name}.`, { error: true });
    ask(el.closest('.cat-row'), `${same.name} is hidden${same.group.id === gid ? '' : ` in ${same.group.name}`}. Show it again?`, 'Show it again',
      () => run(() => call('show_category', [same.id, gid]), `${same.name} is back`));
  };
  const addGroup = (el) => {
    const same = state.categories.find(g => sameName(g.name, el.value));
    if (same) return toast(`There's already a group called ${same.name}.`, { error: true });
    run(() => call('add_group', [el.value, null, true]));  // with a "New Spending Category", as on the Budget page
  };

  host.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.renameGroup) run(() => call('rename_group', [Number(el.dataset.renameGroup), el.value]));
    else if (el.dataset.renameCat) run(() => call('rename_category', [Number(el.dataset.renameCat), el.value]));
  });
  host.addEventListener('keydown', e => {
    const el = e.target;
    if (e.key !== 'Enter' || el.tagName !== 'INPUT') return;
    e.preventDefault();
    if (el.dataset.addCat !== undefined && el.value.trim()) add(el);
    else if (el.dataset.addGroup !== undefined && el.value.trim()) addGroup(el);
    else el.blur();
  });
  host.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.confirm) {
      const strip = b.closest('.cat-confirm');
      strip.remove();
      if (b.dataset.confirm === 'yes') await strip.onYes();
    } else if (b.dataset.hideCat) run(() => call('set_category_hidden', [Number(b.dataset.hideCat), b.dataset.hidden !== '1']));
    else if (b.dataset.deleteCat) askDelete(b.closest('.cat-row'), Number(b.dataset.deleteCat));
    else if (b.dataset.deleteGroup) {
      const g = state.categories.find(x => x.id === Number(b.dataset.deleteGroup));
      ask(b.closest('.grp-head'), `Delete the group ${g ? g.name : ''}?`, 'Delete',
        () => run(() => call('delete_group', [Number(b.dataset.deleteGroup)]), 'Group deleted'), true);
    }
  });

  host.addEventListener('pointerdown', e => beginDrag(e, { root: () => host.querySelector('.cat-editor'), redraw: async () => rerender() }));
}

// Dragging categories and category groups by their handle (⋮⋮) with the mouse, on the
// Budget page and in onboarding's list. Pointer events, not HTML drag and drop (that
// would show the "drop a bank file" overlay). The row moves to the place under the
// pointer as you go, and it's saved when you let go. Pressing a group's handle folds
// every group to its heading at once (0.1 s, before the mouse moves: waiting for it made
// it hard to use), the one you're holding staying under the pointer, so a long
// list fits; on the drop they unfold (0.1 s too), the group staying where it was dropped
// and the page scrolling only if it ends up out of sight (the maintainer's design). The
// page never scrolls by itself while folding (it did, and the top of the page slid into
// view): the list's card keeps its height instead. If the move can't be saved, it goes
// back and still unfolds. `root()` is the list: its `.grp` children are the
// groups, `[data-cat-row]` the categories. `redraw()` draws it again from
// state.categories; nothing else redraws it meanwhile (state.dragging).
function beginDrag(e, { root, redraw }) {
  const handle = e.target.closest('[data-drag-cat], [data-drag-group]');
  if (!handle || e.button !== 0) return;
  e.preventDefault();
  // No text gets selected while the mouse is down: WebKit (the app) selected it anyway,
  // despite the preventDefault.
  const noSelect = ev => ev.preventDefault();
  document.addEventListener('selectstart', noSelect);
  document.body.classList.add('moving-rows');
  const selection = document.getSelection();
  if (selection) selection.removeAllRanges();
  const isGroup = handle.dataset.dragGroup !== undefined;
  const list = root();
  const item = handle.closest(isGroup ? '.grp' : '[data-cat-row]');
  const scroller = scrollParent(list);
  const before = () => isGroup ? [item.parentElement, nextOf(item, '.grp:not([data-role="income"])')]
    : [item.closest('.grp'), nextOf(item, '[data-cat-row]')];
  const [startParent, startNext] = before();
  let started = false, folding = false, heldAt = 0, y = e.clientY, raf = 0;

  const place = () => {
    if (isGroup) {
      const others = [...list.querySelectorAll(':scope > .grp:not([data-role="income"])')].filter(g => g !== item);
      const ref = others.find(g => { const r = g.getBoundingClientRect(); return y < r.top + r.height / 2; })
        || list.querySelector(':scope > .grp[data-role="income"]') || list.querySelector(':scope > .row');
      if (item.nextElementSibling !== ref) list.insertBefore(item, ref);
      return;
    }
    // Only into an ordinary group (move_category).
    const groups = [...list.querySelectorAll(':scope > .grp[data-role="normal"]')];
    if (!groups.length) return;
    const group = groups.find(g => y < g.getBoundingClientRect().bottom) || groups[groups.length - 1];
    const box = group.querySelector('.grp-cats > div') || group;
    const rows = [...box.querySelectorAll('[data-cat-row]')].filter(r => r !== item);
    const ref = rows.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; })
      || box.querySelector(':scope > .add-row');
    if (item.nextElementSibling !== ref || item.parentElement !== box) box.insertBefore(item, ref);
  };
  // Near the top or bottom edge, the list scrolls by itself, and the row follows.
  const edgeScroll = () => {
    const r = scroller.getBoundingClientRect(), edge = 40;
    const top = Math.max(r.top, 0), bottom = Math.min(r.bottom, window.innerHeight);
    const speed = y < top + edge ? -(top + edge - y) / 3 : y > bottom - edge ? (y - bottom + edge) / 3 : 0;
    const was = scroller.scrollTop;
    if (speed && !folding) scroller.scrollTop += speed;
    if (scroller.scrollTop !== was) place();
    raf = requestAnimationFrame(edgeScroll);
  };
  const start = () => {
    started = true;
    state.dragging = true;
    if (list.contains(document.activeElement)) document.activeElement.blur();  // a rename typed just before
    list.querySelectorAll('.cat-confirm').forEach(x => x.remove());
    item.classList.add('dragged');
    list.classList.add('is-dragging');
    if (isGroup) {
      heldAt = item.getBoundingClientRect().top;
      list.parentElement.style.minHeight = `${list.parentElement.offsetHeight}px`;  // the page doesn't get shorter
      list.classList.add('folded');
      folding = true;
      holdAt(list, item, heldAt, 150).then(() => { folding = false; if (state.dragging) place(); });
    }
    raf = requestAnimationFrame(edgeScroll);
  };
  const move = ev => {
    y = ev.clientY;
    if (!started && Math.abs(y - e.clientY) < 4) return;
    if (!started) start();
    if (!folding) place();
  };
  const finish = async cancelled => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('keydown', key, true);
    document.removeEventListener('selectstart', noSelect);
    document.body.classList.remove('moving-rows');
    cancelAnimationFrame(raf);
    if (!started) return;
    // The click that ends a drag isn't a click on whatever is under it (a group's row folds).
    const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };
    window.addEventListener('click', swallow, true);
    setTimeout(() => window.removeEventListener('click', swallow, true), 0);
    if (folding && !cancelled) {  // let go before the groups had folded: fold them now, then place it
      list.classList.add('no-anim');
      void list.offsetHeight;
      holdAt(list, item, heldAt, 0);
      place();
      list.classList.remove('no-anim');
    }
    const [parent, next] = before();
    const moved = !cancelled && (parent !== startParent || next !== startNext);
    const id = Number(isGroup ? item.dataset.group : item.dataset.catRow);
    const top = item.getBoundingClientRect().top, margin = list.style.marginTop, height = list.parentElement.style.minHeight;
    let saved = true, failure = null;
    try {
      if (moved && isGroup) await call('move_group', [id, next ? Number(next.dataset.group) : null]);
      else if (moved) await call('move_category', [id, Number(parent.dataset.group), next ? Number(next.dataset.catRow) : null]);
      await loadCategories();
      state.dragging = false;
      await redraw();
    } catch (err) { saved = false; failure = err; }
    state.dragging = false;
    if (!saved) {  // not saved (or not redrawn): back where it was, and opened up again
      startParent.insertBefore(item, startNext);
      item.classList.remove('dragged');
      list.classList.remove('folded', 'is-dragging');
      list.style.marginTop = list.parentElement.style.minHeight = '';
      if (moved && !(failure instanceof UserFacingError)) toast("Couldn't save that move", { error: true });  // else it said why
      return;
    }
    const fresh = root().querySelector(isGroup ? `.grp[data-group="${id}"]` : `[data-cat-row="${id}"]`);
    const again = root();
    if (isGroup) {  // drawn folded, then unfolds
      again.style.marginTop = margin;
      again.parentElement.style.minHeight = height;
      again.classList.add('folded');
      void again.offsetHeight;
      again.classList.remove('folded');
      again.classList.add('unfolding');
    }
    if (fresh && moved) fresh.classList.add('just-moved');
    // What was dropped stays where it was dropped while the groups open up around it.
    if (fresh) await holdAt(again, fresh, top, isGroup ? 150 : 0);
    again.classList.remove('unfolding');
    again.parentElement.style.minHeight = '';
    if (parseFloat(again.style.marginTop)) {
      again.style.transition = 'margin-top .1s ease';
      again.style.marginTop = '';
      await sleep(120);
    }
    // Only now, and only if it's out of sight: the page scrolls just enough to show it.
    const head = fresh && (fresh.querySelector('tr.group, .grp-head') || fresh);
    if (head && head.isConnected) {
      const r = head.getBoundingClientRect(), view = scroller.getBoundingClientRect();
      const above = r.top - (Math.max(view.top, 0) + 8), below = r.bottom - (Math.min(view.bottom, window.innerHeight) - 8);
      if (above < 0) scroller.scrollBy({ top: above, behavior: 'smooth' });
      else if (below > 0) scroller.scrollBy({ top: Math.min(below, above), behavior: 'smooth' });
    }
  };
  const up = () => finish(false);
  const key = ev => { if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); finish(true); } };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('keydown', key, true);
  if (isGroup) start();  // a category waits for the mouse to move: nothing folds for it
}
// Keeps `el` at `top` on screen for `ms` while the rows around it fold or unfold, with a
// top margin on `list`, never by scrolling the page. Where the margin runs out (the rows
// above opening up by more than it), `el` moves down with them.
function holdAt(list, el, top, ms) {
  const until = performance.now() + ms;
  const margin = () => parseFloat(list.style.marginTop) || 0;
  return new Promise(resolve => {
    const step = () => {
      if (!el.isConnected) return resolve();
      const down = top - el.getBoundingClientRect().top;  // how far the rows must move down
      if (down) list.style.marginTop = `${Math.max(0, margin() + down)}px`;
      if (performance.now() < until) requestAnimationFrame(step); else resolve();
    };
    step();
  });
}
const nextOf = (el, sel) => { for (let n = el.nextElementSibling; n; n = n.nextElementSibling) if (n.matches(sel)) return n; return null; };
const scrollParent = el => {
  for (let p = el.parentElement; p; p = p.parentElement) if (/(auto|scroll)/.test(getComputedStyle(p).overflowY)) return p;
  return document.scrollingElement;
};
// ── dashboard ───────────────────────────────────────────
// The page the app opens on: four figures, each opening its page, then what each
// category spent month by month (the same figures as Spent). A whole month that's above
// the category's Usual for it is marked; groups start closed every time the page opens.
async function renderDashboard() {
  if (!state.categories.length) await loadCategories();
  state.dash = await call('dashboard', []);
  drawDashboard();
}

function drawDashboard() {
  const d = state.dash, s = d.summary, sp = d.spending, cols = sp.months;
  const main = $('#main'), wrap = $('.spend-wrap');
  const scrolled = main.scrollTop, across = wrap ? wrap.scrollLeft : null;
  const tile = (what, label, big, sub, cls = '') => `<button class="card tile" data-act="dash-go" data-what="${what}">
      <span class="label">${label}</span><span class="big ${cls}">${big}</span>${sub}</button>`;
  const tiles = [
    tile('budget', 'Ready to assign', s ? money(s.ready_to_assign) : '—',
      s ? cashCheck(s, { overspending: d.overspending, month: d.month }) : '<span class="small faint">The budget hasn\'t started</span>',
      s && s.ready_to_assign < 0 ? 'neg' : ''),
    tile('inbox', 'Inbox', String(d.inbox),
      `<span class="small muted">${d.inbox ? 'to look at' : 'Nothing to look at'}${d.waiting ? ` · ${money(d.waiting)} waiting` : ''}</span>`),
    tile('budget', `Overspent in ${monthOnly(d.month)}`, d.overspent.length ? money(d.overspent_total) : 'None',
      `<span class="small muted">${d.overspent.slice(0, 3).map(o => `${esc(o.name)} ${money(o.amount)}`).join(' · ')}${d.overspent.length > 3 ? ` and ${d.overspent.length - 3} more` : ''}</span>`,
      d.overspent.length ? 'neg' : ''),
    tile('accounts', 'Cash', money(d.cash),
      `<span class="small muted">${d.missing_balances.length ? `Set the balance of ${esc(d.missing_balances.join(' and '))}`
        : d.has_debt ? `You owe ${money(d.owed)}` : ''}</span>`),
  ].join('');

  const head = cols.map((m, i) => `<th class="r ${m.so_far ? 'so-far' : ''} ${m.complete ? '' : 'partial'}"${m.complete ? '' : ' title="Not every account has data for this month"'}>
      ${monthShort(m.month)}${i === 0 || m.month.endsWith('-01') ? ` ${m.month.slice(0, 4)}` : ''}${m.so_far ? '<div class="tiny">so far</div>' : ''}</th>`).join('');
  const cells = (amounts, attrs, { above = [], usual = [], click = true } = {}) => amounts.map((a, i) => {
    const m = cols[i];
    const tip = above[i] ? (usual[i] !== undefined ? `${money(a - usual[i])} above usual (${money(usual[i])})` : 'Above usual in here')
      : (usual[i] && !m.so_far ? `Usually ${money(usual[i])}` : '');
    const text = `${above[i] ? '↑ ' : ''}${money(a)}`;
    return `<td class="r num ${m.so_far ? 'so-far' : ''} ${m.complete ? '' : 'partial'} ${above[i] ? 'above' : ''}">${!a ? '<span class="faint">—</span>'
      : click ? `<button class="fig" data-act="dash-spent" data-index="${i}" ${attrs}${tip ? ` title="${esc(tip)}"` : ''}>${text}</button>` : text}</td>`;
  }).join('');
  const rows = [];
  rows.push(`<tr><td>Income</td>${cells(sp.income, `data-group="${sp.income_group}"`, { click: !!sp.income_group })}</tr>`);
  rows.push(`<tr class="total"><td>Spending</td>${cells(sp.total, '', { click: false })}</tr>`);
  for (const g of sp.groups) {
    const open = state.dashOpen.has(g.id);
    rows.push(`<tr class="group ${open ? '' : 'collapsed'}"><td><button class="glink" data-act="dash-group" data-group="${g.id}"><span class="caret">▾</span> ${esc(g.name)}</button></td>
      ${cells(g.spent, `data-group="${g.id}"`, { above: open ? [] : g.above })}</tr>`);
    if (!open) continue;
    for (const c of g.categories) {
      rows.push(`<tr class="cat ${c.hidden ? 'hidden-cat' : ''}"><td>${esc(c.name)}</td>
        ${cells(c.spent, `data-cat="${c.id}"`, { above: c.above, usual: c.usual })}</tr>`);
    }
  }
  const ranges = [[3, '3 months'], [6, '6 months'], [12, '12 months'], ['all', 'All']];
  const legend = items => `<div class="legend">${items.map(([cls, label]) => `<span><i class="${cls}"></i>${label}</span>`).join('')}</div>`;
  const nw = d.net_worth;
  frame(`
    <div class="page-head"><h1>Dashboard</h1><span class="spacer"></span>
      <div class="seg">${ranges.map(([v, label]) => `<button data-act="dash-range" data-what="${v}" aria-pressed="${sp.range === v}">${label}</button>`).join('')}</div></div>
    <div class="tiles">${tiles}</div>
    <div class="charts">
      <div class="card chart-card">
        <div class="row wrap"><h2 style="margin:0">Net worth</h2>${nw.months.length ? `<b class="${nw.net[nw.net.length - 1] < 0 ? 'neg' : ''}">${money(nw.net[nw.net.length - 1])}</b>` : ''}
          <span class="spacer"></span>${legend([['line', 'Net worth'], ['s1', 'Cash'], ['s2', 'Owed']])}</div>
        ${nw.months.length ? '<div class="chart" id="chart-worth"></div>' : '<p class="small faint">Not enough history yet.</p>'}
        ${d.missing_balances.length ? `<p class="small muted" style="margin:4px 0 0">Leaves out ${esc(d.missing_balances.join(' and '))}: no balance yet.</p>` : ''}
      </div>
      <div class="card chart-card">
        <div class="row wrap"><h2 style="margin:0">In and out</h2><span class="spacer"></span>${legend([['s1', 'Income'], ['s2', 'Spending']])}</div>
        ${sp.months.length ? '<div class="chart" id="chart-flow"></div>' : ''}
      </div>
    </div>
    <div class="card" style="padding:12px 16px">
      <div class="row" style="margin-bottom:6px"><h2 style="margin:0">Spending</h2></div>
      ${sp.groups.length || sp.income.some(Boolean) ? `<div class="spend-wrap"><table class="spend"><thead><tr><th></th>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
        <p class="small muted" style="margin:8px 0 0">↑ Above usual: at least $25 and 25% more than its average in the ${plural(sp.usual_months, 'whole month')} before.</p>`
        : '<div class="empty"><b>No spending yet</b>Categorized transactions show here, month by month.</div>'}
    </div>`);
  main.scrollTop = scrolled;
  if (across !== null && $('.spend-wrap')) $('.spend-wrap').scrollLeft = across;
  else if ($('.spend-wrap')) $('.spend-wrap').scrollLeft = $('.spend-wrap').scrollWidth;  // the latest months first
  drawCharts();
}

// Month-by-month charts, drawn as SVG in the page (it loads nothing from anywhere). Bars
// are at most 24px wide, rounded at the end away from zero and square at it; every series
// is named in a legend above the chart; pointing at (or tabbing to) a month shows all its
// figures in one tooltip.
const moneyShort = c => {
  const d = Math.abs(c) / 100, sign = c < 0 ? '−' : '';
  return d >= 1000 ? `${sign}$${(d / 1000).toFixed(d >= 10000 || d % 1000 === 0 ? 0 : 1)}k` : `${sign}$${Math.round(d)}`;
};

function niceTicks(lo, hi, count = 4) {
  if (hi - lo < 100) hi = lo + 100;
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw);
  const ticks = [];
  for (let v = Math.floor(lo / step) * step; v < hi + step; v += step) { ticks.push(Math.round(v)); if (v >= hi) break; }
  return ticks;
}

// A bar from the baseline y0 to its end y1: the end rounded (4px), the baseline square.
function barPath(x, w, y0, y1) {
  const h = Math.abs(y1 - y0);
  if (h < 0.5) return '';
  const r = Math.min(4, h, w / 2), top = Math.min(y0, y1), bottom = Math.max(y0, y1);
  return y1 < y0
    ? `M${x},${bottom}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${bottom}Z`
    : `M${x},${top}V${bottom - r}Q${x},${bottom} ${x + r},${bottom}H${x + w - r}Q${x + w},${bottom} ${x + w},${bottom - r}V${top}Z`;
}

// opts: months (YYYY-MM), series [{cls, values}] (bars: side by side, or on one stack
// when `stacked`, negatives below zero), line {values} (optional), faded(i), tip(i) → html.
// The latest value goes in the card's header, not on the line, where it hit the marks.
function monthChart(el, opts) {
  const n = opts.months.length, W = el.clientWidth, H = el.clientHeight;
  const pad = { l: 46, r: 8, t: 10, b: 20 }, plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
  const highs = [], lows = [];
  for (let i = 0; i < n; i++) {
    const vs = opts.series.map(s => s.values[i]);
    if (opts.stacked) { highs.push(vs.filter(v => v > 0).reduce((a, b) => a + b, 0)); lows.push(vs.filter(v => v < 0).reduce((a, b) => a + b, 0)); }
    else { highs.push(...vs); lows.push(...vs); }
    if (opts.line) { highs.push(opts.line.values[i]); lows.push(opts.line.values[i]); }
  }
  const ticks = niceTicks(Math.min(0, ...lows), Math.max(0, ...highs));
  const tmin = ticks[0], tmax = ticks[ticks.length - 1];
  const y = v => pad.t + (tmax - v) / (tmax - tmin) * plotH;
  const band = plotW / n, mid = i => pad.l + band * (i + .5);
  const parts = [];
  for (const t of ticks) {
    parts.push(`<line class="grid ${t === 0 ? 'zero' : ''}" x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}"/>`,
      `<text x="${pad.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${moneyShort(t)}</text>`);
  }
  const every = Math.ceil(n / Math.max(1, Math.floor(plotW / 44)));
  for (let i = 0; i < n; i++) {
    parts.push(`<rect class="band" data-i="${i}" x="${pad.l + band * i}" y="${pad.t}" width="${band}" height="${plotH}"/>`);
    const m = opts.months[i];
    if (i % every === 0 || i === n - 1) {
      parts.push(`<text x="${mid(i)}" y="${H - 5}" text-anchor="middle">${monthShort(m)}${i === 0 || m.endsWith('-01') ? ` ${m.slice(2, 4)}` : ''}</text>`);
    }
  }
  const k = opts.stacked ? 1 : opts.series.length;
  const w = Math.max(2, Math.min(24, (band * .7 - 2 * (k - 1)) / k)), group = k * w + 2 * (k - 1);
  for (let i = 0; i < n; i++) {
    const fade = opts.faded && opts.faded(i) ? ' faded' : '';
    let up = 0, down = 0;
    opts.series.forEach((s, j) => {
      const v = s.values[i];
      const x = opts.stacked ? mid(i) - w / 2 : mid(i) - group / 2 + j * (w + 2);
      let from = 0;
      if (opts.stacked) { from = v >= 0 ? up : down; if (v >= 0) up += v; else down += v; }
      const y0 = y(from) + (opts.stacked && from !== 0 ? (v >= 0 ? -2 : 2) : 0);  // 2px between stacked parts
      parts.push(`<path class="${s.cls}${fade}" d="${barPath(x, w, y0, y(from + v))}"/>`);
    });
  }
  if (opts.line) {
    const pts = opts.line.values.map((v, i) => [mid(i), y(v)]);
    parts.push(`<path class="net" d="M${pts.map(p => p.join(',')).join('L')}"/>`);
    pts.forEach(([px, py], i) => parts.push(`<circle class="dot${opts.faded && opts.faded(i) ? ' faded' : ''}" cx="${px}" cy="${py}" r="4"/>`));
  }
  for (let i = 0; i < n; i++) {
    parts.push(`<rect class="hit" data-i="${i}" tabindex="0" x="${pad.l + band * i}" y="0" width="${band}" height="${H}"/>`);
  }
  el.innerHTML = `<svg width="${W}" height="${H}" role="img">${parts.join('')}</svg>`;
  const tip = document.querySelector('.chart-tip') || document.body.appendChild(Object.assign(document.createElement('div'), { className: 'chart-tip', hidden: true }));
  const show = (rect, at) => {
    const i = Number(rect.dataset.i);
    $$('.band', el).forEach(b => b.classList.toggle('on', Number(b.dataset.i) === i));
    tip.innerHTML = opts.tip(i);
    tip.hidden = false;
    const box = at || rect.getBoundingClientRect(), x = at ? at.x : box.left + box.width / 2, top = at ? at.y : box.top + 20;
    tip.style.left = `${Math.min(window.innerWidth - tip.offsetWidth - 8, x + 14)}px`;
    tip.style.top = `${Math.max(8, top - tip.offsetHeight - 10)}px`;
  };
  const hide = () => { tip.hidden = true; $$('.band', el).forEach(b => b.classList.remove('on')); };
  for (const rect of $$('.hit', el)) {
    rect.addEventListener('pointermove', e => show(rect, { x: e.clientX, y: e.clientY }));
    rect.addEventListener('focus', () => show(rect));
    rect.addEventListener('pointerleave', hide);
    rect.addEventListener('blur', hide);
  }
}
const tipRow = (cls, label, amount) => `<div class="tip-row"><i class="${cls}"></i><span class="muted">${label}</span><b>${money(amount)}</b></div>`;
const monthName = (m, soFar) => `${monthLong(m)}${soFar ? ' so far' : ''}`;

function drawCharts() {
  const d = state.dash;
  if (!d) return;
  const tip = document.querySelector('.chart-tip');
  if (tip) tip.hidden = true;
  const nw = d.net_worth, worthEl = $('#chart-worth');
  if (worthEl && nw.months.length) {
    const current = i => nw.months[i] === d.month;
    monthChart(worthEl, {
      months: nw.months, stacked: true,
      series: [{ cls: 's1', values: nw.cash }, { cls: 's2', values: nw.owed.map(v => -v) }],
      line: { values: nw.net },
      faded: i => !nw.complete[i],
      tip: i => `<b>${monthName(nw.months[i], current(i))}</b>${tipRow('ink', 'Net worth', nw.net[i])}${tipRow('s1', 'Cash', nw.cash[i])}${tipRow('s2', 'Owed', nw.owed[i])}${nw.complete[i] ? '' : '<div class="small faint">Not every account has data</div>'}`,
    });
  }
  const sp = d.spending, flowEl = $('#chart-flow');
  if (flowEl && sp.months.length) {
    monthChart(flowEl, {
      months: sp.months.map(m => m.month),
      series: [{ cls: 's1', values: sp.income }, { cls: 's2', values: sp.total }],
      faded: i => sp.months[i].so_far || !sp.months[i].complete,
      tip: i => `<b>${monthName(sp.months[i].month, sp.months[i].so_far)}</b>${tipRow('s1', 'Income', sp.income[i])}${tipRow('s2', 'Spending', sp.total[i])}${tipRow('', 'Difference', sp.income[i] - sp.total[i])}${sp.months[i].complete ? '' : '<div class="small faint">Not every account has data</div>'}`,
    });
  }
}
window.addEventListener('resize', debounce(() => { if (state.page === 'dashboard') drawCharts(); }, 150));

async function dashboardAction(btn) {
  const act = btn.dataset.act;
  if (act === 'dash-go') {
    if (btn.dataset.what === 'budget') state.month = state.dash.month;
    return navigate(btn.dataset.what);
  }
  if (act === 'dash-range') {  // remembered: the Dashboard opens with it next time too
    await call('save_settings', [{ dashboard_months: btn.dataset.what === 'all' ? 'all' : Number(btn.dataset.what) }]);
    return renderDashboard();
  }
  if (act === 'dash-group') {
    const id = Number(btn.dataset.group);
    if (state.dashOpen.has(id)) state.dashOpen.delete(id); else state.dashOpen.add(id);
    return drawDashboard();
  }
  if (act === 'dash-spent') {
    const month = state.dash.spending.months[Number(btn.dataset.index)].month;
    const income = Number(btn.dataset.group) === state.dash.spending.income_group;
    return openSpent(btn.dataset.cat ? { month, category_id: Number(btn.dataset.cat) } : { month, group_id: Number(btn.dataset.group) },
      { total: income ? 'Came in' : 'Spent' });
  }
}

// ── inbox ───────────────────────────────────────────────
async function renderInbox() {
  if (!state.categories.length) await loadCategories();
  state.inbox = await call('inbox');
  drawInbox();
}

const inboxMatches = (it, text) => {
  const q = text.trim().toLowerCase();
  if (!q) return true;
  return [it.payee_name, it.raw_name, it.raw_memo, it.reason, it.account_name, money(it.amount), (Math.abs(it.amount) / 100).toFixed(2)]
    .some(v => String(v || '').toLowerCase().includes(q));
};

// Draws the inbox from state.inbox (no fetch), so typing in the finder is instant.
function drawInbox() {
  const data = state.inbox;
  const find = state.inboxFind;
  const shown = data.items.filter(it => (!find.payee || it.payee_id === find.payee) && inboxMatches(it, find.text));
  state.inboxShown = shown;
  // Who's waiting: a button per payee, most first, to show just theirs.
  const byPayee = new Map();
  for (const it of data.items) {
    const k = it.payee_id || 0;
    const e = byPayee.get(k) || { id: it.payee_id, name: it.payee_name || it.raw_name || 'Unknown', n: 0 };
    e.n += 1; byPayee.set(k, e);
  }
  const payees = [...byPayee.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  const finder = data.items.length ? `<div class="card" style="padding:10px 12px">
      <div class="row"><input type="search" id="inbox-search" placeholder="Find in the inbox: payee, description or amount" style="flex:1" value="${esc(find.text)}">
        ${find.text || find.payee ? `<span class="small muted nowrap">Showing ${shown.length} of ${data.items.length}</span><button class="btn small" data-act="inbox-clear">Show all</button>` : ''}</div>
      <div class="row wrap" style="margin-top:8px">${payees.map(p => `<button class="chip ${find.payee === p.id ? 'first' : ''}" data-act="inbox-payee" data-payee="${p.id ?? ''}">${esc(p.name)} <span style="opacity:.6">${p.n}</span></button>`).join('')}</div>
    </div>` : '';
  // The inbox's groups (Inbox.view): one payee's items, or the shares of one shared expense, as one card.
  const blocks = [], byGroup = new Map();
  for (const it of shown) {
    if (it.group) {
      if (byGroup.has(it.group)) { byGroup.get(it.group).items.push(it); continue; }
      const b = { group: it.group, items: [it] };
      byGroup.set(it.group, b); blocks.push(b);
    } else blocks.push({ group: null, items: [it] });
  }
  state.blocks = blocks.flatMap(b => (b.items.length > 1 && !state.expanded.has(b.group)) ? [b] : b.items.map(i => ({ group: null, items: [i] })));
  state.inboxSel = Math.min(state.inboxSel, Math.max(0, state.blocks.length - 1));
  const alerts = data.alerts.map(a => a.type === 'balance' ? `<div class="notice">${esc(a.text)}<span class="spacer"></span>
      <input style="width:130px;text-align:right" placeholder="Balance" data-balance-for="${a.account_id}"><button class="btn small" data-act="save-balance" data-account="${a.account_id}">Save</button></div>`
    : a.type === 'duplicate' ? duplicateNotice(a) : '').join('') +
    (data.files || []).map((f, i) => `<div class="notice info"><span><b>${esc(f.filename)}</b> ${f.needs === 'layout' ? 'needs setting up once.' : f.needs === 'new_account' ? 'is for an account the app hasn\'t seen: a new one, or one you have?' : 'is from a bank the app knows: which account is it for?'}</span><span class="spacer"></span>
      <button class="btn small" data-act="ignore-file" data-index="${i}">${f.needs === 'new_account' ? 'Don\'t import' : 'Not a bank file'}</button><button class="btn small primary" data-act="setup-file" data-index="${i}">${f.needs === 'layout' ? 'Set up…' : 'Choose…'}</button></div>`).join('');
  const cards = state.blocks.map((b, i) => b.items.length > 1 ? groupCard(b, i) : itemCard(b.items[0], i)).join('');
  const filedRows = data.categorized.map(t => `<tr><td class="muted nowrap">${day(t.date)}</td><td>${esc(t.payee_name || t.raw_name)}${t.subscription_name ? ` <span class="tag info">${esc(t.subscription_name)}</span>` : ''}</td>
      <td>${t.transfer_account_name ? `<span class="tag">Transfer</span>` : `<button class="link" data-act="recat" data-id="${t.id}">${esc(t.category_name || (t.is_split ? 'Split' : 'No category'))}</button>`}</td>
      <td class="muted small">${esc(t.reason)}</td><td class="r num ${t.amount > 0 ? 'pos' : ''}">${money(t.amount)}</td></tr>`).join('');
  const withGuess = shown.filter(i => i.guess).length;
  frame(`
    <div class="page-head"><h1>Inbox</h1><span class="muted">${data.items.length ? plural(data.items.length, 'transaction') + ' to look at' : ''}</span><span class="spacer"></span>
      ${withGuess ? `<button class="btn" data-act="accept-all">Accept all ${withGuess} suggestions${shown.length < data.items.length ? ' shown' : ''}</button>` : ''}</div>
    <div class="stack">
      ${alerts}
      ${finder}
      ${data.items.length && !shown.length ? `<div class="card empty"><b>Nothing matches</b>Try another search, or show everything.</div>` : ''}
      ${shown.length ? `<div class="items" id="items">${cards}</div>
        <p class="kbd-help">↑ ↓ to move · Return takes the highlighted suggestion · 1–4 picks one · / any category · T transfer · S split · ⌘Z undo</p>`
        : (data.items.length || (data.files || []).length ? '' : `<div class="card empty"><b>All caught up</b>Everything is categorized. New bank downloads show up here when there's something to decide.</div>`)}
      ${data.categorized.length ? `<details class="card" style="padding:10px 14px"><summary style="cursor:default;font-weight:600">Categorized automatically from recent imports (${data.categorized.length})</summary>
        <p class="small muted">Click a category to change it. The app learns from every change.</p>
        <table class="filed-list"><tbody>${filedRows}</tbody></table></details>` : ''}
    </div>`);
  const search = $('#inbox-search');
  if (search) {
    search.addEventListener('input', debounce(e => { state.inboxFind.text = e.target.value; state.inboxFind.focus = true; state.inboxSel = 0; drawInbox(); }, 150));
    if (state.inboxFind.focus) { search.focus(); search.setSelectionRange(search.value.length, search.value.length); }
  }
  state.inboxFind.focus = false;
  markSelected(false);
}

function chipsHtml(suggestions) {
  return suggestions.slice(0, 4).map((s, i) => `<button class="chip ${i === 0 ? 'first' : ''}" data-pick="${s.id}"><kbd>${i + 1}</kbd>${esc(s.name)}</button>`).join('');
}

function itemCard(t, i) {
  const who = esc(t.payee_name || t.raw_name || 'Unknown');
  const question = t.similar_payee ? `<div class="question">Is <b>${who}</b> the same as <b>${esc(t.similar_payee.name)}</b>?
      <button class="btn small" data-act="same" data-id="${t.id}" data-yes="1">Yes, same</button><button class="btn small" data-act="same" data-id="${t.id}" data-yes="0">No, different</button></div>` : '';
  const sub = t.subscription_choices ? `<div class="question"><span>${t.subscription_choices.map(c =>
      `<button class="btn small" data-act="sub-link" data-id="${t.id}" data-sub="${c.id}">New price for ${esc(c.name)}${c.due_now ? ' (due now)' : ''}</button>`).join(' ')}</span>
      <button class="btn small" data-act="sub-new" data-id="${t.id}">A new subscription…</button>
      <span class="small muted">Or pick a category below for a one-off purchase.</span></div>` : '';
  return `<div class="item" data-index="${i}" tabindex="-1">
    <div>
      <div class="who"><span class="link" style="color:inherit" data-act="rename" data-id="${t.id}" title="Rename or change payee">${who}</span>
        ${t.subscription_name ? `<span class="tag info">${esc(t.subscription_name)}</span>` : ''}</div>
      <div class="meta">${dayYear(t.date)} · ${esc(t.account_name)}${t.bank_category ? ` · card says “${esc(t.bank_category)}”` : ''}</div>
      <div class="raw">${esc(t.raw_name)}${t.raw_memo && t.raw_memo !== t.raw_name && !t.raw_memo.startsWith('Rewards') ? ' · ' + esc(t.raw_memo) : ''}</div>
      ${t.reason ? `<div class="why">💡 <span>${esc(t.reason)}</span></div>` : ''}
    </div>
    <div class="amount ${t.amount > 0 ? 'pos' : ''}">${money(t.amount, { sign: t.amount > 0 })}</div>
    ${question}${sub}
    <div class="chips">${chipsHtml(t.suggestions || [])}
      <button class="chip" data-act="other" data-id="${t.id}">Other…</button><span class="sep"></span>
      <button class="btn small ghost" data-act="transfer" data-id="${t.id}">Transfer</button>
      <button class="btn small ghost" data-act="split" data-id="${t.id}">Split</button>
      ${t.can_always_ask ? `<button class="btn small ghost" data-act="always-ask" data-payee="${t.payee_id}" data-on="${t.always_ask ? 0 : 1}" title="${t.always_ask ? 'Let the app categorize this payee on its own again' : 'Never categorize this payee without asking'}">${t.always_ask ? 'Stop always asking' : 'Always ask'}</button>` : ''}
    </div>
  </div>`;
}

function groupCard(b, i) {
  const first = b.items[0];
  const total = b.items.reduce((s, t) => s + t.amount, 0);
  const dates = b.items.map(t => t.date).sort();
  const share = b.group.startsWith('share:');
  const title = share ? `${b.items.length} e-transfers that look like shares of one expense` : `${esc(first.payee_name || first.raw_name)} · ${b.items.length} transactions`;
  return `<div class="item group-card" data-index="${i}" tabindex="-1">
    <div>
      <div class="who">${title}</div>
      <div class="meta">${day(dates[0])} – ${dayYear(dates[dates.length - 1])} · ${esc([...new Set(b.items.map(t => t.account_name))].join(', '))}</div>
      ${first.reason ? `<div class="why">💡 <span>${esc(first.reason)}</span></div>` : ''}
    </div>
    <div class="amount ${total > 0 ? 'pos' : ''}">${money(total, { sign: total > 0 })}</div>
    <div class="sublist">${b.items.slice(0, 6).map(t => `<div><span class="muted">${day(t.date)}</span><span>${esc(t.payee_name || t.raw_name)}</span><span class="spacer"></span><span class="num">${money(t.amount)}</span></div>`).join('')}
      ${b.items.length > 6 ? `<div class="faint">and ${b.items.length - 6} more</div>` : ''}</div>
    <div class="chips">${chipsHtml(first.suggestions || [])}
      <button class="chip" data-act="other-group" data-index="${i}">Other…</button><span class="sep"></span>
      <button class="btn small ghost" data-act="expand" data-group="${esc(b.group)}">One at a time</button>
      ${b.group.startsWith('payee:') && first.payee_id ? `<button class="btn small ghost" data-act="always-ask" data-payee="${first.payee_id}" data-on="1" title="Ask about each of this payee's transactions on its own, and never categorize them without asking">Always ask</button>` : ''}
      <span class="small muted">Categorizes all ${b.items.length}.</span></div>
  </div>`;
}

function markSelected(scroll = true) {
  $$('.item').forEach(el => el.classList.toggle('selected', Number(el.dataset.index) === state.inboxSel));
  const el = $(`.item[data-index="${state.inboxSel}"]`);
  if (el && scroll) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

async function fileBlock(index, categoryId) {
  const b = state.blocks[index];
  if (!b || !categoryId) return;
  const el = $(`.item[data-index="${index}"]`);
  if (el) el.classList.add('leaving');
  const ids = b.items.map(t => t.id);
  // "One at a time" on a group means exactly that: categorizing one never categorizes the others.
  const oneAtATime = ids.length === 1 && b.items[0].group && state.expanded.has(b.items[0].group);
  const r = await call('categorize', { txn_ids: ids, category_id: categoryId, recheck_payee: !oneAtATime });
  const t = b.items[0];
  const name = t.payee_name || t.raw_name;
  let msg = `${ids.length > 1 ? plural(ids.length, 'transaction') : name} → ${catName(categoryId)}`;
  if (r.also_categorized) msg += ` · also categorized ${r.also_categorized} more like it`;
  const total = b.items.reduce((s, x) => s + x.amount, 0);
  if (incomeIds().includes(categoryId) && total > 0) {
    toast(msg, { action: { label: `Assign ${money(total)}`, run: () => { state.month = t.date.slice(0, 7); navigate('budget').then(() => openAssign(total)); } } });
  } else toast(msg, { action: undoAction });
  await renderInbox();
  if (r.question) await subscriptionPrompt(r.question);
}

// Categorized a charge that looks like a subscription or bill that isn't tracked yet: ask what it is
// (from any page: the Inbox, the Transactions page, a transaction you opened).
async function subscriptionPrompt(q) {
  const v = await dialog({
    title: `What's this ${esc(q.payee)} charge for?`,
    body: `<p class="muted">${esc(q.payee)} charged <b>${money(q.amount)}</b>${q.count > 1 ? ` (${q.count} times at this price)` : ''}. ${esc(q.why)}.
        Name it and it's tracked: its charges show as <b>${esc(q.payee)} · name</b>, go to its category on their own,
        and you're told when the price changes or it stops.</p>
      <div class="field"><label>What's it for?</label><input id="sp-name" placeholder="e.g. ${esc(q.payee)} — couch, Apple Music, phone plan"></div>
      <div class="grid2">
        <div class="field"><label>Type</label><select id="sp-kind"><option value="subscription" ${q.kind !== 'bill' ? 'selected' : ''}>Subscription</option><option value="bill" ${q.kind === 'bill' ? 'selected' : ''}>Bill or payment plan</option></select></div>
        <div class="field"><label>Charges</label><select id="sp-cadence">${['monthly', 'yearly', 'weekly'].map(c => `<option value="${c}" ${q.cadence === c ? 'selected' : ''}>${c[0].toUpperCase() + c.slice(1)}</option>`).join('')}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Price</label>${pricingSelect('sp-pricing', q.pricing)}</div>
        <div class="field"><label>Ends on (optional)</label><input type="date" id="sp-ends"></div>
      </div>
      <div class="field"><label>Category</label><button type="button" class="btn" id="sp-cat" data-id="${q.category_id}" style="text-align:left">${esc(q.category)}</button></div>`,
    actions: [{ label: 'Not recurring', value: 'no', left: true }, { label: 'Ask me later', value: null },
      { label: 'Track it', value: 'ok', primary: true, check: d => $('#sp-name', d).value.trim() ? null : 'Give it a name, like what it was for.' }],
    onOpen: d => { $('#sp-cat', d).onclick = async e => { const id = await pickCategory(e.currentTarget, { income: false }); if (id) { e.target.dataset.id = id; e.target.textContent = catName(id); } }; },
  });
  if (v === 'ok') {
    const name = $('#sp-name').value.trim();
    await call('subscription_from_transaction', { txn_id: q.txn_id, name, category_id: Number($('#sp-cat').dataset.id),
      cadence: $('#sp-cadence').value, kind: $('#sp-kind').value, pricing: $('#sp-pricing').value, ends_on: $('#sp-ends').value || null });
    toast(`Tracking ${q.payee} · ${name}`, { action: undoAction });
  } else if (v === 'no') {
    await call('not_a_subscription', [q.txn_id]);
    toast(`Won't ask about ${q.payee} at ${money(q.amount)} again`, { action: undoAction });
  }
}

async function acceptAll() {
  const ids = (state.inboxShown || state.inbox.items).filter(i => i.guess).map(i => i.id);
  if (!ids.length) return;
  if (!await confirmBox('Accept all suggestions?', `Puts ${plural(ids.length, 'transaction')} in the category the app suggested. You can change any of them later.`, 'Accept all')) return;
  const r = await call('accept_all', { txn_ids: ids });
  toast(`Categorized ${plural(r.categorized + (r.also_categorized || 0), 'transaction')}`, { action: undoAction });
  await renderInbox();
}

async function transferDialog(txId, fromAccountName) {
  await loadAccounts();
  const t = findTx(txId);
  const options = state.accounts.filter(a => a.id !== (t ? t.account_id : null) && (!a.closed || (t && t.transfer_account_id === a.id)));
  const v = await dialog({
    title: 'Transfer between your accounts',
    body: `<p class="muted">Money moving between your own accounts isn't spending, so it has no category. ${options.length ? '' : 'Add the other account on the Accounts page first.'}</p>
      <div class="field"><label>${t && t.amount < 0 ? 'Went to' : 'Came from'}</label><select id="tr-acct">${options.map(a => `<option value="${a.id}" ${t && t.transfer_account_id === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>`,
    actions: [...(t && t.transfer_account_id ? [{ label: 'Not a transfer', value: 'none', left: true }] : []), { label: 'Cancel', value: null }, { label: 'Mark as transfer', value: 'ok', primary: true }],
  });
  if (!v) return false;
  const account = v === 'none' ? null : Number($('#tr-acct').value);
  await call('update_transaction', [txId, { transfer_account_id: account }]);
  toast(account ? 'Marked as a transfer' : 'No longer a transfer', { action: undoAction });
  return true;
}

const findTx = id => {
  for (const src of [state.inbox && state.inbox.items, state.inbox && state.inbox.categorized, state.txns && state.txns.items, state.spentTx]) {
    for (const t of src || []) if (t.id === id) return t;
  }
  return null;
};

async function splitDialog(txId) {
  const t = findTx(txId);
  if (!t) return false;
  const lines = t.splits && t.splits.length ? t.splits.map(s => ({ category_id: s.category_id, amount: s.amount }))
    : [{ category_id: t.category_id, amount: t.amount }, { category_id: null, amount: 0 }];
  const draw = d => {
    const body = d.querySelector('.dlg-body');
    const used = lines.reduce((s, l) => s + (l.amount || 0), 0);
    body.innerHTML = `<p class="muted">${esc(t.payee_name || t.raw_name)} · ${dayYear(t.date)} · <b>${money(t.amount)}</b></p>
      ${lines.map((l, i) => `<div class="row" style="margin-bottom:6px">
        <button type="button" class="btn" style="flex:1;text-align:left" data-split-cat="${i}">${esc(catName(l.category_id) || 'Pick a category…')}</button>
        <input style="width:120px;text-align:right" data-split-amt="${i}" value="${moneyOrBlank(Math.abs(l.amount))}" placeholder="0.00">
        <button type="button" class="icon-btn danger" data-split-del="${i}">✕</button></div>`).join('')}
      <div class="row"><button type="button" class="btn small" data-split-add>Add a line</button><span class="spacer"></span>
        <span class="small">Left to split: <b class="${used !== t.amount ? 'warn' : 'pos'}">${money(Math.abs(t.amount - used))}</b></span></div>`;
  };
  const sign = t.amount < 0 ? -1 : 1;
  const v = await dialog({
    title: 'Split transaction', body: '',
    actions: [...(t.is_split ? [{ label: 'Unsplit', value: 'unsplit', left: true }] : []), { label: 'Cancel', value: null },
      { label: 'Save split', value: 'ok', primary: true, check: () => {
        const sum = lines.reduce((s, l) => s + (l.amount || 0), 0);
        if (lines.filter(l => l.amount).length < 2) return 'Add at least two lines.';
        if (sum !== t.amount) return `The lines add up to ${money(Math.abs(sum))}, not ${money(Math.abs(t.amount))}.`;
        if (lines.some(l => l.amount && !l.category_id)) return 'Every line needs a category.';
        return null;
      } }],
    onOpen: d => {
      draw(d);
      const body = d.querySelector('.dlg-body');
      body.oninput = e => {
        const i = e.target.dataset.splitAmt;
        if (i === undefined) return;
        const c = parseMoney(e.target.value);
        lines[Number(i)].amount = Number.isNaN(c) || c === null ? 0 : sign * Math.abs(c);
        const used = lines.reduce((s, l) => s + (l.amount || 0), 0);
        const b = body.querySelector('.row:last-child b');
        b.textContent = money(Math.abs(t.amount - used)); b.className = used !== t.amount ? 'warn' : 'pos';
      };
      body.onclick = async e => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.splitCat !== undefined) {
          const id = await pickCategory(b);
          if (id) { lines[Number(b.dataset.splitCat)].category_id = id; draw(d); }
        } else if (b.dataset.splitDel !== undefined) { lines.splice(Number(b.dataset.splitDel), 1); draw(d); }
        else if (b.dataset.splitAdd !== undefined) {
          const used = lines.reduce((s, l) => s + (l.amount || 0), 0);
          lines.push({ category_id: null, amount: t.amount - used }); draw(d);
        }
      };
    },
  });
  if (v === 'unsplit') { await call('unsplit_transaction', [txId]); toast('Unsplit', { action: undoAction }); return true; }
  if (v !== 'ok') return false;
  await call('split_transaction', [txId, lines.filter(l => l.amount)]);
  toast('Split saved', { action: undoAction });
  return true;
}

async function renameDialog(txId) {
  const t = findTx(txId);
  if (!t) return false;
  const payees = await call('payees');
  const v = await dialog({
    title: 'Payee',
    body: `<p class="muted small">The bank wrote <span style="font-family:ui-monospace,Menlo,monospace">${esc(t.raw_name)}</span>. Give it a clearer name, or pick another payee it belongs to: every transaction with the same bank description moves with it, and the app remembers.</p>
      <div class="field"><label>Payee</label><input id="payee-name" list="payee-list" value="${esc(t.payee_name || '')}"></div>
      <datalist id="payee-list">${payees.map(p => `<option value="${esc(p.name)}">`).join('')}</datalist>`,
    actions: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', primary: true }],
  });
  if (v !== 'ok') return false;
  await call('update_transaction', [txId, { payee: $('#payee-name').value }]);
  toast('Payee saved', { action: undoAction });
  return true;
}

// Tracks a charge as a subscription or bill from here on (the Inbox, or a transaction you opened).
async function newSubscriptionDialog(txId) {
  const t = findTx(txId);
  if (!t) return false;
  const x = { amount: -t.amount, cadence: 'monthly', kind: 'subscription', category_id: t.category_id, pricing: 'fixed' };
  const v = await dialog({
    title: `Track ${t.payee_name || t.raw_name} at ${money(-t.amount)}`,
    body: `<p class="small muted" style="margin-top:0">Its charges show under this name and go to its category without asking.</p>${subFormHtml(x, false)}`,
    onOpen: bindSubForm,
    actions: [{ label: 'Cancel', value: null }, { label: 'Track it', value: 'ok', primary: true, check: d => {
      if (!$('#sf-name', d).value.trim()) return 'Give it a name, like what it\'s for.';
      const a = parseMoney($('#sf-amount', d).value); return Number.isNaN(a) ? 'That price isn\'t an amount.' : null;
    } }],
  });
  if (v !== 'ok') return false;
  const name = $('#sf-name').value.trim(), cat = $('#sf-cat').dataset.id, amount = parseMoney($('#sf-amount').value);
  await call('subscription_from_transaction', { txn_id: txId, name, category_id: cat ? Number(cat) : null,
    cadence: $('#sf-cadence').value, kind: $('#sf-kind').value, pricing: $('#sf-pricing').value,
    ends_on: $('#sf-ends').value || null, amount: amount ? Math.abs(amount) : null, note: $('#sf-note').value });
  toast(`Tracking ${name}`, { action: undoAction });
  return true;
}

async function inboxAction(btn, e) {
  const act = btn.dataset.act;
  const id = Number(btn.dataset.id);
  const card = btn.closest('.item');
  if (card) { state.inboxSel = Number(card.dataset.index); markSelected(false); }
  if (btn.dataset.pick) return fileBlock(Number(card.dataset.index), Number(btn.dataset.pick));
  if (act === 'other' || act === 'other-group') {
    const cid = await pickCategory(btn);
    if (cid) await fileBlock(Number(card.dataset.index), cid);
  } else if (act === 'expand') { state.expanded.add(btn.dataset.group); await renderInbox(); }
  else if (act === 'inbox-payee') {
    const id = btn.dataset.payee ? Number(btn.dataset.payee) : null;
    state.inboxFind.payee = state.inboxFind.payee === id ? null : id;
    state.inboxSel = 0; drawInbox();
  } else if (act === 'inbox-clear') { state.inboxFind = { text: '', payee: null }; state.inboxSel = 0; drawInbox(); }
  else if (act === 'transfer') { if (await transferDialog(id)) await renderInbox(); }
  else if (act === 'split') { if (await splitDialog(id)) await renderInbox(); }
  else if (act === 'rename') { if (await renameDialog(id)) await renderInbox(); }
  else if (act === 'same') {
    await call('same_payee', [id, btn.dataset.yes === '1']);
    await renderInbox();
  } else if (act === 'sub-link') {
    await call('link_subscription', [id, Number(btn.dataset.sub)]);
    toast('New price saved', { action: undoAction }); await renderInbox();
  } else if (act === 'sub-new') { if (await newSubscriptionDialog(id)) await renderInbox(); }
  else if (act === 'always-ask') {
    const categorized = await call('set_always_ask', [Number(btn.dataset.payee), btn.dataset.on === '1']);
    toast(btn.dataset.on === '1' ? 'Each one is asked about on its own now, and none are categorized without asking'
      : categorized ? `${plural(categorized, 'transaction')} categorized without asking` : 'Grouped together again', { action: undoAction });
    await renderInbox();
  } else if (act === 'accept-all') await acceptAll();
  else if (act === 'save-balance') await saveBalanceFrom(btn);
  else if (act === 'setup-file') await setupFiles([state.inbox.files[Number(btn.dataset.index)]]);
  else if (act === 'ignore-file') {
    const f = state.inbox.files[Number(btn.dataset.index)];
    await call('ignore_file', [f.path]);
    toast(`${f.filename} won't be asked about again`);
    await renderInbox();
  } else if (act === 'merge-account') {
    const a = state.inbox.alerts.find(x => x.type === 'duplicate' && x.account_id === Number(btn.dataset.account));
    if (a) await mergeAccount(a.account_id, a.into_id, a.name, a.into_name);
  } else if (act === 'recat') {
    const cid = await pickCategory(btn);
    if (!cid) return;
    const r = await call('update_transaction', [id, { category_id: cid }]);
    toast(`Changed to ${catName(cid)}`, { action: undoAction }); await renderInbox();
    if (r.question) await subscriptionPrompt(r.question);
  }
}

function duplicateNotice(d) {
  return `<div class="notice wrap"><span>${esc(d.name)} looks like a copy of ${esc(d.into_name)}: ${d.shared} of its ${plural(d.total, 'transaction')} are in both.</span><span class="spacer"></span>
    <button class="btn small" data-act="merge-account" data-account="${d.account_id}" data-into="${d.into_id}">Merge into ${esc(d.into_name)}</button></div>`;
}

// One account into another (the same account imported twice). Undoable.
const mergeText = (from, into) => `Transactions already in ${into} are dropped, the rest move over, and ${from} is removed. You can undo it right after.`;
async function mergeAccount(fromId, intoId, fromName, intoName, ask = true) {
  if (ask && !await confirmBox(`Merge ${fromName} into ${intoName}?`, mergeText(fromName, intoName), 'Merge')) return;
  const r = await call('merge_accounts', [fromId, intoId]);
  await loadCategories();
  toast(`Merged into ${r.into}: ${plural(r.moved, 'transaction')} moved, ${plural(r.dropped, 'copy', 'copies')} removed`, { action: undoAction });
  await refresh();
}

// ── CSVs from any bank: set up once ──
const KIND_OPTIONS = [['chequing', 'Chequing'], ['savings', 'Savings'], ['credit_card', 'Credit card'],
                      ['line_of_credit', 'Line of credit'], ['cash', 'Wallet']];
const bankList = names => `<datalist id="bank-list">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;

// Shows the app a CSV's columns and which account it's for, then imports it. Resolves
// with the import's outcome, or null if closed.
async function setupFile(path) {
  const r = await tryCall('csv_setup', [path]);
  if (!r.ok) { toast(r.error, { error: true }); return null; }
  const info = r.result;
  const [accounts, banks] = await Promise.all([call('accounts'), call('bank_names')]);
  const L = info.layout, cols = info.header;
  const colOptions = (selected, none) => (none ? `<option value="">${none}</option>` : '') +
    cols.map((h, i) => `<option value="${i}" ${selected === i ? 'selected' : ''}>${esc(h)}</option>`).join('');
  const lower = info.filename.toLowerCase();
  const brand = /visa/.test(lower) ? 'Visa' : /master ?card|\bmc\b/.test(lower) ? 'Mastercard' : /amex/.test(lower) ? 'Amex' : '';
  const kindGuess = brand || /card|credit/.test(lower) ? 'credit_card' : /saving/.test(lower) ? 'savings' : 'chequing';
  const two = L.amount_col === null || L.amount_col === undefined;
  let outcome = null, nameTouched = false, readLayout = () => ({}), readAccount = () => ({});
  const v = await dialog({
    title: info.saved ? `Which account is ${info.filename} for?` : `Set up ${info.filename}`,
    wide: true,
    body: `${info.saved ? '' : `<p class="small muted" style="margin-top:0">Show the app which column is which, once. Files like this one are read on their own after that. Quicken (QFX) or Money (OFX) downloads, if your bank has them, need no setting up and include the balance.</p>`}
      <div class="csv-sample"><table><thead><tr>${cols.map((h, i) => `<th data-col="${i}">${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${info.sample.slice(0, 4).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div id="su-columns" ${info.saved ? 'hidden' : ''}>
        <div class="grid2">
          <div class="field"><label>Date</label><select id="su-date">${colOptions(L.date_col)}</select></div>
          <div class="field"><label>Dates are</label><select id="su-order">${[['mdy', 'Month/Day/Year'], ['dmy', 'Day/Month/Year'], ['ymd', 'Year-Month-Day']].map(([v, t]) => `<option value="${v}" ${L.date_order === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          <div class="field"><label>Description</label><select id="su-desc">${colOptions(L.desc_cols[0])}</select></div>
          <div class="field"><label>More description</label><select id="su-desc2">${colOptions(L.desc_cols[1], 'None')}</select></div>
        </div>
        <div class="field"><label>Amounts</label><div class="seg" id="su-mode"><button type="button" data-mode="one" aria-pressed="${!two}">One column</button><button type="button" data-mode="two" aria-pressed="${two}">Money out and money in</button></div></div>
        <div class="grid2" id="su-one" ${two ? 'hidden' : ''}>
          <div class="field"><label>Amount</label><select id="su-amount">${colOptions(L.amount_col)}</select></div>
          <div class="field"><label>Money out shows as</label><select id="su-negate"><option value="0" ${L.negate ? '' : 'selected'}>Negative (−12.50)</option><option value="1" ${L.negate ? 'selected' : ''}>Positive (12.50)</option></select></div>
        </div>
        <div class="grid2" id="su-two" ${two ? '' : 'hidden'}>
          <div class="field"><label>Money out</label><select id="su-out">${colOptions(L.out_col)}</select></div>
          <div class="field"><label>Money in</label><select id="su-in">${colOptions(L.in_col)}</select></div>
        </div>
      </div>
      ${info.saved ? `<p class="small muted" style="margin-top:0">The app already knows files like this one. <button type="button" class="link" id="su-show-columns">Change columns…</button></p>` : ''}
      <div class="field"><label>Account</label><select id="su-account"><option value="">New account…</option>${accounts.filter(a => !a.closed || a.id === info.account_id).map(a => `<option value="${a.id}" ${info.account_id === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
      <div class="grid3" id="su-new">
        <div class="field"><label>Bank</label><input id="su-bank" list="bank-list" placeholder="Search or type a name" autocomplete="off">${bankList(banks)}</div>
        <div class="field"><label>Type</label><select id="su-kind">${KIND_OPTIONS.map(([v, t]) => `<option value="${v}" ${v === kindGuess ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label>Name</label><input id="su-name"></div>
      </div>
      <div class="su-preview small" id="su-preview"></div>`,
    actions: [
      { label: 'Not a bank file', value: 'ignore', left: true },
      { label: 'Cancel', value: null },
      { label: 'Import', value: 'import', primary: true, check: async () => {
        const r = await tryCall('setup_csv', [path, readLayout(), readAccount()]);
        if (!r.ok) return r.error;
        outcome = r.result;
        return null;
      } },
    ],
    onOpen: d => {
      const mode = () => $('#su-mode [aria-pressed="true"]', d).dataset.mode;
      readLayout = () => ({
        has_header: info.has_header, date_col: $('#su-date', d).value, date_order: $('#su-order', d).value,
        desc_cols: [$('#su-desc', d).value, $('#su-desc2', d).value].filter(x => x !== ''),
        amount_col: mode() === 'one' ? $('#su-amount', d).value : null, negate: $('#su-negate', d).value === '1',
        out_col: mode() === 'two' ? $('#su-out', d).value : null, in_col: mode() === 'two' ? $('#su-in', d).value : null,
      });
      readAccount = () => $('#su-account', d).value ? { id: Number($('#su-account', d).value) }
        : { name: $('#su-name', d).value, kind: $('#su-kind', d).value, bank: $('#su-bank', d).value };
      const autoName = () => {
        if (nameTouched) return;
        const kind = $('#su-kind', d).value;
        const label = kind === 'credit_card' && brand ? brand : KIND_OPTIONS.find(k => k[0] === kind)[1];
        $('#su-name', d).value = [$('#su-bank', d).value.trim(), label].filter(Boolean).join(' ');
      };
      const preview = debounce(async () => {
        const lay = readLayout();
        $$('th[data-col]', d).forEach(th => {
          const c = th.dataset.col, roles = [];
          if (c === lay.date_col) roles.push('Date');
          if (lay.desc_cols.includes(c)) roles.push('Description');
          if (c === lay.amount_col) roles.push('Amount');
          if (c === lay.out_col) roles.push('Money out');
          if (c === lay.in_col) roles.push('Money in');
          if (roles.length) th.dataset.role = roles.join(', '); else delete th.dataset.role;
        });
        const r = await tryCall('csv_preview', [path, lay]);
        $('#su-preview', d).innerHTML = r.ok
          ? `<div class="muted" style="margin-bottom:4px">${plural(r.result.total, 'transaction')}, ${dayYear(r.result.first_date)} – ${dayYear(r.result.last_date)}. The first few as the app reads them:</div>` +
            r.result.rows.map(t => `<div class="row"><span class="muted nowrap" style="width:60px">${day(t.date)}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.description)}</span><span class="num ${t.amount > 0 ? 'pos' : ''}">${money(t.amount)}</span></div>`).join('')
          : `<div class="neg">${esc(r.error)}</div>`;
      }, 150);
      $('#su-mode', d).addEventListener('click', e => {
        const b = e.target.closest('[data-mode]');
        if (!b) return;
        $$('#su-mode button', d).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        $('#su-one', d).hidden = b.dataset.mode !== 'one';
        $('#su-two', d).hidden = b.dataset.mode !== 'two';
        preview();
      });
      const more = $('#su-show-columns', d);
      if (more) more.addEventListener('click', () => { $('#su-columns', d).hidden = false; more.parentElement.hidden = true; });
      $('#su-columns', d).addEventListener('change', preview);
      const syncAccount = () => { $('#su-new', d).hidden = !!$('#su-account', d).value; };
      $('#su-account', d).addEventListener('change', syncAccount);
      $('#su-bank', d).addEventListener('input', autoName);
      $('#su-kind', d).addEventListener('change', autoName);
      $('#su-name', d).addEventListener('input', () => { nameTouched = true; });
      syncAccount(); autoName(); preview();
    },
  });
  if (v === 'ignore') { await call('ignore_file', [path]); toast(`${info.filename} won't be asked about again`); return null; }
  return v === 'import' ? outcome : null;
}

// A bank file for an account the app hasn't seen, when you have one it could be (a
// replaced card gets a new number): a new account, or one you have? Then imports it.
// Resolves with the import's outcome, or null if closed.
async function chooseAccounts(path) {
  const r = await tryCall('file_accounts', [path]);
  if (!r.ok) { toast(r.error, { error: true }); return null; }
  const info = r.result;
  const unknown = info.parts.filter(p => !p.account_id);
  if (!unknown.length) return call('set_file_accounts', [path, []]);  // answered with an earlier file
  let outcome = null;
  const v = await dialog({
    title: unknown.length === 1 ? 'A new account?' : 'New accounts?',
    body: `<p class="small muted" style="margin-top:0">${esc(info.filename)} is for ${unknown.length === 1 ? 'an account' : 'accounts'} the app hasn't seen. If it's one you have (a new card number, say), pick it.</p>
      ${unknown.map(p => `<div class="field"><label>${esc(p.name)}${p.last4 && !p.name.includes(p.last4) ? ` ••${esc(p.last4)}` : ''} · ${plural(p.rows, 'transaction')}${p.first_date ? `, ${dayYear(p.first_date)} – ${dayYear(p.last_date)}` : ''}</label>
        <div class="row"><select data-part="${p.index}" style="width:220px;flex:none"><option value="">New account</option>${p.choices.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
          <input data-part-name="${p.index}" value="${esc(p.name)}" placeholder="Name" style="flex:1;min-width:0"></div></div>`).join('')}`,
    actions: [
      { label: 'Don\'t import', value: 'ignore', left: true },
      { label: 'Cancel', value: null },
      { label: 'Import', value: 'import', primary: true, check: async d => {
        const choices = unknown.map(p => {
          const picked = $(`[data-part="${p.index}"]`, d).value;
          return picked ? { index: p.index, account_id: Number(picked) } : { index: p.index, name: $(`[data-part-name="${p.index}"]`, d).value };
        });
        const r = await tryCall('set_file_accounts', [path, choices]);
        if (!r.ok) return r.error;
        outcome = r.result;
        return null;
      } },
    ],
    onOpen: d => $$('[data-part]', d).forEach(sel => {
      const sync = () => { $(`[data-part-name="${sel.dataset.part}"]`, d).hidden = !!sel.value; };
      sel.addEventListener('change', sync);
      sync();
    }),
  });
  if (v === 'ignore') { await call('ignore_file', [path]); toast(`${info.filename} won't be imported`); return null; }
  return v === 'import' ? outcome : null;
}

// One after another: each pop-up waits for the one before.
async function setupFiles(files) {
  for (const f of files) {
    const outcome = await (f.needs === 'new_account' ? chooseAccounts(f.path) : setupFile(f.path));
    if (outcome) window.appEvent('imported', outcome);
  }
  await refresh();
}

async function saveBalanceFrom(btn) {
  const acct = Number(btn.dataset.account);
  const input = $(`[data-balance-for="${acct}"]`);
  const cents = parseMoney(input.value);
  if (cents === null || Number.isNaN(cents)) return toast('Enter the balance your bank shows', { error: true });
  await call('set_balance', [acct, cents]);
  toast('Balance saved', { action: undoAction });
  await refresh();
}

function inboxKeys(e) {
  if (state.page !== 'inbox' || !state.blocks || !state.blocks.length) return;
  if (e.target.closest('input, textarea, select, dialog, .popover')) return;
  const b = state.blocks[state.inboxSel];
  const card = $(`.item[data-index="${state.inboxSel}"]`);
  if (e.key === 'ArrowDown' || e.key === 'j') { state.inboxSel = Math.min(state.inboxSel + 1, state.blocks.length - 1); markSelected(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { state.inboxSel = Math.max(state.inboxSel - 1, 0); markSelected(); e.preventDefault(); }
  else if (e.key === 'Enter') { const chip = card && card.querySelector('[data-pick]'); if (chip) { e.preventDefault(); fileBlock(state.inboxSel, Number(chip.dataset.pick)); } }
  else if (/^[1-4]$/.test(e.key)) { const chip = card && card.querySelectorAll('[data-pick]')[Number(e.key) - 1]; if (chip) { e.preventDefault(); fileBlock(state.inboxSel, Number(chip.dataset.pick)); } }
  else if (e.key === '/') { const o = card && card.querySelector('[data-act^="other"]'); if (o) { e.preventDefault(); o.click(); } }
  else if (e.key === 't' && b.items.length === 1) { e.preventDefault(); inboxAction(card.querySelector('[data-act="transfer"]')); }
  else if (e.key === 's' && b.items.length === 1) { e.preventDefault(); inboxAction(card.querySelector('[data-act="split"]')); }
}

// ── transactions ────────────────────────────────────────
async function renderTransactions() {
  if (!state.categories.length) await loadCategories();
  await loadAccounts();
  const f = state.txFilters;
  const data = await call('transactions', [{ ...f, limit: 1000 }]);
  state.txns = data;
  const months = state.view ? state.view.months : [];
  const catOptions = state.categories.map(g => `<optgroup label="${esc(g.name)}">${g.categories.map(c => `<option value="${c.id}" ${f.category_id == c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  const rows = data.items.map(t => `<tr class="clickable" data-tx="${t.id}">
      <td class="muted nowrap">${dayYear(t.date)}</td>
      <td class="small muted">${esc(t.account_name)}</td>
      <td>${esc(t.payee_name || t.raw_name)}${t.subscription_name ? ` <span class="tag info">${esc(t.subscription_name)}</span>` : ''}${t.note ? ` <span class="faint small">· ${esc(t.note)}</span>` : ''}${t.status === 'review' ? ' <span class="tag warn">to review</span>' : ''}</td>
      <td>${t.transfer_account_name ? `<span class="tag">${t.amount < 0 ? 'To' : 'From'} ${esc(t.transfer_account_name)}</span>` :
            t.is_split ? `<span class="tag">Split</span> <span class="small muted">${esc(t.splits.map(s => s.category_name).join(', '))}</span>` :
            `<button class="link" data-act="tx-cat" data-id="${t.id}">${esc(t.category_name || 'No category')}</button>`}</td>
      <td class="r num ${t.amount > 0 ? 'pos' : ''}">${money(t.amount)}</td></tr>`).join('');
  frame(`
    <div class="page-head"><h1>Transactions</h1><span class="spacer"></span><button class="btn" data-act="add-tx">Add transaction…</button></div>
    <div class="row wrap" style="margin-bottom:12px">
      <input type="search" id="tx-search" placeholder="Search payee, description, note or amount" style="flex:1;min-width:220px" value="${esc(f.search || '')}">
      <select id="tx-account"><option value="">All accounts</option>${state.accounts.map(a => `<option value="${a.id}" ${f.account_id == a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <select id="tx-month"><option value="">All months</option>${[...months].reverse().map(m => `<option value="${m}" ${f.month === m ? 'selected' : ''}>${monthLong(m)}</option>`).join('')}</select>
      <select id="tx-category"><option value="">All categories</option>${catOptions}</select>
    </div>
    <div class="card" style="padding:4px 8px">
      ${data.items.length ? `<table><thead><tr><th>Date</th><th>Account</th><th>Payee</th><th>Category</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
        <p class="small muted" style="padding:4px 10px">${plural(data.items.length, 'transaction')} · total ${money(data.total)}</p>`
        : '<div class="empty"><b>No transactions</b>Nothing matches these filters.</div>'}
    </div>`);
  const refetch = debounce(() => renderTransactions(), 250);
  $('#tx-search').addEventListener('input', e => { f.search = e.target.value; refetch(); });
  $('#tx-account').addEventListener('change', e => { f.account_id = e.target.value || null; renderTransactions(); });
  $('#tx-month').addEventListener('change', e => { f.month = e.target.value || null; renderTransactions(); });
  $('#tx-category').addEventListener('change', e => { f.category_id = e.target.value || null; renderTransactions(); });
  if (f.search) { const s = $('#tx-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

async function editTransaction(id) {
  const t = findTx(id);
  if (!t) return;
  const v = await dialog({
    title: t.payee_name || t.raw_name || 'Transaction',
    body: `<div class="grid2">
        <div class="field"><label>Date</label>${t.manual ? `<input type="date" id="ed-date" value="${t.date}">` : `<div>${dayYear(t.date)}</div>`}</div>
        <div class="field"><label>Amount</label>${t.manual ? `<input id="ed-amount" value="${moneyPlain(t.amount)}">` : `<div class="num ${t.amount > 0 ? 'pos' : ''}">${money(t.amount)}</div>`}</div></div>
      <div class="grid2"><div class="field"><label>Account</label><div>${esc(t.account_name)}</div></div>
        ${t.is_split || t.transfer_account_id ? '' : `<div class="field"><label>Category</label><button type="button" class="btn" id="ed-cat" data-id="${t.category_id || ''}" style="text-align:left">${esc(t.category_name || 'Pick…')}</button></div>`}</div>
      ${t.raw_name ? `<div class="field"><label>The bank wrote</label><div class="small" style="font-family:ui-monospace,Menlo,monospace">${esc(t.raw_name)}${t.raw_memo ? '<br>' + esc(t.raw_memo) : ''}</div></div>` : ''}
      <div class="field"><label>Note</label><input id="ed-note" value="${esc(t.note || '')}"></div>
      ${t.amount < 0 && t.payee_id && !t.transfer_account_id ? `<div class="field"><label>Subscription</label><div class="row">
        ${t.subscription_name ? `<span>${esc(t.subscription_name)}</span>` : '<span class="muted">Not tracked</span>'}<span class="spacer"></span>
        <button type="button" class="btn small" data-dlg-value="subscription">${t.subscription_name ? 'Edit…' : 'Track as subscription…'}</button></div></div>` : ''}
      ${t.reason ? `<p class="small muted">💡 ${esc(t.reason)}</p>` : ''}`,
    actions: [{ label: 'Delete', value: 'delete', danger: true, left: true },
      { label: 'Payee…', value: 'payee' }, { label: 'Split…', value: 'split' }, { label: 'Transfer…', value: 'transfer' },
      { label: 'Save', value: 'save', primary: true }],
    onOpen: d => {
      const b = $('#ed-cat', d);
      if (b) b.onclick = async () => { const cid = await pickCategory(b); if (cid) { b.dataset.id = cid; b.textContent = catName(cid); } };
    },
  });
  if (!v) return;
  // A note or category chosen before going on to Payee…, Split…, Transfer… or the subscription isn't lost.
  const note = $('#ed-note').value;
  const picked = $('#ed-cat') && Number($('#ed-cat').dataset.id) || null;
  const edits = {};
  if (note !== (t.note || '')) edits.note = note;
  if (picked && picked !== t.category_id) edits.category_id = picked;
  if (!['save', 'delete'].includes(v)) {
    // A split or a transfer replaces the category, so only the note is kept for those.
    const keep = ['split', 'transfer'].includes(v) ? ('note' in edits ? { note: edits.note } : {}) : edits;
    if (Object.keys(keep).length) await call('update_transaction', [id, keep]);
  }
  if (v === 'subscription') {
    if (!t.subscription_name) { if (!await newSubscriptionDialog(id)) return; }
    else {
      const subs = await call('subscriptions');
      const x = [...subs.subscriptions, ...subs.bills, ...subs.cancelled].find(y => y.id === t.subscription_id);
      if (!x || !await editSubscriptionDialog(x)) return;
    }
  } else if (v === 'save') {
    const changes = { ...edits };
    if (t.manual) {
      if ($('#ed-date').value && $('#ed-date').value !== t.date) changes.date = $('#ed-date').value;
      const a = parseMoney($('#ed-amount').value);
      if (!Number.isNaN(a) && a !== null && a !== t.amount) changes.amount = a;
    }
    if (!Object.keys(changes).length) return;  // nothing changed: just close
    const r = await call('update_transaction', [id, changes]);
    toast('Saved', { action: undoAction });
    if (r.question) await subscriptionPrompt(r.question);
  } else if (v === 'delete') {
    const ok = await confirmBox('Delete this transaction?', t.manual ? 'It will be removed.' : 'It will be removed. If you import a file that contains it again, it comes back.', 'Delete', true);
    if (!ok) return;
    await call('delete_transaction', [id]);
    toast('Deleted', { action: undoAction });
  } else if (v === 'payee') { if (!await renameDialog(id)) return; }
  else if (v === 'split') { if (!await splitDialog(id)) return; }
  else if (v === 'transfer') { if (!await transferDialog(id)) return; }
  await refresh();
}

    body: `<p class="small muted">For cash or an account the app can't import. Bank transactions arrive on their own.</p>
      <div class="grid2"><div class="field"><label>Account</label><select id="add-acct">${state.accounts.filter(a => !a.closed).map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Date</label><input type="date" id="add-date" value="${today}"></div></div>
      <div class="field"><label>Payee</label><input id="add-payee"></div>
      <div class="grid2"><div class="field"><label>Amount</label><div class="row"><div class="seg" id="add-dir"><button type="button" aria-pressed="true" data-dir="-1">Spent</button><button type="button" aria-pressed="false" data-dir="1">Received</button></div><input id="add-amount" style="flex:1;text-align:right" placeholder="0.00"></div></div>
      <div class="field"><label>Category</label><button type="button" class="btn" id="add-cat" style="text-align:left">Pick…</button></div></div>`,
    actions: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', primary: true, check: d => {
      const a = parseMoney($('#add-amount', d).value);
      return (!a || Number.isNaN(a)) ? 'Enter an amount.' : null;
    } }],
    onOpen: d => {
      $('#add-dir', d).onclick = e => { const b = e.target.closest('button'); if (!b) return; $$('#add-dir button', d).forEach(x => x.setAttribute('aria-pressed', x === b)); };
      $('#add-cat', d).onclick = async e => { const id = await pickCategory(e.currentTarget); if (id) { catId = id; e.target.textContent = catName(id); } };
    },
