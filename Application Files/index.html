    amount: dir * Math.abs(parseMoney($('#add-amount').value)), category_id: catId });
  toast('Added', { action: undoAction });
  await refresh();
}

// ── accounts ────────────────────────────────────────────
async function renderAccounts() {
  const [accounts, debt, imports] = await Promise.all([call('accounts'), call('debt'), call('imports')]);
  state.accounts = accounts;
  const cards = accounts.filter(a => !a.closed).map(a => {
    const owe = a.is_debt;
    return `<div class="card acct">
      <div class="row"><b>${esc(a.name)}</b><span class="faint small">${[a.bank && !a.name.toLowerCase().includes(a.bank.toLowerCase()) && esc(a.bank), a.last4 && `••${esc(a.last4)}`].filter(Boolean).join(' · ')}</span><span class="spacer"></span><span class="tag">${esc(a.kind_label)}</span></div>
      ${a.balance === null ? `<div class="notice" style="margin:10px 0">What ${owe ? 'do you owe on' : 'is the balance of'} this account right now?</div>
          <div class="row"><input style="width:150px;text-align:right" placeholder="${owe ? 'Amount owing' : 'Balance'}" data-balance-for="${a.id}"><button class="btn primary small" data-act="save-balance" data-account="${a.id}">Save</button></div>`
        : `<div class="bal num ${owe && a.balance < 0 ? 'neg' : ''}">${owe ? money(-a.balance) : money(a.balance)}</div>
           <div class="small muted">${owe ? 'owing' : 'balance'}${a.last_date ? ` · up to ${dayYear(a.last_date)}` : ''}</div>`}
      <div class="small muted" style="margin-top:8px">${plural(a.transactions, 'transaction')}${a.first_date ? ` since ${dayYear(a.first_date)}` : ''}${a.last_import ? ` · last import ${esc(a.last_import.slice(0, 10))}` : ''}</div>
      ${a.duplicate_of ? `<div style="margin-top:10px">${duplicateNotice(a.duplicate_of)}</div>` : ''}
      <div class="row" style="margin-top:10px">
        ${a.balance !== null ? `<button class="btn small" data-act="check-balance" data-account="${a.id}">Check balance…</button>` : ''}
        <button class="btn small" data-act="edit-account" data-account="${a.id}">Edit…</button>
        ${mergeTargets(accounts, a).length ? `<button class="btn small" data-act="merge-pick" data-account="${a.id}">Merge into…</button>` : ''}
        <span class="spacer"></span>
        ${a.used ? '' : `<button class="icon-btn danger" data-act="delete-account" data-account="${a.id}" title="Delete account">✕</button>`}
      </div></div>`;
  }).join('');
  const closedRows = accounts.filter(a => a.closed).map(a => `<tr><td><b>${esc(a.name)}</b> <span class="faint small">${esc(a.kind_label)}</span></td>
      <td class="small muted">${plural(a.transactions, 'transaction')}${a.last_date ? ` · up to ${dayYear(a.last_date)}` : ''}</td>
      <td class="r num">${a.balance ? (a.is_debt ? `${money(-a.balance)} owing` : money(a.balance)) : ''}</td>
      <td class="r"><button class="btn small" data-act="edit-account" data-account="${a.id}">Edit…</button></td></tr>`).join('');
  const debtCards = debt.accounts.map(d => {
    const maxI = Math.max(1, ...d.interest.map(i => i.amount));
    const payoff = d.payoff ? (d.payoff.months === 0 ? 'Paid off.' : `At ${money(d.estimate_payment)} a month it's paid off in about ${plural(d.payoff.months, 'month')}${d.apr ? `, costing ${money(d.payoff.interest)} in interest` : ' (enter the interest rate to include interest)'}.`)
      : (d.estimate_payment ? 'At this payment the interest grows faster than you pay it down.' : 'Enter a monthly payment to see when it\'s paid off.');
    return `<div class="card">
      <div class="row"><b>${esc(d.name)}</b><span class="spacer"></span><span class="tag ${d.not_covered ? 'warn' : 'good'}">${d.not_covered ? money(d.not_covered) + ' not set aside' : 'All set aside'}</span></div>
      <div class="grid2" style="margin-top:10px">
        <div><div class="muted small">You owe</div><div class="bal num">${money(d.owing)}</div>
          <div class="small muted">Set aside to pay it: <b>${money(d.set_aside)}</b></div></div>
        <div><div class="muted small">Interest & fees, last 6 months</div>
          <div class="mini-bars" title="${esc(d.interest.map(i => monthShort(i.month) + ' ' + money(i.amount)).join(', '))}">${d.interest.map(i => `<div style="height:${i.amount / maxI * 100}%"></div>`).join('')}</div>
          <div class="small muted">${money(d.interest_total)} total</div></div>
      </div>
      <div class="row wrap" style="margin-top:12px">
        <label class="small muted">Interest rate</label><input style="width:70px;text-align:right" data-apr="${d.account_id}" value="${d.apr ?? ''}" placeholder="20.99">%
        <label class="small muted" style="margin-left:10px">Paying each month</label><input style="width:110px;text-align:right" data-payment="${d.account_id}" value="${d.planned_payment ? moneyPlain(d.planned_payment) : ''}" placeholder="${d.estimate_payment ? moneyPlain(d.estimate_payment) : '0.00'}">
        <button class="btn small" data-act="save-debt" data-account="${d.account_id}">Save</button>
      </div>
      <p class="small" style="margin:8px 0 0">${payoff}</p>
      <p class="small muted" style="margin:6px 0 0">To pay it down faster, assign extra money to <b>${esc(d.name)} payment</b> on the Budget page.</p>
    </div>`;
  }).join('');
  const importRows = imports.map(i => `<tr><td class="small">${esc(i.imported_at.slice(0, 16).replace('T', ' '))}</td><td>${esc(i.filename)}</td><td class="small muted">${esc(i.account_name || '')}</td>
      <td class="small">${i.rows_new} new of ${i.rows_total}</td><td class="r"><button class="btn small" data-act="undo-import" data-import="${i.id}" ${i.rows_new ? '' : 'disabled'}>Remove</button></td></tr>`).join('');
  frame(`
    <div class="page-head"><h1>Accounts</h1><span class="spacer"></span><button class="btn" data-act="add-account">Add account…</button></div>
    <div class="stack">
      <div class="acct-grid">${cards || '<div class="card empty"><b>No accounts yet</b>Import a bank file and its account appears here.</div>'}</div>
      ${debtCards ? `<h2 style="margin-top:12px">Paying down debt</h2>${debtCards}` : ''}
      ${closedRows ? `<details class="card"><summary style="cursor:default;font-weight:600">Closed accounts</summary>
        <table><tbody>${closedRows}</tbody></table></details>` : ''}
      ${importRows ? `<details class="card"><summary style="cursor:default;font-weight:600">Imported files</summary>
        <p class="small muted">Removing an import deletes the transactions it added (not ones another file also had).</p>
        <table><tbody>${importRows}</tbody></table></details>` : ''}
    </div>`);
}

const mergeTargets = (accounts, a) => accounts.filter(x => x.id !== a.id && !x.closed && x.is_debt === a.is_debt);

async function accountAction(btn) {
  const act = btn.dataset.act, id = Number(btn.dataset.account);
  const a = state.accounts.find(x => x.id === id);
  if (act === 'save-balance') return saveBalanceFrom(btn);
  if (act === 'merge-account') {
    const into = state.accounts.find(x => x.id === Number(btn.dataset.into));
    return mergeAccount(a.id, into.id, a.name, into.name);
  }
  if (act === 'merge-pick') {
    const targets = mergeTargets(state.accounts, a);
    const v = await dialog({
      title: `Merge ${a.name} into…`,
      body: `<div class="field"><label>The same account as</label><select id="merge-into">${targets.map(x => `<option value="${x.id}" ${a.duplicate_of && a.duplicate_of.into_id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
        <p class="small muted">${esc(mergeText(a.name, 'that account'))}</p>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Merge', value: 'ok', primary: true }],
    });
    if (v !== 'ok') return;
    const into = targets.find(x => x.id === Number($('#merge-into').value));
    return mergeAccount(a.id, into.id, a.name, into.name, false);
  }
  if (act === 'check-balance') {
    const v = await dialog({
      title: `Check ${a.name}`,
      body: `<p class="muted">The app says ${a.is_debt ? 'you owe' : 'the balance is'} <b>${money(a.is_debt ? -a.balance : a.balance)}</b> after the last imported transaction (${dayYear(a.last_date)}).
        If ${esc(a.bank || 'your bank')} shows something else, enter it: the app adds an adjustment for the difference${a.is_debt ? '' : ' (you choose its category in the Inbox)'}.</p>
        <div class="field"><label>${a.is_debt ? 'Amount owing' : 'Balance'} at ${esc(a.bank || 'the bank')}</label><input id="rec-amount" style="text-align:right"></div>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Match it', value: 'ok', primary: true }],
    });
    if (v !== 'ok') return;
    const cents = parseMoney($('#rec-amount').value);
    if (cents === null || Number.isNaN(cents)) return;
    const r = await call('reconcile', [id, cents]);
    toast(r.adjusted ? `Adjusted by ${money(r.adjusted)}` : 'It already matches', { action: r.adjusted ? undoAction : undefined });
  } else if (act === 'edit-account') {
    const banks = await call('bank_names');
    const v = await dialog({ title: `Edit ${a.name}`, body: `<div class="field"><label>Name</label><input id="acct-name" value="${esc(a.name)}"></div>
        <div class="field"><label>Bank</label><input id="acct-bank" list="bank-list" value="${esc(a.bank || '')}" placeholder="Search or type a name" autocomplete="off">${bankList(banks)}</div>`,
      actions: [a.closed ? { label: 'Reopen account', value: 'reopen', left: true } : { label: 'Close account', value: 'close', left: true },
        { label: 'Cancel', value: null }, { label: 'Save', value: 'ok', primary: true }] });
    if (v === 'close' || v === 'reopen') {
      await call('update_account', [id, { closed: v === 'close' }]);
      toast(v === 'close' ? `${a.name} closed` : `${a.name} reopened`, { action: undoAction });
      return renderAccounts();
    }
    if (v !== 'ok') return;
    const changes = {};
    if ($('#acct-name').value.trim() !== a.name) changes.name = $('#acct-name').value;
    if ($('#acct-bank').value.trim() !== (a.bank || '')) changes.bank = $('#acct-bank').value;
    if (!Object.keys(changes).length) return;
    await call('update_account', [id, changes]);
    await loadCategories();
    toast('Saved', { action: undoAction });
  } else if (act === 'delete-account') {
    if (!await confirmBox(`Delete ${a.name}?`, 'You can undo it right after.', 'Delete', true)) return;
    await call('delete_account', [id]);
    await loadCategories();
    toast('Account deleted', { action: undoAction });
  } else if (act === 'save-debt') {
    const apr = $(`[data-apr="${id}"]`).value.trim();
    const pay = parseMoney($(`[data-payment="${id}"]`).value);
    await call('update_account', [id, { apr: apr === '' ? null : Number(apr), planned_payment: Number.isNaN(pay) ? null : pay }]);
    toast('Saved');
  } else if (act === 'add-account') {
    const banks = await call('bank_names');
    const v = await dialog({
      title: 'Add an account',
      body: `<p class="small muted">Accounts are added on their own when you import their files. Add one here for something else, like a line of credit.</p>
        <div class="grid2"><div class="field"><label>Name</label><input id="na-name" placeholder="Line of credit"></div>
        <div class="field"><label>Bank</label><input id="na-bank" list="bank-list" placeholder="Search or type a name" autocomplete="off">${bankList(banks)}</div></div>
        <div class="grid2"><div class="field"><label>Type</label><select id="na-kind"><option value="line_of_credit">Line of credit</option><option value="credit_card">Credit card</option><option value="chequing">Chequing</option><option value="savings">Savings</option><option value="cash">Wallet</option></select></div>
        <div class="field"><label>Balance now (owing, for credit)</label><input id="na-balance" placeholder="0.00" style="text-align:right"></div></div>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', primary: true, check: d => $('#na-name', d).value.trim() ? null : 'Give it a name.' }],
    });
    if (v !== 'ok') return;
    const bal = parseMoney($('#na-balance').value);
    await call('add_account', { name: $('#na-name').value, kind: $('#na-kind').value, balance: Number.isNaN(bal) ? null : bal, bank: $('#na-bank').value });
    await loadCategories();
    toast('Account added', { action: undoAction });
  } else if (act === 'undo-import') {
    if (!await confirmBox('Remove this import?', 'Deletes the transactions this file added.', 'Remove', true)) return;
    const r = await call('undo_import', [Number(btn.dataset.import)]);
    toast(`Removed ${plural(r.removed, 'transaction')}`, { action: undoAction });
  }
  await renderAccounts();
}

// ── subscriptions ───────────────────────────────────────
const per = c => ({ monthly: '/mo', yearly: '/yr', weekly: '/wk' }[c] || '');
const PRICING_LABELS = {
  fixed: 'Same Price',
  currency: 'Same Price, Different Currency',
  varies: 'Fluctuates Every Time',
};
const pricingSelect = (id, value) => `<select id="${id}">${Object.entries(PRICING_LABELS).map(([k, label]) =>
  `<option value="${k}" ${(value || 'fixed') === k ? 'selected' : ''}>${label}</option>`).join('')}</select>`;
function priceCell(x) {
  if (x.pricing === 'varies') {
    return `≈ ${money(x.amount)}<span class="muted small">${per(x.cadence)}</span>
      ${x.low !== null && x.low !== undefined ? `<div class="small muted">${money(x.low)}–${money(x.high)}${x.last_amount ? ` · last ${money(x.last_amount)}` : ''}</div>` : ''}`;
  }
  const was = x.previous_amount ? `<div><span class="tag ${x.amount > x.previous_amount ? 'warn' : 'good'}">was ${money(x.previous_amount)}</span></div>` : '';
  if (x.pricing === 'currency') return `≈ ${money(x.amount)}<span class="muted small">${per(x.cadence)}</span><div class="small muted">different currency</div>${was}`;
  return `${money(x.amount)}<span class="muted small">${per(x.cadence)}</span>${was}`;
}

function bindSubForm(d) {

// Edit… on the Subscriptions page, or on a transaction that's part of one. True if it changed.
async function editSubscriptionDialog(x) {
  const v = await dialog({ title: `Edit ${x.name}`, body: subFormHtml(x, false), onOpen: bindSubForm,
    actions: [{ label: 'Stop tracking', value: 'delete', danger: true, left: true }, { label: 'Cancel', value: null }, { label: 'Save', value: 'ok', primary: true }] });
  if (v === 'delete') { await call('delete_subscription', [x.id]); toast('Stopped tracking', { action: undoAction }); return true; }
  if (v !== 'ok') return false;
  const cat = $('#sf-cat').dataset.id;
  const amount = parseMoney($('#sf-amount').value);
  const changes = { name: $('#sf-name').value, kind: $('#sf-kind').value, cadence: $('#sf-cadence').value,
    note: $('#sf-note').value, category_id: cat ? Number(cat) : null, pricing: $('#sf-pricing').value, ends_on: $('#sf-ends').value || null,
    ...(amount && !Number.isNaN(amount) && Math.abs(amount) !== x.amount ? { amount: Math.abs(amount) } : {}) };
  const same = changes.name === x.name && changes.kind === x.kind && changes.cadence === x.cadence && changes.note === (x.note || '') &&
    changes.category_id === (x.category_id || null) && changes.pricing === x.pricing && changes.ends_on === (x.ends_on || null) && !changes.amount;
  if (same) return false;  // nothing changed: just close
  await call('update_subscription', [x.id, changes]);
  toast('Saved', { action: undoAction });
  return true;
}

async function subscriptionAction(btn) {
  const act = btn.dataset.act;
  const s = state.subs;
  if (act === 'sug-track') {
    const c = s.suggested[Number(btn.dataset.i)];
    const x = { name: c.name, amount: c.amount, cadence: c.cadence, kind: btn.dataset.kind, category_id: c.category_id, pricing: c.pricing };
    const v = await dialog({ title: `Track ${c.name} at ${money(c.amount)}`, body: subFormHtml(x, false), onOpen: bindSubForm,
      actions: [{ label: 'Cancel', value: null }, { label: 'Track it', value: 'ok', primary: true, check: d => $('#sf-name', d).value.trim() ? null : 'Give it a name.' }] });
    if (v !== 'ok') return;
    const cat = $('#sf-cat').dataset.id;
    const id = await call('track_subscription', { candidate: c, kind: $('#sf-kind').value, name: $('#sf-name').value, category_id: cat ? Number(cat) : null, pricing: $('#sf-pricing').value, ends_on: $('#sf-ends').value || null });
    const note = $('#sf-note').value, cadence = $('#sf-cadence').value;
    const amount = parseMoney($('#sf-amount').value);
    const priceChanged = amount && !Number.isNaN(amount) && Math.abs(amount) !== c.amount;
    if (note || cadence !== c.cadence || priceChanged) {
      await call('update_subscription', [id, { note, cadence, ...(priceChanged ? { amount: Math.abs(amount) } : {}) }]);
    }
    toast(`Tracking ${$('#sf-name').value}`, { action: undoAction });
  } else if (act === 'sug-dismiss') {
    await call('dismiss_subscription', [s.suggested[Number(btn.dataset.i)]]);
    toast('Won\'t suggest that again', { action: undoAction });
  } else if (act === 'sub-add') {
    const payees = await call('payees');
    const v = await dialog({ title: 'Add a subscription', body: subFormHtml({ cadence: 'monthly', kind: 'subscription' }, true),
      onOpen: d => { bindSubForm(d); $('#sf-payees', d).innerHTML = payees.map(p => `<option value="${esc(p.name)}">`).join(''); },
      actions: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', primary: true, check: d => {
        if (!$('#sf-payee', d).value.trim()) return 'Who charges it?';
        if (!$('#sf-name', d).value.trim()) return 'Give it a name.';
        const a = parseMoney($('#sf-amount', d).value); return (!a || Number.isNaN(a)) ? 'Enter the price.' : null;
      } }] });
    if (v !== 'ok') return;
    const cat = $('#sf-cat').dataset.id;
    const id = await call('add_subscription', { payee: $('#sf-payee').value, name: $('#sf-name').value, amount: Math.abs(parseMoney($('#sf-amount').value)),
      cadence: $('#sf-cadence').value, kind: $('#sf-kind').value, category_id: cat ? Number(cat) : null, pricing: $('#sf-pricing').value,
      ends_on: $('#sf-ends').value || null });
    if ($('#sf-note').value) await call('update_subscription', [id, { note: $('#sf-note').value }]);
    toast(`Tracking ${$('#sf-name').value}`, { action: undoAction });
  } else if (act === 'sub-edit') {
    if (!await editSubscriptionDialog([...s.subscriptions, ...s.bills].find(y => y.id === Number(btn.dataset.sub)))) return;
  } else if (act === 'sub-cancel') {
    const x = [...s.subscriptions, ...s.bills].find(y => y.id === Number(btn.dataset.sub));
    if (!await confirmBox(`Mark ${x.name} as cancelled?`, 'It moves to Cancelled, and if it charges you again you\'ll be told in the Inbox.', 'Mark cancelled')) return;
    await call('cancel_subscription', [x.id]);
    toast(`${x.name} marked cancelled`, { action: undoAction });
  } else if (act === 'sub-reactivate') { await call('reactivate_subscription', [Number(btn.dataset.sub)]); }
  else if (act === 'sub-delete') { await call('delete_subscription', [Number(btn.dataset.sub)]); toast('Stopped tracking', { action: undoAction }); }
  await renderSubscriptions();
}

  if (live && live.ok) upd = live.result;
  state.update = upd;
  const updText = !upd ? `You have ${info.version}. Updates work in the installed app.` :
    upd.unavailable ? `You have ${upd.current}. Off: ${upd.unavailable}.` :
    upd.status === 'checking' ? 'Checking…' : upd.status === 'downloading' ? `Downloading ${upd.version}…` :
    upd.status === 'ready' ? `Version ${upd.version} is ready; it's installed when you quit.` :
    upd.error ? `You have ${upd.current}. Last check failed: ${upd.error}` :

      <div class="card">

        ${row('Import from Downloads', 'Automatically import files from your Downloads folder.', toggle('auto_import'))}
        ${row('Overspending', OVERSPENDING[settings.overspending][1], `<div class="seg">${Object.entries(OVERSPENDING).map(([k, [label]]) => `<button data-overspending="${k}" aria-pressed="${settings.overspending === k}">${label}</button>`).join('')}</div>`)}

        ${upd && upd.needs_access ? row('GitHub access', 'The app\'s repository is private: updates need a GitHub token with read access to it.',
            '<input type="password" id="gh-token" placeholder="Token" style="width:180px"><button class="btn" data-act="save-token">Save</button>') : ''}

      </div>
      <div class="card">

        ${row('Imported files', 'Open the folder where all previously imported data is kept.', open('open_imports'))}
        ${row('Log', 'For developer use: open log files for troubleshooting.', open('open_log'))}
      </div>
    </div>`);
}

async function settingsAction(btn) {
  const act = btn.dataset.act;
  if (act === 'save-token') {
    const st = await call('window_action', ['set_github_token', $('#gh-token').value]);
    state.update = st; toast($('#gh-token').value ? 'Token saved in the Keychain' : 'Token removed');
  } else if (act === 'check-updates') {
    state.checkingByHand = true;  // the answer comes as an 'update' event: see appEvent
    try { state.update = await call('window_action', ['check_updates']); }
    catch (e) { state.checkingByHand = false; throw e; }
    toast('Checking for updates…');
  } else if (act === 'open') { await call('window_action', [btn.dataset.what]); return; }
  else if (act === 'learn-actual') {
    const r = await call('learn_actual_file');
    if (r && r.learnt) toast(`Learnt ${r.learnt.examples} examples${r.rechecked ? `, and categorized ${r.rechecked} waiting transactions` : ''}`);
  }
  await renderSettings();
}

    if (r) {
      const parts = [summarizeImport(r)];
      for (const f of r.needs_setup || []) { const o = await setupFile(f.path); if (o) parts.push(summarizeImport(o)); }
      ob.results = parts.join(' · '); ob.files = null;
    }
  } else if (a === 'setup') {
    const o = await setupFile(ob.files.files[Number(btn.dataset.file)].path);
    if (o) { ob.results = summarizeImport(o); ob.files = null; }
  } else if (a === 'import') {
    const paths = $$('[data-file]').filter(el => el.checked).map(el => ob.files.files[Number(el.dataset.file)].path);
    if (paths.length) {
      btn.disabled = true; btn.textContent = 'Importing…';
      const r = await call('import_files', [paths]);
      ob.results = summarizeImport(r);
      toast(ob.results);
    }
    ob.step = 1; ob.files = null;
  } else if (a === 'starter') { await call('use_starter_categories'); }
  else if (a === 'back') ob.step = Math.max(0, ob.step - 1);
  else if (a === 'next') ob.step += 1;
  else if (a === 'save-balances') {
    for (const el of $$('[data-ob-balance]')) {
      const cents = parseMoney(el.value);
      if (cents === null) continue;
      if (Number.isNaN(cents)) return toast('One of the balances isn\'t an amount', { error: true });
      await call('set_balance', [Number(el.dataset.obBalance), cents]);
    }
    ob.step = 3;
  } else if (a === 'finish') {
    state.boot = await call('finish_onboarding', [$('#ob-start').value]);
    $('#onboard').hidden = true;
    await loadCategories();
    return navigate('dashboard');
  }
  await renderOnboarding();
}
function summarizeImport(r) {
  const parts = [];
  const several = new Set((r.results || []).filter((x, i, all) => all.findIndex(y => y.filename === x.filename) !== i).map(x => x.filename));
  for (const x of r.results || []) parts.push(`${x.filename}${several.has(x.filename) ? ` (${x.account_name})` : ''}: ${x.added} new${x.duplicates ? `, ${x.duplicates} already there` : ''}`);
  if (r.learnt) parts.push(`learnt ${r.learnt.examples} examples from ${r.learnt.filename}`);
  for (const e of r.errors || []) parts.push(`${e.filename}: ${e.error}`);
  return parts.join(' · ') || 'Nothing new';
}

// ── events from Python ──────────────────────────────────
window.appEvent = (name, payload) => {
  if (name === 'imported') {
    if (payload.error) return toast(payload.error, { error: true });
    const results = payload.results || [];
    const added = results.reduce((s, r) => s + r.added, 0);
    const review = (payload.counts && payload.counts.inbox) || 0;
    if (payload.counts) setCounts(payload.counts);
    const waiting = payload.needs_setup || [];
    if (waiting.length && !payload.auto) setupFiles(waiting);  // you dropped them: ask now
    else if (waiting.length) {
      const names = waiting.map(f => f.filename).join(', ');
      toast(waiting.every(f => f.needs === 'new_account') ? `${names}: a new account?` : `${names} ${waiting.length === 1 ? 'needs' : 'need'} setting up`,
        { action: { label: waiting.every(f => f.needs === 'new_account') ? 'Choose…' : 'Set up', run: () => setupFiles(waiting) } });
    }
    if (!results.length && !payload.learnt) return;
    toast(added ? `Imported ${plural(added, 'new transaction')} from ${results.map(r => r.filename).join(', ')}${review ? ` · ${review} in the Inbox` : ''}`
      : `Nothing new in ${results.map(r => r.filename).join(', ')}`,
      review ? { action: { label: 'Open Inbox', run: () => navigate('inbox') } } : {});
    if (!$('#dlg').open && !$('.drawer') && !$('.popover') && !state.dragging && !$('#main .inline-name')) refresh();
  } else if (name === 'update') {
    state.update = payload;
    if (state.checkingByHand && payload.status !== 'checking') {
      // Always answer a check you asked for: "nothing happened" is the worst outcome.
      state.checkingByHand = false;
      if (payload.error) toast(`Couldn't check for updates: ${payload.error}`, { error: true });
      else if (payload.status === 'downloading') toast(`Found version ${payload.version}. Downloading it…`);
      else if (payload.status === 'idle') toast(`You're up to date: ${payload.current} is the latest version.`);
    }
    if (state.page === 'settings') renderSettings();
    else if (payload.status === 'ready' && !state.dragging && !$('#main .inline-name')) refresh();
  }
};

// ── wiring ──────────────────────────────────────────────
document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) return navigate(nav.dataset.nav);
  const to = e.target.closest('[data-nav-to]');
  if (to) return navigate(to.dataset.navTo);
  const obBtn = e.target.closest('[data-ob]');
  if (obBtn) { try { await onboardingAction(obBtn); } catch (_) {} return; }
  const m = e.target.closest('#main [data-month]');
  if (m) { state.month = m.dataset.month; return renderBudget(); }
  if (e.target.closest('.btable .drag-handle, .btable .inline-name')) return;
  const groupPlus = e.target.closest('.btable [data-group-plus]');
  if (groupPlus) return newGroupAbove(Number(groupPlus.dataset.groupPlus));
  const catPlus = e.target.closest('.btable [data-cat-plus]');
  if (catPlus) return newCategoryAbove(Number(catPlus.dataset.catPlus));
  const pencil = e.target.closest('.btable [data-group-pencil]');
  if (pencil) return renameGroupInPlace(Number(pencil.dataset.groupPencil));
  const catPencil = e.target.closest('.btable [data-cat-pencil]');
  if (catPencil) return renameCategoryInPlace(Number(catPencil.dataset.catPencil));
  const groupX = e.target.closest('.btable [data-group-x]');
  if (groupX) return deleteGroupAsked(Number(groupX.dataset.groupX));
  const spentGroup = e.target.closest('.btable [data-spent-group]');
  if (spentGroup) return openSpent({ month: state.month, group_id: Number(spentGroup.dataset.spentGroup) });
  const spent = e.target.closest('.btable [data-spent]');
  if (spent) return openCategory(Number(spent.dataset.spent));
  const copy = e.target.closest('.btable [data-copy-budget]');
  if (copy) return assignFromArrow(Number(copy.dataset.copyBudget), 'budget');
  const copySpent = e.target.closest('.btable [data-copy-spent]');
  if (copySpent) return assignFromArrow(Number(copySpent.dataset.copySpent), 'spent');
  const g = e.target.closest('.btable .group');
  if (g) { await call('set_group_collapsed', [Number(g.dataset.group), !g.classList.contains('collapsed')]); return renderBudget(); }
  const cat = e.target.closest('.btable [data-cat]');
  if (cat) return openCategory(Number(cat.dataset.cat));
  const row = e.target.closest('tr[data-tx]');
  // Suggestion chips ([data-pick]) are actions too: they file the card they're on.
  const btn = e.target.closest('[data-act], #main [data-pick]');
  if (!btn && row) return editTransaction(Number(row.dataset.tx));
  if (!btn) return;
  const act = btn.dataset.act;
  try {
    if (act === 'restart-update') await call('window_action', ['install_update']);
    else if (act === 'assign') await openAssign();
    else if (act === 'catch-up') {
      if (await confirmBox(`Catch up ${monthOnly(state.month)}?`, 'Assigns exactly what each category spent this month, so nothing ends it overspent. Good for months gone by.', 'Catch up')) {
        await call('catch_up', [state.month]); await renderBudget(); toast(`${monthOnly(state.month)} caught up`, { action: undoAction });
      }
    } else if (act === 'start-here') {
      await call('set_budget_start', [state.month]); state.boot.budget_start = state.month; await renderBudget();
      toast(`The budget now starts in ${monthLong(state.month)}`);
    } else if (act === 'toggle-hidden') { state.showHidden = !state.showHidden; await renderBudget(); }
    else if (act === 'tx-cat') {
      const cid = await pickCategory(btn);
      if (cid) {
        const r = await call('update_transaction', [Number(btn.dataset.id), { category_id: cid }]);
        toast(`Changed to ${catName(cid)}`, { action: undoAction }); await renderTransactions();
        if (r.question) { await subscriptionPrompt(r.question); await renderTransactions(); }
      }
    } else if (act === 'add-tx') await addTransaction();
    else if (state.page === 'dashboard') await dashboardAction(btn);
    else if (state.page === 'inbox') await inboxAction(btn, e);
    else if (state.page === 'accounts') await accountAction(btn);
    else if (state.page === 'subscriptions') await subscriptionAction(btn);
    else if (state.page === 'settings') await settingsAction(btn);
  } catch (err) {
    if (!(err instanceof UserFacingError)) { logError(`Action ${act}`, err); toast('Something went wrong', { error: true }); }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.setting) {
    await call('save_settings', [{ [el.dataset.setting]: el.checked }]);
    toast('Saved');
  }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-theme-set]');
  if (t) { const s = await call('save_settings', [{ theme: t.dataset.themeSet }]); applyTheme(s.theme); renderSettings(); }
  const o = e.target.closest('[data-overspending]');
  if (o) { await call('save_settings', [{ overspending: o.dataset.overspending }]); renderSettings(); }
});
document.addEventListener('keydown', e => {
  if (e.target.dataset && e.target.dataset.assign !== undefined && e.key === 'Escape') {  // puts it back, saves nothing
    e.preventDefault();
    e.target.value = e.target.defaultValue;
    e.target.blur();
    return;
  }
  if (e.target.dataset && e.target.dataset.assign !== undefined && e.key === 'Enter') {
    e.preventDefault();
    const inputs = $$('[data-assign]');
    const i = inputs.indexOf(e.target);
    e.target.blur();
    if (inputs[i + 1]) setTimeout(() => { const n = $(`[data-assign="${inputs[i + 1].dataset.assign}"]`); if (n) { n.focus(); n.select(); } }, 120);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey && !e.target.closest('input, textarea')) {
    e.preventDefault(); doUndo(); return;
  }
  inboxKeys(e);
});
const AMOUNT_BOXES = 'input[data-assign], input.money-input, #monthly-input, #move-amount, #assign-amount, ' +
  'input[data-split-amt], input[data-payment], #ed-amount, #sf-amount, input[data-ob-balance], ' +
  'input[data-balance-for], #add-amount, #rec-amount, #na-balance';
// A click into an amount box selects all of it, so what you type replaces it (and +50
// adds to it): a box you weren't in, and one Return or Tab moved you to. Another click in
// a box you've clicked into puts the cursor where you click. It's done on mouse-down,
// before WebKit places the cursor: cancelling the mouse-up didn't cover a box you were
// already in.
let clickedInto = null;
document.addEventListener('mousedown', e => {
  const el = e.target;
  if (e.button !== 0 || !el.matches || !el.matches(AMOUNT_BOXES) || el.disabled || el.readOnly) return;
  if (el === document.activeElement && el === clickedInto) return;
  e.preventDefault();
  el.focus({ preventScroll: true });
  el.select();
  clickedInto = el;
}, true);
// Keyboard focus (Tab, Return to the next Assigned box, a dialog's first box) selects too.
document.addEventListener('focusin', e => {
  const el = e.target;
  if (!el.matches || !el.matches(AMOUNT_BOXES)) return;
  if (el.matches('[data-relative]') && !isMath(el)) el.dataset.base = parseMoney(el.value) || 0;
  el.select();
});
document.addEventListener('focusout', e => { if (e.target === clickedInto) clickedInto = null; });
// Leaving a box with math in it shows the amount it comes to. (An Assigned box has
// already read it: saving it is the focusout listener above this one.)
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!el.matches || !el.matches(AMOUNT_BOXES) || !isMath(el)) return;
  const cents = amountIn(el);
  if (cents !== null && !Number.isNaN(cents)) el.value = moneyPlain(cents);
});
let dragDepth = 0;
document.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
document.addEventListener('drop', () => { dragDepth = 0; document.body.classList.remove('dragging'); });
document.addEventListener('dragover', e => e.preventDefault());

function applyTheme(theme) {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}

async function start() {
  state.boot = await call('bootstrap');
  applyTheme(state.boot.settings.theme);
  setCounts(state.boot.counts);
  state.update = state.boot.app && state.boot.app.updates;
  if (!state.boot.onboarded) return showOnboarding();
  await loadCategories();
  await navigate('dashboard');
}
if (window.pywebview && window.pywebview.api) start();
else window.addEventListener('pywebviewready', start);
</script>
