<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No network access of any kind: everything is inline and data comes from the
     pywebview bridge (window.pywebview.api), which is not an HTTP connection.
     'unsafe-eval' is required because pywebview delivers API return values with
     eval(); this page never evaluates strings itself. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; media-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>I Need A Budget</title>
<style>
:root {
  --bg: #f5f5f7; --side: #ececef; --card: #ffffff; --card-2: #fafafa; --text: #1d1d1f; --muted: #6e6e73;
  --faint: #aeaeb2; --line: rgba(0,0,0,.08); --line-strong: rgba(0,0,0,.14); --hover: rgba(0,0,0,.04);
  --accent: #007aff; --accent-soft: rgba(0,122,255,.12); --pos: #1f9d55; --pos-soft: rgba(31,157,85,.13);
  --neg: #d70015; --neg-soft: rgba(215,0,21,.10); --warn: #b25e00; --warn-soft: rgba(255,149,0,.15);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.06); --pop: 0 10px 30px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.1);
  --seg-bg: rgba(0,0,0,.06); --seg-on: #ffffff; --input: #ffffff;
  --series-1: #2a78d6; --series-2: #eb6834;  /* chart series, checked for colour blindness on --card */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --side: #232325; --card: #2c2c2e; --card-2: #323234; --text: #f5f5f7; --muted: #a1a1a6;
    --faint: #636366; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16); --hover: rgba(255,255,255,.05);
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,.2); --pos: #32d74b; --pos-soft: rgba(50,215,75,.16);
    --neg: #ff6961; --neg-soft: rgba(255,105,97,.16); --warn: #ffb340; --warn-soft: rgba(255,179,64,.16);
    --shadow: 0 0 0 .5px rgba(255,255,255,.08); --pop: 0 10px 30px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.12);
    --seg-bg: rgba(255,255,255,.08); --seg-on: #636366; --input: #1c1c1e;
    --series-1: #3987e5; --series-2: #d95926;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --side: #232325; --card: #2c2c2e; --card-2: #323234; --text: #f5f5f7; --muted: #a1a1a6;
  --faint: #636366; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16); --hover: rgba(255,255,255,.05);
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,.2); --pos: #32d74b; --pos-soft: rgba(50,215,75,.16);
  --neg: #ff6961; --neg-soft: rgba(255,105,97,.16); --warn: #ffb340; --warn-soft: rgba(255,179,64,.16);
  --shadow: 0 0 0 .5px rgba(255,255,255,.08); --pop: 0 10px 30px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.12);
  --seg-bg: rgba(255,255,255,.08); --seg-on: #636366; --input: #1c1c1e;
  --series-1: #3987e5; --series-2: #d95926;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }
.small { font-size: 12px; } .tiny { font-size: 11px; }
.right { text-align: right; } .nowrap { white-space: nowrap; }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
h2 { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
a, .link { color: var(--accent); cursor: pointer; text-decoration: none; background: none; border: 0; padding: 0; }
a:hover, .link:hover { text-decoration: underline; }

/* ── layout ─────────────────────────────────── */
.app { display: grid; grid-template-columns: 208px 1fr; height: 100%; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 16px; font-weight: 650; font-size: 14px; }
.brand svg { width: 26px; height: 26px; flex: none; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav button {
  display: flex; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 7px;
  padding: 7px 9px; text-align: left; cursor: default; font-weight: 500;
}
.side nav button svg { width: 17px; height: 17px; flex: none; opacity: .75; }
.side nav button:hover { background: var(--hover); }
.side nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.side nav button[aria-current="page"] svg { opacity: 1; }
.badge { margin-left: auto; background: var(--accent); color: #fff; border-radius: 9px; padding: 0 7px; font-size: 11px; font-weight: 600; min-width: 18px; text-align: center; }
.badge:empty { display: none; }
main { overflow-y: auto; min-width: 0; position: relative; }
.page { max-width: 1060px; margin: 0 auto; padding: 22px 26px 60px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.notice { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--text); }
.notice.info { background: var(--accent-soft); }
.notice.bad { background: var(--neg-soft); }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

/* ── controls ───────────────────────────────── */
.btn {
  border: 0; border-radius: 7px; padding: 5px 12px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--line-strong), 0 .5px 1px rgba(0,0,0,.08);
  cursor: default; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--card-2); }
.btn:disabled { opacity: .5; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: none; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--neg); }
.btn.small { padding: 2px 9px; font-size: 12px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
input[type=text], input[type=search], input[type=date], input[type=password], input:not([type]), select, textarea {
  background: var(--input); border: 0; box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: 6px; padding: 5px 8px; outline: none;
}
input:focus, select:focus, textarea:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft); }
select { padding-right: 24px; }
.seg { display: inline-flex; background: var(--seg-bg); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 12px; border-radius: 6px; cursor: default; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--seg-bg); border-radius: 10px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--pos); }
.switch input:checked + span::after { transform: translateX(14px); }
.chip {
  border: 0; border-radius: 13px; padding: 3px 11px; background: var(--seg-bg); cursor: default; font-weight: 500; font-size: 12px; white-space: nowrap;
}
.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip.first { background: var(--accent); color: #fff; }
.chip.first:hover { filter: brightness(1.06); }
.chip kbd { font: inherit; opacity: .6; margin-right: 4px; font-size: 11px; }
.pill { display: inline-block; border-radius: 10px; padding: 1px 9px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.pos { background: var(--pos-soft); color: var(--pos); }
.pill.neg { background: var(--neg-soft); color: var(--neg); }
.pill.zero { background: var(--seg-bg); color: var(--muted); }
.tag { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; background: var(--seg-bg); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--neg-soft); color: var(--neg); }
.tag.good { background: var(--pos-soft); color: var(--pos); }
.tag.info { background: var(--accent-soft); color: var(--accent); }

/* ── tables ─────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable:hover td { background: var(--hover); }
th.r, td.r { text-align: right; }

/* ── budget ─────────────────────────────────── */
.months { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.months::-webkit-scrollbar { display: none; }
.months button { border: 0; background: transparent; border-radius: 6px; padding: 4px 9px; cursor: default; white-space: nowrap; font-weight: 500; color: var(--muted); }
.months button:hover { background: var(--hover); }
.months button.current { color: var(--text); }
.months button[aria-current="true"] { background: var(--accent); color: #fff; }
.months .year { font-size: 10px; color: var(--faint); padding: 0 2px; font-weight: 600; }
.hero { display: flex; flex-wrap: wrap; gap: 18px 34px; align-items: center; }
.hero > :first-child { min-width: 230px; }
.hero .figures { flex: 1; min-width: 260px; }
.hero .check { margin-top: 8px; }
.breakdown span:nth-child(even) { white-space: nowrap; }
.rta-label { color: var(--muted); font-weight: 500; }
.rta { font-size: 38px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.breakdown { display: grid; grid-template-columns: auto auto; gap: 2px 14px; justify-content: start; font-size: 12px; }
.breakdown span:nth-child(odd) { text-align: right; font-variant-numeric: tabular-nums; }
.hero-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.btable td, .btable th { padding: 6px 10px; }
.btable .group td { background: var(--card-2); font-weight: 600; cursor: default; }
.btable .group .caret { display: inline-block; width: 12px; color: var(--muted); transition: transform .12s; }
.btable .group.collapsed .caret { transform: rotate(-90deg); }
.btable .cat td:first-child { padding-left: 28px; }
.btable .cat .name { cursor: pointer; }
.btable .cat .name:hover { color: var(--accent); }
.btable .cat.hidden-cat { opacity: .5; }
.btable col.c-num { width: 132px; }
/* Tools: ⋮⋮ in the card's left margin; +, ✎ and ✕ right of the name. Shown at once on the
   row the pointer is on, fading out over 0.5 s when it leaves (the maintainer's design;
   a 60 px reach around the pointer was too busy). The margin is part of the row, so the
   pointer can reach ⋮⋮ without leaving it. */
.budget-card { padding: 6px 8px 6px 28px; }
.btable tr > td:first-child { position: relative; }
.btable .gutter { position: absolute; left: -24px; top: 0; width: 24px; height: 100%; display: flex; align-items: center; }
.btable .tool { opacity: 0; transition: opacity .5s ease; pointer-events: none; }
.btable tr:hover .tool, .btable tr:focus-within .tool { opacity: 1; transition: none; pointer-events: auto; }
.btable .drag-handle { cursor: grab; color: var(--muted); font-size: 14px; font-weight: 400; letter-spacing: -3px; padding: 2px 4px 2px 2px; user-select: none; -webkit-user-select: none; touch-action: none; }
.btable .drag-handle:hover { color: var(--text); }
.btable .plus { border: 0; background: transparent; color: var(--muted); width: 20px; height: 20px; border-radius: 5px; padding: 0; font-size: 16px; line-height: 1; font-weight: 400; cursor: default; }
.btable .plus:hover { background: var(--hover); color: var(--accent); }
.btable .row-tools { display: inline-flex; align-items: center; gap: 1px; margin-left: 6px; vertical-align: -3px; }
.btable .row-tools .icon-btn { padding: 2px 5px; font-weight: 400; }
.btable .row-tools svg { display: block; }
.btable td:has(.inline-name) .row-tools { display: none; }
.btable .inline-name { width: min(300px, 100%); font-weight: inherit; padding: 3px 7px; }
.btable tbody.grp:not(:last-child) tr:last-child td { border-bottom: 1px solid var(--line); }
/* While a group is dragged, every group's categories fold away, and back, in 0.1 s. */
.btable tr.cat > td { transition: padding .1s ease, border-color .1s ease; }
.btable .cell { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .1s ease, opacity .1s ease; }
.btable .cell > div { min-height: 0; }
.btable.folded .cell > div, .btable.unfolding .cell > div { overflow: hidden; }
.btable.folded tr.cat > td { padding-top: 0; padding-bottom: 0; border-bottom: 0 !important; }  /* not even a 1px line each */
.btable.folded .cell { grid-template-rows: 0fr; opacity: 0; }
.btable.no-anim *, .cat-editor.no-anim * { transition: none !important; }
body.moving-rows, body.moving-rows * { -webkit-user-select: none !important; user-select: none !important; }
.btable.is-dragging, .btable.is-dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.btable.is-dragging .tool { opacity: 0 !important; }
.btable .dragged > tr.group > td, .btable tr.dragged > td { background: var(--accent-soft) !important; }
.btable .just-moved > tr > td, .btable tr.just-moved > td { animation: just-moved 1.6s ease; }
@media (prefers-reduced-motion: reduce) { .btable .cell, .btable tr.cat > td { transition: none; } }
.btable td.assign-cell { white-space: nowrap; }
.btable col.c-assign { width: 170px; }
.copy-arrow { border: 0; background: transparent; color: var(--faint); border-radius: 5px; width: 22px; padding: 1px 0; cursor: default; }
.copy-gap { display: inline-block; width: 22px; }  /* where ← goes, so the boxes line up */
.btable tr:hover .copy-arrow { color: var(--muted); }
.copy-arrow:hover { background: var(--hover); color: var(--accent) !important; }
.money-input { width: 108px; text-align: right; background: transparent !important; box-shadow: none !important; border-radius: 5px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
.money-input:hover { box-shadow: inset 0 0 0 1px var(--line-strong) !important; }
.money-input:focus { background: var(--input) !important; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft) !important; }
.monthly { color: var(--muted); font-size: 12px; cursor: pointer; }
.monthly:hover { color: var(--accent); }
.usual { color: var(--warn); font-size: 11px; }
.sub-note { font-size: 11px; color: var(--muted); }

/* ── dashboard ──────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 1080px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { border: 0; text-align: left; cursor: default; display: flex; flex-direction: column; gap: 3px; }
.tile:hover { box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow); }
.tile .label { color: var(--muted); font-weight: 500; font-size: 12px; }
.tile .big { font-size: 24px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tile .check { margin-top: 0; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 10px; margin-bottom: 14px; }
.chart-card { padding: 12px 16px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.line { width: 14px; height: 2px; border-radius: 1px; vertical-align: 3px; background: var(--text); }
.chart { position: relative; height: 190px; margin-top: 6px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .zero { stroke: var(--line-strong); }
.chart text { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.s1 { fill: var(--series-1); background: var(--series-1); } .s2 { fill: var(--series-2); background: var(--series-2); }
.chart .net { fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--text); stroke: var(--card); stroke-width: 2; }
.chart .faded { opacity: .45; }
.chart .band { fill: transparent; }
.chart .band.on { fill: var(--hover); }
.chart .hit { fill: transparent; outline: none; cursor: default; }
.chart-tip { position: fixed; z-index: 60; pointer-events: none; background: var(--card); box-shadow: var(--pop); border-radius: 8px; padding: 7px 10px; font-size: 12px; min-width: 160px; }
.chart-tip .tip-row { display: flex; align-items: center; gap: 7px; padding: 1px 0; }
.chart-tip .tip-row b { font-variant-numeric: tabular-nums; margin-left: auto; }
.chart-tip .tip-row i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
.chart-tip .tip-row i.ink { background: var(--text); }
.spend-wrap { overflow-x: auto; margin: 0 -8px; }
.spend { width: auto; min-width: 100%; }
.spend th, .spend td { white-space: nowrap; padding: 5px 8px; }
.spend th:first-child, .spend td:first-child { position: sticky; left: 0; z-index: 1; background: var(--card); min-width: 170px; }
.spend .group td, .spend .group td:first-child { background: var(--card-2); font-weight: 600; }
.spend .total td { font-weight: 600; }
.spend .cat td:first-child { padding-left: 28px; }
.spend .cat.hidden-cat { opacity: .5; }
.spend .glink { border: 0; background: none; padding: 0; font-weight: 600; cursor: default; }
.spend .caret { display: inline-block; width: 12px; color: var(--muted); transition: transform .12s; }
.spend .group.collapsed .caret { transform: rotate(-90deg); }
.spend .fig { border: 0; background: none; padding: 1px 4px; margin: -1px -4px; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums; }
.spend .fig:hover { color: var(--accent); background: var(--hover); }
.spend .above .fig { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.spend .so-far { color: var(--muted); }
.spend .partial { color: var(--faint); }

/* ── inbox ──────────────────────────────────── */
.items { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--card); border-radius: 11px; box-shadow: var(--shadow); padding: 11px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; outline: none; }
.item.selected { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.item .who { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item .meta { color: var(--muted); font-size: 12px; }
.item .raw { color: var(--faint); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
.item .why { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
.item .amount { font-size: 16px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.item .chips { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item .chips .sep { width: 1px; height: 18px; background: var(--line-strong); margin: 0 4px; }
.item.group-card { border-left: 3px solid var(--accent); }
.item .sublist { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 6px; }
.item .sublist div { display: flex; gap: 10px; font-size: 12px; padding: 2px 0; }
.item.leaving { opacity: 0; transform: translateX(20px); transition: all .18s; }
.question { grid-column: 1 / -1; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filed-list td { font-size: 12px; }

/* ── panels, dialogs, popovers ──────────────── */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, calc(100vw - 80px)); background: var(--bg); box-shadow: var(--pop); z-index: 21; overflow-y: auto; padding: 20px 22px 40px; }
.spent-link { cursor: pointer; border-radius: 4px; }
.spent-link:hover { text-decoration: underline; }

<dialog id="dlg"><form method="dialog"><div class="dlg-head"><div class="dlg-title"></div><button type="button" class="icon-btn dlg-x" title="Close without saving (Esc)" aria-label="Close">✕</button></div><div class="dlg-body"></div><div class="dlg-error"></div><div class="dlg-actions"></div></form></dialog>

<script>
'use strict';

// ── helpers ─────────────────────────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (c, opts = {}) => {
  if (c === null || c === undefined || Number.isNaN(c)) return '—';
  const s = (Math.abs(c) / 100).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sign = c < 0 ? '−' : (opts.sign && c > 0 ? '+' : '');
  return sign + (opts.bare ? '' : '$') + s;
};
const moneyPlain = c => c ? (c / 100).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '0.00';
// For a box you type an amount into: nothing yet is an empty box (its placeholder shows
// 0.00), so there's no 0.00 to type into the middle of.
const moneyOrBlank = c => c ? moneyPlain(c) : '';
// What's typed in an amount box, in cents: an amount, or a sum of them (120+35.50, 3*45,
// 300/4, brackets too). Given `base`, what the box held before you typed (an Assigned or
// Budgeted amount), one that starts with + − * or / works on that: +50 adds 50 to it.
// Anywhere else a leading minus is a negative amount. null for an empty box, NaN for
// anything that isn't an amount. No eval(): the page's CSP doesn't allow it anyway.
function parseMoney(text, base) {
  let t = String(text ?? '').replace(/[$,\s]/g, '').replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
  if (t === '') return null;
  if (base !== undefined && /^[-+*/]/.test(t)) t = `(${(base || 0) / 100})${t}`;
  let i = 0;
  const sum = () => {
    let v = product();
    while (t[i] === '+' || t[i] === '-') { const op = t[i++], w = product(); v = op === '+' ? v + w : v - w; }
    return v;
  };
  const product = () => {
    let v = unary();
    while (t[i] === '*' || t[i] === '/') { const op = t[i++], w = unary(); v = op === '*' ? v * w : v / w; }
    return v;
  };
  const unary = () => {
    if (t[i] === '-') { i++; return -unary(); }
    if (t[i] === '+') { i++; return unary(); }
    if (t[i] === '(') { i++; const v = sum(); return t[i++] === ')' ? v : NaN; }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(t.slice(i));
    if (!m) return NaN;
    i += m[0].length;
    return parseFloat(m[0]);
  };
  const v = sum();
  if (i !== t.length || !Number.isFinite(v)) return NaN;
  const cents = Math.round(Number((Math.abs(v) * 100).toFixed(6)));  // 1.005 is 101¢, not 100
  return v < 0 && cents ? -cents : cents;
}
// What an amount box holds, in cents. A box marked data-relative (Assigned, Budgeted,
// Assign money…'s Assign column) works +50 out from the amount it had when you clicked
// into it (data-base), or else the amount it was drawn with: a redraw puts back what you'd
// typed into a new box.
const amountIn = el => parseMoney(el.value, !el.matches('[data-relative]') ? undefined
  : el.dataset.base !== undefined ? Number(el.dataset.base) : parseMoney(el.defaultValue) || 0);
// Whether what's in a box is math (120+35.50, or +50 in a relative box) rather than an amount.
const isMath = el => /[*/()×÷]|.[-+−]/.test(el.value.replace(/[$,\s]/g, ''))
  || (el.matches('[data-relative]') && /^\s*[-+−*/×÷]/.test(el.value));
const monthLong = m => new Date(m + '-15T12:00').toLocaleDateString('en-CA', { month: 'long', year: 'numeric' });
const monthShort = m => new Date(m + '-15T12:00').toLocaleDateString('en-CA', { month: 'short' });
const monthOnly = m => new Date(m + '-15T12:00').toLocaleDateString('en-CA', { month: 'long' });
const day = d => d ? new Date(d + 'T12:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }) : '';
const dayYear = d => d ? new Date(d + 'T12:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const addMonths = (m, n) => { let [y, mo] = m.split('-').map(Number); const i = y * 12 + mo - 1 + n; return `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, '0')}`; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

class UserFacingError extends Error {}
function logError(where, e) {
  console.error(where, e);
  try { window.pywebview.api.log_error(`${where}: ${(e && e.stack) || e}`); } catch (_) {}
}
async function call(name, args) {
  const api = window.pywebview && window.pywebview.api;
  if (!api) throw new Error('The app bridge is not ready');
  const r = await api.call(name, args === undefined ? [] : args);
  if (!r || !r.ok) {
    const msg = (r && r.error) || 'Something went wrong';
    toast(msg, { error: true });
    throw new UserFacingError(msg);
  }
  if (r.result && r.result.counts) setCounts(r.result.counts);
  return r.result;
}
// Like call(), but returns {ok, result, error} instead of showing errors as a toast.
async function tryCall(name, args) {
  const r = await window.pywebview.api.call(name, args === undefined ? [] : args);
  if (r && r.ok && r.result && r.result.counts) setCounts(r.result.counts);
  return r || { ok: false, error: 'Something went wrong' };
}
window.addEventListener('error', e => { try { window.pywebview.api.log_error(`${e.message} at ${e.filename}:${e.lineno}`); } catch (_) {} });
window.addEventListener('unhandledrejection', e => {
  if (e.reason instanceof UserFacingError) return;
  try { window.pywebview.api.log_error(String(e.reason && e.reason.stack || e.reason)); } catch (_) {}
});

let toastTimer;
function toast(msg, opts = {}) {
  const el = $('#toast');
  // Inside an open pop-up, or it's under it: pop-ups live in the browser's top layer.
  const dlg = $('#dlg');
  const host = dlg.open ? dlg : document.body;
  if (el.parentElement !== host) host.appendChild(el);
  el.querySelector('span').textContent = msg;
  const btn = el.querySelector('button');
  btn.textContent = opts.action ? opts.action.label : '';
  btn.onclick = opts.action ? () => { el.classList.remove('show'); opts.action.run(); } : null;
  el.classList.toggle('error', !!opts.error);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), opts.action ? 7000 : (opts.error ? 6000 : 3200));
}
const undoAction = { label: 'Undo', run: () => doUndo() };

async function doUndo() {
  try {
    const r = await call('undo');
    toast(`Undone: ${r.undone}`);
    await refresh();
  } catch (_) {}
}

// Dialog: resolves with the clicked action's value (or null). `check(dlg)` on an action
// returns an error message to keep it open.
function dialog({ title, body, actions, wide = false, onOpen }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    d.classList.toggle('wide', wide);
    d.querySelector('.dlg-title').textContent = title;
    d.querySelector('.dlg-body').innerHTML = body;
    d.querySelector('.dlg-error').textContent = '';
    const bar = d.querySelector('.dlg-actions');
    bar.innerHTML = '';
    let done = false;
    const finish = v => {
      if (done) return;
      done = true;
      const t = $('#toast');
      if (d.contains(t)) document.body.appendChild(t);  // a message still showing outlives the pop-up
      d.close();
      resolve(v);
    };
    (actions || [{ label: 'OK', value: true, primary: true }]).forEach(a => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '');
      b.textContent = a.label;
      b.onclick = async () => {
        if (a.check) {
          const err = await a.check(d);
          if (err) { d.querySelector('.dlg-error').textContent = err; return; }
        }
        finish(a.value);
      };
      if (a.left) { b.style.marginRight = 'auto'; }
      bar.appendChild(b);
    });
    // Only a close of this dialog: closing the previous one fires its close event after
    // this one has opened, and that mustn't close this one.
    d.onclose = () => { if (!d.open) finish(null); };
    d.querySelector('.dlg-x').onclick = () => finish(null);  // close without doing anything, like Esc
    // A button in the body with data-dlg-value closes it with that value, like an action.
    d.querySelector('.dlg-body').onclick = e => { const b = e.target.closest('[data-dlg-value]'); if (b) finish(b.dataset.dlgValue); };
    d.oncancel = e => { e.preventDefault(); finish(null); };
    d.querySelector('form').onsubmit = e => {
      e.preventDefault();
      const primary = bar.querySelector('.btn.primary');
      if (primary) primary.click();
    };
    d.showModal();
    if (onOpen) onOpen(d);
    const first = d.querySelector('.dlg-body input, .dlg-body select, .dlg-body textarea');
    if (first) { first.focus(); if (first.select) first.select(); }
  });
}
const confirmBox = (title, text, label = 'OK', danger = false) => dialog({
  title, body: `<p>${esc(text)}</p>`,
  actions: [{ label: 'Cancel', value: false }, { label, value: true, primary: !danger, danger }],
});

// Category picker popover. Resolves with a category id, or null.
let pickerCleanup = null;
function pickCategory(anchor, { income = true, title = '' } = {}) {
  if (pickerCleanup) pickerCleanup();
  return new Promise(resolve => {
    const pop = document.createElement('div');
    pop.className = 'popover';
    pop.innerHTML = `<input type="search" placeholder="${esc(title || 'Category')}"><div class="list"></div>`;
    // An open dialog sits in the browser's top layer, above everything else on the page,
    // so the list has to live inside it to show on top.
    const openDialog = $('#dlg').open ? $('#dlg') : null;
    (openDialog || document.body).appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const top = Math.min(r.bottom + 4, window.innerHeight - 370);
    pop.style.top = Math.max(8, top) + 'px';
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 280)) + 'px';
    const input = pop.querySelector('input'), list = pop.querySelector('.list');
    let active = 0, options = [];
    const groups = state.categories.filter(g => g.role !== 'debt' || g.categories.some(c => !c.debt_account_id));
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      options = [];
      let html = '';
      for (const g of groups) {
        if (g.role === 'income' && !income) continue;
        const cats = g.categories.filter(c => !c.hidden && !c.debt_account_id && (!q || c.name.toLowerCase().includes(q)));
        if (!cats.length) continue;
        html += `<div class="g">${esc(g.name)}</div>`;
        for (const c of cats) { html += `<div class="o" data-id="${c.id}">${esc(c.name)}</div>`; options.push(c.id); }
      }
      list.innerHTML = html || '<div class="o faint">No category matches</div>';
      active = Math.min(active, Math.max(0, options.length - 1));
      mark();
    };
    const mark = () => $$('.o[data-id]', list).forEach((el, i) => {
      el.classList.toggle('active', i === active);
      if (i === active) el.scrollIntoView({ block: 'nearest' });
    });
    const close = v => { cleanup(); resolve(v); };
    const outside = e => { if (!pop.contains(e.target)) close(null); };
    const cleanup = () => { pop.remove(); document.removeEventListener('mousedown', outside, true); pickerCleanup = null; };
    pickerCleanup = () => close(null);
    input.addEventListener('input', () => { active = 0; draw(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { active = Math.min(active + 1, options.length - 1); mark(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); mark(); e.preventDefault(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (options.length) close(options[active]); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(null); }
    });
    list.addEventListener('mousedown', e => { const o = e.target.closest('.o[data-id]'); if (o) { e.preventDefault(); close(Number(o.dataset.id)); } });
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    draw();
    input.focus();
  });
}

// ── state ───────────────────────────────────────────────
const state = {
  page: 'budget', month: null, boot: null, categories: [], accounts: [], counts: {},
  inboxSel: 0, txFilters: { month: null }, expanded: new Set(), update: null, inboxFind: { text: '', payee: null },
  dash: null, dashOpen: new Set(), showHidden: false, dragging: false,
};

function setCounts(c) {
  if (!c) return;
  state.counts = c;
  $('#inbox-badge').textContent = c.inbox ? c.inbox : '';
  $('#accounts-badge').textContent = c.accounts_without_balance ? '!' : '';
}
async function loadCategories() { state.categories = await call('categories'); }
async function loadAccounts() { state.accounts = await call('accounts'); }
const catName = id => { for (const g of state.categories) for (const c of g.categories) if (c.id === id) return c.name; return null; };
const incomeIds = () => state.categories.filter(g => g.role === 'income').flatMap(g => g.categories.map(c => c.id));

function navigate(page, opts = {}) {
  if (page === 'dashboard' && state.page !== 'dashboard') state.dashOpen = new Set();  // its groups start closed
  if (page === 'budget' && state.page !== 'budget') state.showHidden = false;
  state.page = page;
  if (opts.month) state.month = opts.month;
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.nav === page ? 'page' : 'false'));
  $('#main').scrollTop = 0;
  return refresh();
}

async function refresh() {
  const pages = { dashboard: renderDashboard, budget: renderBudget, inbox: renderInbox, transactions: renderTransactions,
                  accounts: renderAccounts, subscriptions: renderSubscriptions, settings: renderSettings };
  try {
    await (pages[state.page] || renderBudget)();
  } catch (e) {
    if (!(e instanceof UserFacingError)) { logError(`Showing ${state.page}`, e); toast('Something went wrong showing this page', { error: true }); }
  }
}

function frame(html) {
  const bar = state.update && state.update.status === 'ready'
    ? `<div class="update-bar"><span>Version ${esc(state.update.version)} is ready. It's installed when you quit.</span><span class="spacer"></span><button class="btn small" data-act="restart-update">Restart now</button></div>` : '';
  $('#main').innerHTML = bar + `<div class="page">${html}</div>`;
}

// ── budget ──────────────────────────────────────────────
async function renderBudget() {
  if (!state.month) state.month = state.boot.current_month;
  const [view] = await Promise.all([call('month', [state.month]), state.categories.length ? null : loadCategories()]);
  state.view = view;

    monthsHtml += `<button data-month="${m}" aria-current="${m === view.month}" class="${m === view.current_month ? 'current' : ''}">${monthShort(m)}</button>`;
  }

  if (view.missing_balances.length) notices.push(`<div class="notice">Tell the app the balance of ${esc(view.missing_balances.join(' and '))} so it knows how much money you have. <span class="spacer"></span><button class="btn small" data-nav-to="accounts">Set balance</button></div>`);

  if (view.future_short.length) notices.push(`<div class="notice bad">You've assigned more than you have in ${view.future_short.map(monthOnly).join(', ')}.</div>`);

  let hero = '';
  if (s) {
    const rtaClass = s.ready_to_assign < 0 ? 'neg' : (s.ready_to_assign > 0 ? 'pos' : '');
    const lines = [
      [money(s.carried_rta), view.month === view.budget_start ? 'Cash when the budget started' : `Left over from ${monthOnly(prev)}`],

    ];

    if (view.overspending === 'this_month' && s.overspent) lines.push([money(-s.overspent), `Overspent in ${monthOnly(view.month)}`]);
    if (s.overspent_last_month) lines.push([money(-s.overspent_last_month), `Overspent in ${monthOnly(prev)}`]);
    lines.push([money(-s.assigned), `Assigned in ${monthOnly(view.month)}`]);
    hero = `<div class="card hero">
      <div><div class="rta-label">Ready to assign</div><div class="rta num ${rtaClass}">${money(s.ready_to_assign)}</div>
        ${s.new_debt ? `<div class="small warn">${money(s.new_debt)} of card spending wasn't covered by a category: it's new debt.</div>` : ''}</div>
      <div class="figures"><div class="breakdown">${lines.map(([a, b]) => `<span>${a}</span><span class="muted">${esc(b)}</span>`).join('')}</div>
        ${cashCheck(s, view)}</div>
      <div class="hero-actions">
        <button class="btn primary" data-act="assign">Assign money…</button>
        ${view.is_past ? `<button class="btn" data-act="catch-up" title="Assign exactly what was spent, so nothing ends the month overspent">Catch up this month</button>` : ''}
      </div></div>`;
  }

  // Each group is its own <tbody>, so dragging one takes its categories along. The tools
  // (⋮⋮ in the margin; +, ✎ and an empty group's ✕ right of the name) show on the row the
  // pointer is on. Every group has ⋮⋮ and + (a group above it), Debt Payments too; ✎,
  // ✕ and the categories' tools are for ordinary groups only.
  const bodies = [];
  const hiddenCount = view.groups.reduce((n, g) => n + g.categories.filter(c => c.hidden).length, 0);
  for (const g of view.groups) {
    const collapsed = !!g.collapsed, normal = g.role === 'normal';
    const rows = [];
    rows.push(`<tr class="group ${collapsed ? 'collapsed' : ''}" data-group="${g.id}">
      <td>${g.role !== 'income' ? `<span class="gutter"><span class="drag-handle tool" data-drag-group="${g.id}" title="Drag to move">⋮⋮</span></span>` : ''}<span class="caret">▾</span> <span class="gname">${esc(g.name)}</span><span class="row-tools"><button class="plus tool" data-group-plus="${g.id}" title="Add a group above" aria-label="Add a group above">+</button>${normal ? `<button class="icon-btn tool" data-group-pencil="${g.id}" title="Rename" aria-label="Rename">${PENCIL}</button>${g.categories.length ? '' : `<button class="icon-btn danger tool" data-group-x="${g.id}" title="Delete group" aria-label="Delete group">✕</button>`}` : ''}</span></td><td></td>
      <td class="r num">${view.before_start ? '' : money(g.assigned)}</td><td class="r num">${g.activity ? `<span class="spent-link" data-spent-group="${g.id}" title="What makes up this">${money(g.activity)}</span>` : money(g.activity)}</td>
      <td class="r num">${view.before_start ? '' : money(g.available)}</td></tr>`);
    for (const c of collapsed ? [] : g.categories) {
      if (c.hidden && !state.showHidden && !c.assigned && !c.activity && !c.available) continue;
      const avail = c.available;
      const pillClass = avail === null ? 'zero' : (avail < 0 ? 'neg' : (avail > 0 ? 'pos' : 'zero'));
      let monthly;
      if (c.debt_account_id) {
        monthly = c.owing ? `<span class="sub-note">owe ${money(c.owing)}${c.not_covered ? ` · <span class="warn">${money(c.not_covered)} not set aside</span>` : ''}</span>` : '';
      } else if (c.monthly_budget !== null) {
        monthly = `<span class="monthly num" data-cat="${c.id}">${money(c.monthly_budget)}</span>`;
      } else if (c.usual) {
        monthly = `<span class="usual" data-cat="${c.id}" style="cursor:pointer" title="What it actually spent on average in recent whole months">usually ~${money(c.usual)}</span>`;
      } else {
        monthly = `<span class="monthly faint" data-cat="${c.id}">—</span>`;
      }
      const overNote = c.overspent_credit ? ` title="${esc(money(c.overspent_credit))} of this was on a card without money in the category: it became debt"` :
        (c.overspent_cash ? ` title="${esc(money(c.overspent_cash))} overspent: ${OVERSPENT_NOTE[view.overspending]}"` : '');
      // Each cell's content is wrapped so the row can fold away while a group is dragged.
      const cell = html => `<div class="cell"><div>${html}</div></div>`;
      rows.push(`<tr class="cat ${c.hidden ? 'hidden-cat' : ''}" data-cat-row="${c.id}">
        <td>${normal ? `<span class="gutter"><span class="drag-handle tool" data-drag-cat="${c.id}" title="Drag to move">⋮⋮</span></span>` : ''}${cell(`<span class="name" data-cat="${c.id}">${esc(c.name)}</span>${normal ? `<span class="row-tools"><button class="plus tool" data-cat-plus="${c.id}" title="Add a category above" aria-label="Add a category above">+</button><button class="icon-btn tool" data-cat-pencil="${c.id}" title="Rename" aria-label="Rename">${PENCIL}</button></span>` : ''}`)}</td>
        <td class="r">${cell(monthly)}</td>
        <td class="r assign-cell">${cell(view.before_start ? '' : assignBox(c))}</td>
        <td class="r num ${c.activity < 0 ? '' : (c.activity > 0 ? 'pos' : 'faint')}"${c.debt_account_id ? ' title="Set aside for card spending this month, less what was paid to the card"' : ''}>${cell(c.activity ? `<span class="spent-link" data-spent="${c.id}" title="What makes up this">${money(c.activity)}</span>` : money(c.activity))}</td>
        <td class="r">${cell(view.before_start ? '' : `<span class="pill ${pillClass}"${overNote}>${money(avail ?? 0)}</span>`)}</td></tr>`);
    }
    bodies.push(`<tbody class="grp" data-group="${g.id}" data-role="${g.role}">${rows.join('')}</tbody>`);
  }

  // Redrawing (after every save) keeps your place: how far down you are, and the Assigned
  // box you'd moved to, with anything already typed in it.
  const main = $('#main'), scrolled = main.scrollTop;
  const active = document.activeElement;
  const keep = active && active.matches('[data-assign]') ? { id: active.dataset.assign, value: active.value,
    typed: active.value !== active.defaultValue, start: active.selectionStart, end: active.selectionEnd } : null;
  redrawing = true;  // replacing the box you're in isn't leaving it: don't save it yet
  try { frame(`
    <div class="page-head"><h1>${monthLong(view.month)}</h1><span class="spacer"></span>
      <button class="btn small" data-month="${addMonths(view.month, -1)}">‹</button>
      <button class="btn small" data-month="${view.current_month}">Today</button>
      <button class="btn small" data-month="${addMonths(view.month, 1)}">›</button></div>
    <div class="months" id="months">${monthsHtml}</div>
    <div class="stack" style="margin-top:12px">
      ${notices.join('')}
      ${hero}
      <div class="card budget-card">
        <table class="btable"><colgroup><col><col class="c-num"><col class="c-assign"><col class="c-num"><col class="c-num"></colgroup>
          <thead><tr><th>Category</th><th class="r">Budgeted</th><th class="r">Assigned</th><th class="r">Spent</th><th class="r">Available</th></tr></thead>
          ${bodies.join('')}</table>
      </div>
      ${hiddenCount ? `<div class="small" style="margin-top:-6px"><button class="link" data-act="toggle-hidden">${state.showHidden ? 'Hide hidden categories' : `Show hidden (${hiddenCount})`}</button></div>` : ''}
      ${view.groups.length ? `<p class="kbd-help">Click a category or what it spent to see this month's transactions and what it spent in past months. Type in Assigned and press Return (+50 adds to what's there, −20 takes away); Tab moves to the next one.</p>` : ''}
    </div>`); } finally { redrawing = false; }
  main.scrollTop = scrolled;
  if (keep) {
    const el = $(`[data-assign="${keep.id}"]`);
    if (el) { if (keep.typed) el.value = keep.value; el.focus({ preventScroll: true }); el.setSelectionRange(keep.start, keep.end); }
  }
  // Centre the month in its strip, scrolling only the strip (scrollIntoView would also
  // scroll the page back up to it).
  const strip = $('#months'), cur = $('#months button[aria-current="true"]');
  if (cur) strip.scrollLeft += cur.getBoundingClientRect().left - strip.getBoundingClientRect().left
    - (strip.clientWidth - cur.offsetWidth) / 2;
}

// ── categories on the Budget page ───────────────────────
// Added, renamed, moved and deleted on the page itself (there's no Edit categories…).
const PENCIL = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.2 2.3l2.5 2.5-7.9 7.9-3.2.7.7-3.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';

document.addEventListener('pointerdown', e => {
  if (e.target.closest('.btable .drag-handle')) beginDrag(e, { root: () => $('.btable'), redraw: renderBudget });
});

// A name typed in place: Return or clicking away saves it, Escape or an empty box
// cancels. `save` resolves false when the name was refused: after Return you're still in
// the box to fix it; after clicking away it's cancelled.
function nameInPlace(input, { save, cancel }) {
  let busy = false;
  const finish = async how => {
    if (busy) return;
    busy = true;
    const name = input.value.replace(/\s+/g, ' ').trim();
    if (how === 'cancel' || !name) return cancel();
    if (await save(name) !== false) return;
    if (how === 'enter' && input.isConnected) { busy = false; input.focus(); } else cancel();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish('enter'); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish('cancel'); }
  });
  input.addEventListener('blur', () => finish('blur'));
  input.focus();
}
const takenGroup = (name, except) => {
  const same = state.categories.find(g => g.id !== except && sameName(g.name, name));
  if (same) toast(`There's already a group called ${same.name}.`, { error: true });
  return !!same;
};

// + on a group: a new group above it, named in place, starting with a "New Spending
// Category" whose name you're then typing (add_group).
function newGroupAbove(gid) {
  const open = $('#main .inline-name');
  if (open) return open.focus();
  const tb = document.createElement('tbody');
  tb.className = 'new-grp';
  tb.innerHTML = '<tr class="group"><td colspan="5"><input class="inline-name" placeholder="Group name" aria-label="Group name"></td></tr>';
  $(`.btable .grp[data-group="${gid}"]`).before(tb);
  nameInPlace(tb.querySelector('input'), {
    cancel: () => tb.remove(),
    save: async name => {
      if (takenGroup(name)) return false;
      let id;
      try { id = await call('add_group', [name, gid, true]); } catch (_) { return false; }
      await loadCategories();
      await renderBudget();
      const first = (state.categories.find(g => g.id === id) || { categories: [] }).categories[0];
      if (first) renameCategoryInPlace(first.id);
    },
  });
}

// + on a category: a new category above it, named in place. A hidden category's name
// offers that one back instead (show_category).
function newCategoryAbove(cid) {
  const open = $('#main .inline-name');
  if (open) return open.focus();
  const row = $(`.btable [data-cat-row="${cid}"]`);
  const gid = Number(row.closest('.grp').dataset.group);
  const tr = document.createElement('tr');
  tr.className = 'cat new-cat';
  tr.innerHTML = '<td><input class="inline-name" placeholder="Category name" aria-label="Category name"></td><td colspan="4"></td>';
  row.before(tr);
  nameInPlace(tr.querySelector('input'), {
    cancel: () => tr.remove(),
    save: async name => {
      const same = allCategories().find(c => sameName(c.name, name));
      if (same && (!same.hidden || same.debt_account_id)) { toast(`There's already a ${same.name} in ${same.group.name}.`, { error: true }); return false; }
      try {
        if (same) {
          if (!await confirmBox('Show it again?', `${same.name} is hidden${same.group.id === gid ? '' : ` in ${same.group.name}`}. Show it again?`, 'Show it again')) return false;
          await call('show_category', [same.id, gid]);
        } else await call('add_category', [gid, name, cid]);
      } catch (_) { return false; }
      await loadCategories();
      await renderBudget();
      if (same) toast(`${same.name} is back`, { action: undoAction });
    },
  });
}

// ✎ on a category, and a new group's first category: its name, renamed in place with
// the name selected.
function renameCategoryInPlace(cid) {
  const span = $(`.btable [data-cat-row="${cid}"] .name`);
  if (!span || $('#main .inline-name')) return;
  const old = span.textContent;
  const input = document.createElement('input');
  input.className = 'inline-name';
  input.value = old;
  input.setAttribute('aria-label', 'Category name');
  span.replaceWith(input);
  nameInPlace(input, {
    cancel: () => input.replaceWith(span),
    save: async name => {
      if (name === old) return input.replaceWith(span);
      const same = allCategories().find(c => c.id !== cid && sameName(c.name, name));
      if (same) { toast(`There's already a ${same.name} in ${same.group.name}.`, { error: true }); return false; }
      try { await call('rename_category', [cid, name]); } catch (_) { return false; }
      await loadCategories();
      await renderBudget();
    },
  });
  input.select();
}

// ✎ on a group: its name, renamed in place.
function renameGroupInPlace(gid) {
  const span = $(`.btable .grp[data-group="${gid}"] .gname`);
  if (!span || $('#main .inline-name')) return;
  const old = span.textContent;
  const input = document.createElement('input');
  input.className = 'inline-name';
  input.value = old;
  input.setAttribute('aria-label', 'Group name');
  span.replaceWith(input);
  nameInPlace(input, {
    cancel: () => input.replaceWith(span),
    save: async name => {
      if (name === old) return input.replaceWith(span);
      if (takenGroup(name, gid)) return false;
      try { await call('rename_group', [gid, name]); } catch (_) { return false; }
      await loadCategories();
      await renderBudget();
    },
  });
  input.select();
}

// ✕ on an empty group (only an empty one has it).
async function deleteGroupAsked(gid) {
  const g = state.categories.find(x => x.id === gid);
  if (!await confirmBox('Delete group', `Delete the group ${g ? g.name : ''}?`, 'Delete', true)) return;
  await call('delete_group', [gid]);
  await loadCategories();
  await renderBudget();
  toast('Group deleted', { action: undoAction });
}

// The Overspending setting (budget.py): what happens to a category's overspending.
const OVERSPENDING = {
  this_month: ['This month', 'Comes out of Ready to assign straight away, so it\'s always money you have.'],
  next_month: ['Next month', 'Comes out of next month\'s Ready to assign, like YNAB.'],
  carry_over: ['Carry over', 'The category starts next month below zero. Ready to assign is left alone.'],
};
const OVERSPENT_NOTE = { this_month: 'it came out of Ready to assign', next_month: 'it comes out of next month\'s Ready to assign',
                         carry_over: 'the category starts next month that far below zero' };

// Ready to assign tied to the accounts' own balances: what's in them at the end of the
// month, less what's in categories and money in still waiting in the inbox, plus
// overspending not out of it yet (budget.py's invariant). Off means something's missing.
function cashCheck(s, view) {
  if (!s.cash) return '';
  const names = s.cash.accounts;
  const parts = [`= ${money(s.cash.total)} in ${esc(names.length && names.length <= 2 ? names.join(' and ') : 'your accounts')}`];
  if (s.in_categories) parts.push(`− ${money(s.in_categories)} in categories`);
  if (s.waiting) parts.push(`− ${money(s.waiting)} waiting in the Inbox`);
  if (s.overspent_pending) parts.push(view.overspending === 'next_month'
    ? `+ ${money(s.overspent_pending)} overspent, out of ${monthOnly(addMonths(view.month, 1))}`
    : `+ ${money(s.overspent_pending)} categories still owe`);
  const off = s.off;
  return `<div class="check small ${off ? 'warn' : 'muted'}">${parts.join(' ')}${off ? ` · ${money(Math.abs(off))} off: a transfer's other half or a balance may be missing` : ''}</div>`;
}

// An Assigned box saves when you leave it (Return, Tab, or clicking elsewhere), not when
// a redraw replaces it while you're typing in it.
let redrawing = false;
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.matches && el.matches('[data-assign]') && !redrawing && el.isConnected) saveAssigned(el).catch(() => {});
});

async function saveAssigned(input) {
  const cents = amountIn(input);
  if (Number.isNaN(cents)) { toast('That isn\'t an amount', { error: true }); return; }
  const id = Number(input.dataset.assign);
  const current = findCat(id);
  if (current && (cents ?? 0) === current.assigned) { input.value = moneyOrBlank(current.assigned); return; }
  await call('set_assigned', [state.month, id, cents ?? 0]);
  await renderBudget();
  toast(`Assigned ${money(cents ?? 0)} to ${catName(id) || 'category'}`, { action: undoAction });
}
// A category's Assigned box with an arrow from each side, so it can be filled without
// typing: → assigns what's budgeted (the column to its left), ← what it spent this month
// (the column to its right). Each shows only when it would change something.
function assignBox(c) {
  const spent = -c.activity;
  const fromBudget = c.monthly_budget && c.monthly_budget !== c.assigned
    ? `<button class="copy-arrow" data-copy-budget="${c.id}" tabindex="-1" title="Assign the budgeted ${esc(money(c.monthly_budget))}">→</button>` : '';
  const fromSpent = spent > 0 && spent !== c.assigned
    ? `<button class="copy-arrow" data-copy-spent="${c.id}" tabindex="-1" title="Assign what it spent, ${esc(money(spent))}">←</button>` : '<span class="copy-gap"></span>';
  return `${fromBudget}<input class="money-input" data-assign="${c.id}" data-relative value="${moneyOrBlank(c.assigned)}" placeholder="0.00" inputmode="decimal">${fromSpent}`;
}
async function assignFromArrow(id, which) {
  const c = findCat(id);
  if (!c) return;
  const cents = which === 'spent' ? -c.activity : c.monthly_budget;
  if (!cents || cents < 0) return;
  await call('set_assigned', [state.month, id, cents]);
  await renderBudget();
  toast(`Assigned ${money(cents)} to ${c.name}`, { action: undoAction });
}
const findCat = id => { for (const g of (state.view || {}).groups || []) for (const c of g.categories) if (c.id === id) return c; return null; };

// What makes up a Spent figure: every transaction (a split counts only its line here) and,
// for a card's payment envelope, the payments and the card spending moved in. Adds up to it.
function spentCard(sp, month, { group = false, total = 'Spent' } = {}) {
  state.spentTx = sp.transactions;
  const rows = sp.lines.map(l => `<tr ${l.id ? `data-line-tx="${l.id}"` : ''}>
      <td class="muted nowrap">${l.date ? day(l.date) : ''}</td>
      <td>${esc(l.label || l.payee_name)}${l.subscription_name ? ` <span class="tag info">${esc(l.subscription_name)}</span>` : ''}${l.split ? ` <span class="tag" title="Only its ${esc(l.category_name)} line counts here">split of ${money(l.full_amount)}</span>` : ''}${l.status === 'review' ? ' <span class="tag warn">to review</span>' : ''}${l.note ? `<div class="small faint">${esc(l.note)}</div>` : ''}</td>
      ${group ? `<td class="small muted">${esc(l.category_name || '')}</td>` : ''}
      <td class="small muted">${esc(l.account_name || '')}</td>
      <td class="r num ${l.amount > 0 ? 'pos' : ''}">${money(l.amount)}</td></tr>`).join('');
  return `<div class="card" style="margin-top:12px;padding:8px 10px">
      <h2 style="padding:6px 0 0 4px">${monthLong(month)}</h2>
      ${rows ? `<table class="spent-lines"><tbody>${rows}</tbody>
          <tfoot><tr><td></td><td>${total}</td>${group ? '<td></td>' : ''}<td></td><td class="r num">${money(sp.total)}</td></tr></tfoot></table>`
        : '<p class="faint small" style="padding:0 4px">Nothing this month.</p>'}
    </div>`;
}

// A transaction clicked in a pop-over opens on top of it; the pop-over reopens afterwards
// with what changed.
async function editFromDrawer(txId, close, reopen) {
  await editTransaction(txId);
  await close();
  await reopen();
}

// What you owe on a card next to what's set aside for it: setting money aside doesn't pay
// the card, so what you owe stays the same until a payment.
function envelopeSummary(c) {
  if (!c || c.owing === undefined) return '';
  const line = (label, amount, cls = '') => `<div class="row" style="padding:3px 0"><span class="muted">${label}</span><span class="spacer"></span><b class="num ${cls}">${money(amount)}</b></div>`;
  return `<div class="card" style="margin-top:12px">${line('You owe on the card', c.owing)}${line('Set aside here to pay it', c.set_aside)}${line('Not set aside yet', c.not_covered, c.not_covered ? 'warn' : '')}</div>`;
}

async function openCategory(id) {
  const d = await call('category_detail', { category_id: id, month: state.month });
  const hist = d.history.slice(-12);
  const max = Math.max(1, ...hist.map(h => h.spent));
  const bars = hist.map(h => `<div class="bar ${h.complete ? '' : 'partial'}" title="${monthLong(h.month)}: ${money(h.spent)}">
      <em>${h.spent ? money(h.spent).replace('.00', '') : ''}</em><div style="height:${Math.max(0, h.spent) / max * 80}%"></div><span>${monthShort(h.month)}</span></div>`).join('');
  // What it spent last month, then the averages (one of a single month would repeat it).
  const useRow = (label, amount, title = '') => `<div class="row" style="padding:4px 0"${title ? ` title="${esc(title)}"` : ''}>
      <span class="muted">${label}</span><span class="spacer"></span><b class="num">${money(amount)}</b>
      <button class="btn small" data-act="use-amount" data-amount="${amount}">Use</button></div>`;
  const rec = d.recurring, recAll = [...rec.subscriptions, ...rec.bills];
  const meta = editorCat(d.id);  // used, own (Income and Interest & Fees: Hide only)
  const spentRows = useRow('Last month', d.last_month.amount, `What ${d.name} actually spent in ${monthLong(d.last_month.month)}`) +
    Object.values(d.averages).filter(a => a.months > 1).map(a => useRow(`Last ${a.months} months`, a.amount, 'Average of what was actually spent')).join('') +
    (recAll.length ? useRow('Recurring charges', rec.monthly, 'What its subscriptions and bills below come to a month') : '');
  // The recurring charges whose category this is (where their next charge goes), each
  // opening its Edit… pop-up.
  const recCard = (title, list) => list.length ? `<div class="card" style="margin-top:12px"><h2>${title}</h2>
      <table class="spent-lines rec-lines"><tbody>${list.map(x => `<tr data-sub-line="${x.id}" title="Edit ${esc(x.name)}">
        <td>${esc(x.name)}</td><td class="r num nowrap">${priceCell(x)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const bg = document.createElement('div'); bg.className = 'drawer-bg';
  const dr = document.createElement('div'); dr.className = 'drawer';
  dr.innerHTML = `
    <div class="row">${d.debt_account_id ? `<h3 style="margin:0">${esc(d.name)}</h3>`
      : `<input id="cat-name" class="cat-name" value="${esc(d.name)}" title="Click to rename" aria-label="Name">`}<span class="spacer"></span><button class="icon-btn" data-close>✕</button></div>
    ${d.debt_account_id ? `<p class="muted small">Money set aside to pay the card. It stays in your bank account until you pay the card. Card spending from a category with money is set aside here automatically; assign more here to cover the rest.</p>
      ${envelopeSummary(findCat(d.id))}` : ''}
    ${spentCard(d.spent, d.month, { total: d.debt_account_id ? 'This month' : 'Spent' })}
    ${d.debt_account_id ? '' : `<div class="card" style="margin-top:12px">
      <div class="row"><h2 style="margin:0">Monthly Budgeted Amount</h2><span class="spacer"></span><span id="monthly-status" class="small muted"></span></div>
      <p class="small muted" style="margin:4px 0 0">What it actually spent (refunds count).</p>
      <div class="bars">${bars || '<span class="faint">No spending yet</span>'}</div>
      <div style="margin-top:10px">${spentRows}</div>
      <div class="row" style="padding:8px 0 0;margin-top:6px;border-top:1px solid var(--line)"><b>Budgeted</b><span class="spacer"></span>
        <input id="monthly-input" class="num" style="width:110px;text-align:right" inputmode="decimal" data-relative
          value="${d.monthly_budget === null ? '' : moneyPlain(d.monthly_budget)}" placeholder="Not set">
        <button class="btn small ghost" data-act="use-amount" data-amount="">Clear</button></div>
    </div>`}
    ${recCard('Subscriptions', rec.subscriptions)}${recCard('Bills', rec.bills)}
    <div class="card" style="margin-top:12px">
      <h2>Move money</h2>
      <div class="row wrap"><input id="move-amount" style="width:110px;text-align:right" placeholder="0.00">
        <button class="btn" data-act="move-to" data-cat="${d.id}">Move to…</button>
        <button class="btn" data-act="move-from" data-cat="${d.id}">Take from…</button></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="row"><h2 style="margin:0">Notes</h2><span class="spacer"></span><span id="note-status" class="small muted"></span></div>
      <textarea id="cat-note" rows="4" style="width:100%;margin-top:8px;resize:vertical" placeholder="Anything to remember about ${esc(d.name)}: when it renews, what it covers…">${esc(d.note || '')}</textarea>
    </div>
    ${d.debt_account_id ? '' : `<div class="row" style="margin-top:14px;gap:8px">
      <button class="btn small" data-act="cat-hide">${d.hidden ? 'Show' : 'Hide'}</button>
      ${meta && meta.own ? '' : '<button class="btn small danger" data-act="cat-delete">Delete…</button>'}</div>`}`;
  document.body.append(bg, dr);

  // Both the budgeted amount and the note save as they're typed.
  let changed = false;
  let savedMonthly = d.monthly_budget, savedNote = d.note || '';
  const show = (el, text, bad = false) => { if (el) { el.textContent = text; el.className = 'small ' + (bad ? 'neg' : 'muted'); } };
  const monthlyInput = $('#monthly-input', dr), monthlyStatus = $('#monthly-status', dr);
  const noteInput = $('#cat-note', dr), noteStatus = $('#note-status', dr);
  const saveMonthly = async () => {
    if (!monthlyInput) return;
    const cents = amountIn(monthlyInput);
    if (Number.isNaN(cents) || (cents !== null && cents < 0)) return show(monthlyStatus, 'Not an amount', true);
    if (cents === savedMonthly) return show(monthlyStatus, monthlyStatus.textContent === 'Not an amount' ? '' : monthlyStatus.textContent);
    savedMonthly = cents;
    show(monthlyStatus, 'Saving…');
    try {
      await call('set_monthly_budget', [d.id, cents]);
      changed = true;
      show(monthlyStatus, cents === null ? 'Cleared' : 'Saved');
    } catch (_) { savedMonthly = undefined; show(monthlyStatus, 'Not saved', true); }
  };
  const saveNote = async () => {
    const text = noteInput.value;
    if (text === savedNote) return;
    savedNote = text;
    show(noteStatus, 'Saving…');
    try { await call('set_category_note', [d.id, text]); show(noteStatus, 'Saved'); }
    catch (_) { savedNote = undefined; show(noteStatus, 'Not saved', true); }
  };
  if (monthlyInput) {
    monthlyInput.addEventListener('input', debounce(saveMonthly, 600));
    monthlyInput.addEventListener('change', saveMonthly);
    monthlyInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); monthlyInput.blur(); } });
  }
  noteInput.addEventListener('input', debounce(saveNote, 700));
  noteInput.addEventListener('change', saveNote);
  // The name saves when you leave it (Return too); Escape puts it back. A refused name
  // (one another category has) goes back as well.
  const nameInput = $('#cat-name', dr);
  let savedName = d.name;
  const saveName = async () => {
    if (!nameInput) return;
    const name = nameInput.value.replace(/\s+/g, ' ').trim();
    if (name === savedName) return;
    if (!name) { nameInput.value = savedName; return; }
    try {
      await call('rename_category', [d.id, name]);
      savedName = name; nameInput.value = name; changed = true;
      await loadCategories();  // the new name everywhere it's looked up (a bill's Edit… pop-up)
    } catch (_) { nameInput.value = savedName; }
  };
  if (nameInput) {
    nameInput.addEventListener('change', saveName);
    nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); nameInput.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); nameInput.value = savedName; nameInput.blur(); }
    });
  }

  const close = async () => {
    document.removeEventListener('keydown', onKey);
    await Promise.all([saveMonthly(), saveNote(), saveName()]);  // anything typed in the last moment
    bg.remove(); dr.remove();
    if (changed) { await loadCategories(); await renderBudget(); }
  };
  // Marked handled, or the app's window passes Escape on and macOS plays its warning sound.
  const onKey = e => { if (e.key === 'Escape' && !$('#dlg').open && !$('.popover')) { e.preventDefault(); close(); } };
  document.addEventListener('keydown', onKey);
  bg.onclick = close;
  dr.addEventListener('click', async e => {
    if (e.target.closest('[data-close]')) return close();
    const line = e.target.closest('[data-line-tx]');
    if (line) return editFromDrawer(Number(line.dataset.lineTx), close, () => openCategory(id));
    const sub = e.target.closest('[data-sub-line]');
    if (sub) {
      await editSubscriptionDialog(recAll.find(x => x.id === Number(sub.dataset.subLine)));
      await close();
      return openCategory(id);
    }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act, cat = Number(btn.dataset.cat);
    if (act === 'use-amount') {
      monthlyInput.value = btn.dataset.amount === '' ? '' : moneyPlain(Number(btn.dataset.amount));
      await saveMonthly();
    } else if (act === 'cat-hide') {
      await call('set_category_hidden', [d.id, !d.hidden]);
      changed = true;
      await close();
      toast(d.hidden ? `${d.name} is back` : `${d.name} hidden`, { action: undoAction });
    } else if (act === 'cat-delete') {
      // The same question as onboarding's ✕: deleted if never used, else Hide.
      const q = await deleteQuestion({ ...(meta || {}), id: d.id, name: savedName, hidden: d.hidden });
      const yes = await dialog({ title: q.yes === 'Delete' ? `Delete ${savedName}` : savedName, body: `<p>${esc(q.text)}</p>`,
        actions: q.yes ? [{ label: 'Cancel', value: false }, { label: q.yes, value: true, primary: !q.danger, danger: q.danger }]
          : [{ label: 'OK', value: false, primary: true }] });
      if (!yes) return;
      await q.run();
      changed = true;
      await close();
      toast(q.done, { action: undoAction });
    } else if (act === 'move-to' || act === 'move-from') {
      const cents = parseMoney($('#move-amount', dr).value);
      if (!cents || cents < 0) return toast('Enter an amount to move', { error: true });
      const other = await pickCategory(btn, { income: false, title: act === 'move-to' ? 'Move to…' : 'Take from…' });
      if (!other) return;
      const [from, to] = act === 'move-to' ? [cat, other] : [other, cat];
      await call('move_money', [state.month, from, to, cents]);
      changed = true;
      await close();
      toast(`Moved ${money(cents)} from ${catName(from)} to ${catName(to)}`, { action: undoAction });
    }
  });
}

// What makes up one Spent figure (a group's, or a category's on the Dashboard), in a
// pop-over; `which` is spent_detail's {month, group_id or category_id}.
async function openSpent(which, { total = 'Spent' } = {}) {
  const d = await call('spent_detail', which);
  const bg = document.createElement('div'); bg.className = 'drawer-bg';
  const dr = document.createElement('div'); dr.className = 'drawer';
  dr.innerHTML = `<div class="row"><h3 style="margin:0">${esc(d.name)}</h3><span class="spacer"></span><button class="icon-btn" data-close>✕</button></div>
    ${spentCard(d, d.month, { group: d.group, total })}`;
  document.body.append(bg, dr);
  const close = async () => { document.removeEventListener('keydown', onKey); bg.remove(); dr.remove(); };
  const onKey = e => { if (e.key === 'Escape' && !$('#dlg').open && !$('.popover')) { e.preventDefault(); close(); } };
  document.addEventListener('keydown', onKey);
  bg.onclick = close;
  dr.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return close();
    const line = e.target.closest('[data-line-tx]');
    if (line) editFromDrawer(Number(line.dataset.lineTx), close, () => openSpent(which, { total }));
  });
}

async function openAssign(amount) {
  const plan = await call('assign_plan', { month: state.month, amount: amount ?? null });
  const rows = plan.plan.map((p, i) => `<tr><td>${esc(p.name)} <span class="faint small">${esc(p.group)}</span>${p.covered ? ` <span class="tag warn" title="Already spent, so it came out of Ready to assign: assigning up to this costs nothing">overspent ${money(p.covered)}</span>` : ''}</td>
      <td class="r num muted">${money(p.monthly_budget)}</td>
      <td class="r num ${p.has < 0 ? 'neg' : 'muted'}">${money(p.has)}</td>
      <td class="r"><input class="money-input" style="box-shadow: inset 0 0 0 1px var(--line-strong) !important" data-i="${i}" data-relative value="${moneyOrBlank(p.amount)}" placeholder="0.00"></td></tr>`).join('');
  const body = `
    <div class="field"><label>Amount to share out</label>
      <div class="row"><input id="assign-amount" style="width:140px;text-align:right" value="${moneyPlain(plan.amount)}"><button type="button" class="btn small" id="assign-recalc">Recalculate</button>
      <span class="muted small">Ready to assign: ${money(plan.ready_to_assign)}</span></div></div>
    ${plan.plan.length ? `<p class="small muted" style="margin-top:0">"Budgeted" is only the plan: money is in a category once it's assigned. This tops each one up to its budgeted amount, in budget order.</p>
      <table><thead><tr><th>Category</th><th class="r">Budgeted</th><th class="r">Already in</th><th class="r">Assign</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="small" id="assign-left">Left over: <b>${money(plan.left_over)}</b></p>`
      : `<div class="notice info">No category has a budgeted amount yet. Click a category on the Budget page to set one (it shows what it actually spent), or type amounts straight into the Assigned column.</div>`}
    ${plan.without_monthly_amount.length && plan.plan.length ? `<p class="small faint">Not budgeted: ${esc(plan.without_monthly_amount.join(', '))}</p>` : ''}`;
  const result = await dialog({
    title: `Assign money in ${monthOnly(state.month)}`, body, wide: true,
    actions: plan.plan.length ? [{ label: 'Cancel', value: null }, { label: 'Assign', value: 'go', primary: true }] : [{ label: 'OK', value: null, primary: true }],
    onOpen: d => {
      const left = () => {
        const total = parseMoney($('#assign-amount', d).value) || 0;
        const used = $$('[data-i]', d).reduce((s, el) => {  // covering overspending is already paid for
          const v = amountIn(el) || 0;
          return s + (v > 0 ? Math.max(0, v - plan.plan[Number(el.dataset.i)].covered) : v);
        }, 0);
        const el = $('#assign-left', d); if (el) el.innerHTML = `Left over: <b class="${total - used < 0 ? 'neg' : ''}">${money(total - used)}</b>`;
      };
      $$('[data-i]', d).forEach(el => el.addEventListener('input', left));
      const recalc = $('#assign-recalc', d);
      recalc.onclick = async () => {
        const v = parseMoney($('#assign-amount', d).value);
        if (Number.isNaN(v)) return;
        d.close();
        openAssign(v);
      };
    },
  });
  if (result !== 'go') return;
  const allocations = $$('#dlg [data-i]').map(el => ({ category_id: plan.plan[Number(el.dataset.i)].category_id, amount: amountIn(el) || 0 })).filter(a => a.amount);
  if (!allocations.length) return;
  await call('apply_plan', [state.month, allocations]);
  await renderBudget();
  toast(`Assigned ${money(allocations.reduce((s, a) => s + a.amount, 0))}`, { action: undoAction });
}

// ── categories editor (onboarding) ──────────────────────
// Onboarding's list of categories (after it, they're edited on the Budget page). Rows are
// dragged by their handle (⋮⋮): a category within its group or into another ordinary
// one, a category group among the others. Income's and the cards' categories stay where
// they are (move_category). ✕ is on every category you made and always asks first: one
// never used is deleted, a used one can only be hidden. Blanks keep the rows in line
// where a handle or a ✕ isn't offered.
const NO_DELETE = '<button type="button" class="icon-btn" style="visibility:hidden" tabindex="-1" aria-hidden="true">✕</button>';
const NO_HANDLE = '<span class="drag-handle" style="visibility:hidden" aria-hidden="true">⋮⋮</span>';
function categoryEditorHtml(groups) {
  return `<div class="cat-editor">${groups.map(g => {
    const normal = g.role === 'normal';
    return `<div class="grp" data-group="${g.id}" data-role="${g.role}">
      <div class="grp-head">
        ${g.role !== 'income' ? `<span class="drag-handle" data-drag-group="${g.id}" title="Drag to move">⋮⋮</span>` : NO_HANDLE}
        <input value="${esc(g.name)}" data-rename-group="${g.id}" ${normal ? '' : 'disabled'}>
        ${normal ? (g.categories.length ? NO_DELETE : `<button type="button" class="icon-btn danger" data-delete-group="${g.id}" title="Delete group">✕</button>`)
          : `<span class="tag">${g.role === 'income' ? 'Income' : 'Cards'}</span>`}
      </div>
      <div class="grp-cats"><div>
        ${g.categories.map(c => `<div class="cat-row" data-cat-row="${c.id}">
          ${normal ? `<span class="drag-handle" data-drag-cat="${c.id}" title="Drag to move">⋮⋮</span>` : NO_HANDLE}
          <input value="${esc(c.name)}" data-rename-cat="${c.id}" ${c.debt_account_id ? 'disabled' : ''}>
          ${c.debt_account_id ? '<span class="tag">Card payment</span>' : `
          <button type="button" class="icon-btn" data-hide-cat="${c.id}" data-hidden="${c.hidden}" title="${c.hidden ? 'Show' : 'Hide'}">${c.hidden ? 'Show' : 'Hide'}</button>
          ${c.own ? NO_DELETE : `<button type="button" class="icon-btn danger" data-delete-cat="${c.id}" title="Delete">✕</button>`}`}
        </div>`).join('')}
        ${g.role !== 'debt' ? `<div class="cat-row add-row">${NO_HANDLE}<input placeholder="Add a category…" data-add-cat="${g.id}"></div>` : ''}
      </div></div>
    </div>`;
  }).join('')}
    <div class="row"><input placeholder="Add a group…" data-add-group style="flex:1"></div>
  </div>`;
}
const allCategories = () => state.categories.flatMap(g => g.categories.map(c => ({ ...c, group: g })));
const editorCat = id => allCategories().find(c => c.id === id) || null;
const sameName = (a, b) => a.replace(/\s+/g, ' ').trim().toLowerCase() === b.replace(/\s+/g, ' ').trim().toLowerCase();
const andList = xs => xs.length > 1 ? `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}` : xs[0];

// What a category's ✕ (onboarding's list) or Delete… (its pop-over) asks: one never used
// is deleted, a used one says what it's used by and can only be hidden. {text, yes,
// danger, run, done}; without `yes` there's only OK.
async function deleteQuestion(cat) {
  if (!cat.used) {
    return { text: `Delete ${cat.name}? It's never been used, so nothing else changes.`, yes: 'Delete', danger: true,
      run: () => call('delete_category', [cat.id]), done: 'Category deleted' };
  }
  const u = await call('category_uses', [cat.id]);
  const what = [u.transactions && plural(u.transactions, 'transaction'), u.assigned && 'money assigned',
    u.recurring && plural(u.recurring, 'recurring charge'), u.examples && 'examples learnt from Actual'].filter(Boolean);
  const why = what.length ? `${cat.name} has ${andList(what)}, so it can't be deleted.` : `${cat.name} has been used, so it can't be deleted.`;
  if (cat.hidden) return { text: `${why} It's hidden already: it keeps its history but isn't offered for new transactions.` };
  return { text: `${why} Hide it? It keeps its history and money but isn't offered for new transactions.`, yes: 'Hide',
    run: () => call('set_category_hidden', [cat.id, true]), done: `${cat.name} hidden` };
}

// `host` is made for this list each time it's drawn, so its handlers go with it (bound to
// the shared pop-up the editor once was in, they piled up, one more set per opening, and
// a Return then added a category once per set).
function bindCategoryEditor(host) {
  const FOCUSABLE = ['data-rename-group', 'data-rename-cat', 'data-add-cat', 'data-add-group'];
  // Redrawn after every change, keeping the box you're in (Tab after a rename moved you on).
  const rerender = () => {
    if (state.dragging) return;
    const a = document.activeElement;
    const attr = a && host.contains(a) ? FOCUSABLE.find(n => a.hasAttribute(n)) : null;
    const value = attr && a.getAttribute(attr);
    host.innerHTML = categoryEditorHtml(state.categories);
    const again = attr && host.querySelector(value ? `[${attr}="${value}"]` : `[${attr}]`);
    if (again) again.focus();
  };
  const run = async (fn, msg) => {
    let ok = false;
    try { await fn(); ok = true; } catch (_) {}
    await loadCategories(); rerender();  // also after a refusal, so a refused name goes back
    if (ok && msg) toast(msg, { action: undoAction });
    return ok;
  };
  // The ✕'s question (and "Show it again?"), in a strip under the row: the editor is
  // itself a pop-up, so another one can't open over it.
  const ask = (after, text, yes, onYes, danger = false) => {
    host.querySelectorAll('.cat-confirm').forEach(x => x.remove());
    const strip = document.createElement('div');
    strip.className = 'cat-confirm';
    strip.innerHTML = `<span>${esc(text)}</span><span class="spacer"></span>
      <button type="button" class="btn small" data-confirm="no">${yes ? 'Cancel' : 'OK'}</button>
      ${yes ? `<button type="button" class="btn small ${danger ? 'danger' : 'primary'}" data-confirm="yes">${esc(yes)}</button>` : ''}`;
    strip.onYes = onYes;
    after.after(strip);
